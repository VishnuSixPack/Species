<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All modules · SmarTuna concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="sc-blue-logo.png">
<style>
  @font-face{font-family:'Bitsumis';src:url('BITSUMIS.TTF') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
  :root{
    --brand:#2059a8; --accent:#2f6fed; --accent-soft:rgba(47,111,237,.10);
    --ink:#14161a; --muted:#6b7380; --line:#e6e8ec; --page:#f6f7f9; --white:#fff;
    --mono:Consolas,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;font-weight:400;font-size:14px;font-synthesis:none;color:var(--ink);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased}
  b,strong,h1,h2,h3{font-weight:400}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1680px;margin:0 auto;padding:0 clamp(18px,3.4vw,56px)}
  .mono{font-family:var(--mono)}

  /* header */
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px}
  .brand{display:flex;align-items:center;gap:10px;flex:none}
  .brand img{height:32px;width:auto;display:block}
  .wm{display:inline-flex;flex-direction:column;line-height:1}
  .wm-top{font-family:'Bitsumis',Poppins,sans-serif;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
  .wm-top span{color:var(--accent)}
  .wm-sub{font-family:'Bitsumis',Poppins,sans-serif;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .links{position:relative;display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--white);font-size:13px;color:var(--muted)}
  .links .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--accent);box-shadow:0 6px 16px rgba(47,111,237,.3);opacity:0;transition:left .45s cubic-bezier(.34,1.56,.64,1),width .45s cubic-bezier(.34,1.56,.64,1),opacity .2s}
  .nav-item{position:relative;z-index:1;display:block;padding:6px 15px;border-radius:999px;font-weight:300;white-space:nowrap;transition:color .25s}
  .nav-item:hover{color:var(--ink)}
  .nav-item.hl,.nav-item.hl:hover{color:#fff}
  .nav-item-wrap{position:relative;z-index:1}
  .nav-item-wrap::after{content:"";position:absolute;top:100%;left:0;width:100%;height:12px}
  .nav-item-wrap:hover .nav-dropdown,.nav-item-wrap:focus-within .nav-dropdown{display:block}
  .nav-dropdown{display:none;position:absolute;top:calc(100% + 10px);left:0;min-width:200px;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(16,24,40,.12);padding:6px;animation:drop .18s ease}
  @keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .nav-dropdown a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px;font-weight:300;color:var(--ink);border-radius:9px;white-space:nowrap}
  .nav-dropdown a:hover{background:var(--page);color:var(--accent)}
  .nav-dropdown .all{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;color:var(--accent);font-family:var(--mono);font-size:12px}
  .right{display:flex;align-items:center;gap:12px}
  .back{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:300;color:var(--muted);transition:color .2s,border-color .2s}
  .back:hover{color:var(--accent);border-color:var(--accent)}
  .back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .avatar-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;overflow:hidden;flex:none}
  .avatar-btn img{width:100%;height:100%;object-fit:cover}

  /* hero */
  .hero{background:linear-gradient(180deg,#eef3fc 0%,#fff 100%)}
  .hero .wrap{padding-top:44px;padding-bottom:26px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:12.5px;color:var(--accent);letter-spacing:.04em}
  h1{font-size:clamp(28px,3.2vw,40px);font-weight:300;letter-spacing:-.02em;line-height:1.15;margin:8px 0 6px}
  .lead{margin:0;color:var(--muted);font-weight:300;font-size:15px}
  .search{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:44px;width:min(360px,100%);transition:border-color .2s,box-shadow .2s}
  .search svg{flex:none;color:var(--muted)}
  .search input{border:0;outline:none;background:transparent;font:inherit;font-size:13.5px;font-weight:300;color:var(--ink);width:100%}
  .search input::placeholder{color:#b3bac6}
  .search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(47,111,237,.10)}

  /* tabs with a sliding pill */
  .tabs-row{position:sticky;top:64px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .tabs-row .wrap{padding-top:10px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .tabs{position:relative;display:inline-flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--white)}
  .tabs .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--accent);box-shadow:0 6px 16px rgba(47,111,237,.3);transition:left .45s cubic-bezier(.34,1.56,.64,1),width .45s cubic-bezier(.34,1.56,.64,1)}
  .tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:300;color:var(--muted);white-space:nowrap;transition:color .3s}
  .tab span{font-family:var(--mono);font-size:11px;opacity:.7}
  .tab:hover{color:var(--ink)}
  .tab.on,.tab.on:hover{color:#fff}
  .tab:focus-visible,.mod:focus-visible,.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* groups and cards */
  main{padding:28px 0 64px;background:radial-gradient(circle at 1px 1px,#e7ecf5 1px,transparent 1.2px) 0 0/22px 22px}
  .group{margin-bottom:36px;scroll-margin-top:140px}
  .group-h{margin-bottom:14px}
  .group-h h2{font-size:clamp(20px,1.8vw,24px);font-weight:300;letter-spacing:-.01em;margin:4px 0 0}
  .group-h p{margin:2px 0 0;font-size:13px;font-weight:300;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .mod{position:relative;display:flex;gap:16px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:110px;transition:border-color .2s,transform .2s,box-shadow .2s;animation:up .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 40ms)}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mod:hover{border-color:#cdd9f2;transform:translateY(-3px);box-shadow:0 14px 34px rgba(16,24,40,.07)}
  .mod .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .3s}
  .mod:hover .ic{transform:rotate(-6deg) scale(1.05)}
  .mod .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .mod > span:not(.ic){padding-right:20px;min-width:0}
  .mod b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:15px;font-weight:400;margin-bottom:4px}
  .mod small{display:block;font-size:13px;font-weight:300;color:var(--muted);line-height:1.55}
  .mod .go{position:absolute;top:18px;right:18px;color:#c3cad6;transition:color .2s,transform .2s}
  .mod:hover .go{color:var(--accent);transform:translateX(3px)}
  .badge{font-family:var(--mono);font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid}
  .badge.new{color:var(--accent);border-color:#cddcf8;background:#f3f7ff}
  .badge.beta{color:#9a6a12;border-color:#efdcae;background:#fdf7e7}
  .badge.soon{color:var(--muted);border-color:var(--line);background:var(--page)}
  .mod.soon{opacity:.6;cursor:default}
  .mod.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .mod.soon:hover .ic{transform:none}
  .empty{background:var(--white);border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted);font-weight:300}
  mark{background:#fff3c4;color:inherit;border-radius:3px;padding:0 1px}

  @media (max-width:1100px){ .links{display:none} }
  @media (max-width:620px){ .grid{grid-template-columns:1fr} .search kbd{display:none} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="home-logged-in.html" aria-label="SmarTuna home">
      <img src="sc-blue-logo.png" alt="" onerror="this.style.display='none'">
      <span class="wm"><span class="wm-top">Smar<span>Tuna</span></span><span class="wm-sub">concept</span></span>
    </a>
    <div class="right">
    <a class="back" href="home-logged-in.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Dashboard</a>
    <a class="avatar-btn" id="avatarBtn" href="profile.html" aria-label="Your profile"><span id="avatarInitials">··</span></a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div><span class="eyebrow" id="eyebrow">// modules</span><h1 id="title">All modules</h1><p class="lead" id="subtitle">Everything in SmarTuna, grouped the same way as the menu.</p></div>
    <label class="search" for="q">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="search" placeholder="Search modules" autocomplete="off" aria-label="Search modules"><kbd>/</kbd>
    </label>
  </div>
</section>
<div class="tabs-row"><div class="wrap"><div class="tabs" id="tabs" role="tablist" aria-label="Module groups"><span class="ind"></span></div></div></div>

<main><div class="wrap">
  <div id="groups"></div>
</div></main>

<script>
/* One list drives the cards, the tabs and the menu dropdowns.
   To add a module: add a line to its group. href:null shows it as "Coming soon". */
const I = {
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  fish:'<path d="M3 12c3-5 9-7 14-4l4-3v14l-4-3c-5 3-11 1-14-4z"/><circle cx="15" cy="11" r=".8"/>',
  ship:'<path d="M3 17c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0"/><path d="M5 14l-1-5h16l-1 5"/><path d="M9 9V5h6v4"/>',
  building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>',
  leaf:'<path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l7-7"/>',
  species:'<circle cx="12" cy="12" r="9"/><path d="M8 12c2-3 6-3 8 0-2 3-6 3-8 0z"/>',
  snow:'<path d="M12 2v20M4.9 6.5l14.2 11M19.1 6.5 4.9 17.5"/>',
  anchor:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13a7 7 0 0 0 14 0M8 11h8"/>',
  vessel:'<path d="M2 18h20l-3 3H5z"/><path d="M6 18V9h12v9M10 9V5h4v4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  wave:'<path d="M2 12c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3M2 17c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/>',
  farm:'<path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  doc:'<path d="M9 3h6l4 4v14H5V3z"/><path d="M9 12l2 2 4-4"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  truck:'<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  life:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'
};
const GROUPS = [
  { id:"my-studio", name:"My Studio", about:"Your company's own records", items:[
    { name:"Product", href:"product-list.html", icon:"box", about:"Your products, GTINs and packaging" },
    { name:"Evidence", href:"evidence-list.html", icon:"file", about:"Certificates and documents behind every claim" },
    { name:"Raw Materials", href:"raw-material-list.html", icon:"fish", about:"Raw material lots and where they came from" },
    { name:"Shipments", href:"shipment-list.html", icon:"ship", about:"Every shipment, its route and status" },
    { name:"Your Company", href:"organisation.html", icon:"building", about:"Company profile, sites and team" },
    { name:"Carbon Calculator", href:"carbon-calculator.html", icon:"leaf", about:"Estimate the carbon footprint of a product" }
  ]},
  { id:"atlas", name:"Atlas", about:"Reference data shared across the platform", items:[
    { name:"Species", href:"Species.html", icon:"species", about:"Species database with taxonomy and trade data" },
    { name:"Cold Storage", href:"cold-storage-list.html", icon:"snow", about:"Cold storage facilities" },
    { name:"Ports", href:"port-list.html", icon:"anchor", about:"Ports with UN/LOCODE and country" },
    { name:"Vessels", href:"vessel-list.html", icon:"vessel", about:"Fishing and carrier vessels" },
    { name:"Country", href:"country.html", icon:"globe", about:"Countries with regulatory and trade data" },
    { name:"MSC Fisheries", href:"fishery.html", icon:"wave", about:"MSC certified fisheries" },
    { name:"ASC Farms", href:"asc-farms.html", icon:"farm", about:"ASC certified farms" }
  ]},
  { id:"features", name:"Features", about:"Tools that work across your data", items:[
    { name:"SmarTuna A.I", href:"smartuna-ai.html", icon:"spark", badge:"new", about:"Ask questions about your data in plain language" },
    { name:"SmarTuna Assistant", href:"smartuna-assistant.html", icon:"mic", badge:"beta", about:"Voice assistant for the dashboard" },
    { name:"EU CATCH Form", href:"eu-catch-support.html", icon:"doc", about:"Prepare EU catch certificate data", tag:"Compliance" },
    { name:"NOAA SIMP", href:"simp-support.html", icon:"shield", badge:"new", about:"US Seafood Import Monitoring Program support", tag:"Compliance" },
    { name:"FSMA Act 204", href:"fsma-support.html", icon:"shield", badge:"new", about:"FDA food traceability rule support", tag:"Compliance" },
    { name:"Load Planner", href:"load-planner-home.html", icon:"truck", about:"Plan how cargo fits in a container" }
  ]},
  { id:"messages", name:"Messages", about:"Conversations with your partners", items:[
    { name:"Messages", href:null, icon:"chat", about:"Message suppliers, buyers and your team" }
  ]},
  { id:"reports", name:"Reports", about:"Exports and reporting", items:[
    { name:"Data Export Centre", href:"report-center.html", icon:"down", about:"Export module data with filters and templates" },
    { name:"Reports", href:null, icon:"chart", about:"Ready-made reports and charts" }
  ]},
  { id:"support", name:"Support", about:"Help when something's wrong", items:[
    { name:"Ask a question", href:"support.html#ask", icon:"mail", about:"Questions about SmarTuna and your data" },
    { name:"Report a problem", href:"support.html#report", icon:"life", about:"Tell us about a bug or something not working" },
    { name:"My requests", href:"support.html#mine", icon:"doc", about:"Follow the questions and reports you sent" }
  ]}
];

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k] || I.box}</svg>`;
const ARROW = '<svg class="go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
let current = "all";

function hl(text, q){
  const t = esc(text); if (!q) return t;
  const i = text.toLowerCase().indexOf(q); if (i < 0) return t;
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}
function card(m, q, i = 0){
  const badge = m.badge ? `<span class="badge ${m.badge}">${m.badge === "new" ? "New" : "Beta"}</span>` : !m.href ? `<span class="badge soon">Coming soon</span>` : "";
  const inner = `<span class="ic">${svg(m.icon)}</span><span><b>${hl(m.name, q)}${badge}</b><small>${hl(m.about, q)}${m.tag ? ` · ${esc(m.tag)}` : ""}</small></span>`;
  return m.href ? `<a class="mod" style="--i:${i}" href="${esc(m.href)}">${inner}${ARROW}</a>` : `<div class="mod soon" style="--i:${i}" aria-disabled="true">${inner}</div>`;
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const groups = GROUPS.filter(g => current === "all" || g.id === current)
    .map(g => ({ ...g, list: g.items.filter(m => !q || [m.name, m.about, m.tag || ""].some(v => v.toLowerCase().includes(q))) }))
    .filter(g => g.list.length);
  $("#groups").innerHTML = groups.length ? groups.map(g => `<section class="group" id="g-${g.id}" aria-labelledby="h-${g.id}">
      ${current === "all" || q ? `<div class="group-h"><span class="eyebrow">// ${esc(g.name.toLowerCase())}</span><h2 id="h-${g.id}">${esc(g.name)}</h2><p>${esc(g.about)}</p></div>` : `<h2 id="h-${g.id}" hidden>${esc(g.name)}</h2>`}
      <div class="grid">${g.list.map((m, i) => card(m, q, i)).join("")}</div></section>`).join("")
    : `<div class="empty">No modules match “${esc($("#q").value.trim())}”.</div>`;
  const g = GROUPS.find(x => x.id === current);
  $("#title").textContent = g ? g.name : "All modules";
  $("#eyebrow").textContent = g ? "// " + g.name.toLowerCase() : "// modules";
  $("#subtitle").textContent = g ? g.about : "Everything in SmarTuna, grouped the same way as the menu.";
  document.title = (g ? g.name : "All modules") + " · SmarTuna concept";
  document.querySelectorAll(".tab").forEach(t => { const on = t.dataset.g === current; t.classList.toggle("on", on); t.setAttribute("aria-selected", on); });
  slide($("#tabs"), $(".tab.on"));
}
/* sliding pills, as on the public pages */
function slide(wrap, el){
  const ind = wrap && wrap.querySelector(".ind"); if (!ind) return;
  if (!el){ ind.style.opacity = 0; wrap.querySelectorAll(".nav-item").forEach(x => x.classList.remove("hl")); return; }
  const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  ind.style.opacity = 1; ind.style.left = (r.left - w.left) + "px"; ind.style.width = r.width + "px";
  wrap.querySelectorAll(".nav-item").forEach(x => x.classList.toggle("hl", x === el));
}
window.addEventListener("resize", () => slide($("#tabs"), $(".tab.on")));
