<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All modules · SmarTuna concept</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="sc-blue-logo.png">
<style>
  @font-face{font-family:'Bitsumis';src:url('BITSUMIS.TTF') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--primary:#1a6fdb;--bg:#f0f2f7;--white:#fff;--text:#1a1a2e;--muted:#6b7280;--faint:#9aa0b4;--border:#e8eaf0;--soft:#eef4fd}
  body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-weight:400}
  a{color:inherit}

  /* ── top bar (same as the dashboard) ── */
  .sc-wm{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;text-decoration:none}
  .sc-wm-top{font-family:'Bitsumis',sans-serif;font-size:16px;letter-spacing:.04em;text-transform:uppercase;line-height:1;color:var(--primary)}
  .sc-wm-sub{font-family:'Bitsumis',sans-serif;font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:var(--text);margin-top:2px}
  .topbar{display:flex;align-items:center;padding:10px 28px;gap:20px;position:sticky;top:0;z-index:50;background:rgba(240,242,247,.92);backdrop-filter:blur(8px)}
  .topbar-brand{text-decoration:none;flex-shrink:0;display:flex;align-items:center;gap:8px}
  .topbar-brand img{width:28px;height:28px;object-fit:contain}
  .topbar-nav{flex:1;display:flex;justify-content:center;min-width:0}
  .nav-pill{display:inline-flex;align-items:center;gap:2px;background:var(--white);border-radius:999px;padding:5px 7px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
  .nav-item{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);text-decoration:none;transition:background .15s,color .15s;white-space:nowrap}
  .nav-item img{width:15px;height:15px;object-fit:contain;opacity:.5}
  .nav-item:hover{background:var(--bg);color:var(--text)}
  .nav-item.active{background:var(--bg);color:var(--text);font-weight:500}
  .nav-item:hover img,.nav-item.active img{opacity:1}
  .nav-item-wrap{position:relative}
  .nav-item-wrap::after{content:'';position:absolute;top:100%;left:0;width:100%;height:12px}
  .nav-item-wrap:hover .nav-dropdown,.nav-item-wrap:focus-within .nav-dropdown{display:block}
  .nav-dropdown{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.10);min-width:170px;z-index:500;padding:6px}
  .nav-dropdown a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px;color:#4a4e69;text-decoration:none;border-radius:8px;white-space:nowrap}
  .nav-dropdown a:hover{background:var(--bg);color:var(--primary)}
  .nav-dropdown .all{border-top:1px solid var(--border);margin-top:4px;padding-top:9px;color:var(--primary)}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);text-decoration:none}
  .avatar-btn img{width:100%;height:100%;object-fit:cover}

  /* ── page ── */
  .page{max-width:1440px;margin:0 auto;padding:18px 28px 48px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .head h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
  .head p{font-size:13px;color:var(--muted);margin-top:2px}
  .search{display:flex;align-items:center;gap:8px;background:var(--white);border-radius:999px;padding:0 16px;height:40px;box-shadow:0 1px 4px rgba(0,0,0,.06);width:min(320px,100%)}
  .search svg{flex:none;color:var(--faint)}
  .search input{border:0;outline:none;background:transparent;font:inherit;font-size:13px;color:var(--text);width:100%}
  .search input::placeholder{color:#b3bac6}
  .search:focus-within{box-shadow:0 0 0 3px rgba(26,111,219,.15)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .tab{border:1px solid var(--border);background:var(--white);color:var(--muted);font:inherit;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .tab span{font-size:11px;color:var(--faint)}
  .tab:hover{color:var(--text);border-color:#cfd5de}
  .tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab.on span{color:rgba(255,255,255,.75)}
  .tab:focus-visible,.mod:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  .group{margin-bottom:26px;scroll-margin-top:80px}
  .group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .group-h h2{font-size:15px;font-weight:600}
  .group-h p{font-size:12px;color:var(--faint)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .mod{display:flex;gap:14px;align-items:flex-start;background:var(--white);border:1px solid transparent;border-radius:14px;padding:16px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s,box-shadow .15s;position:relative;min-height:96px}
  .mod:hover{border-color:#c9daf5;transform:translateY(-2px);box-shadow:0 10px 24px rgba(26,111,219,.08)}
  .mod .ic{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
  .mod .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mod > span:not(.ic){padding-right:18px;min-width:0}
  .mod b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:13.5px;font-weight:500;margin-bottom:3px}
  .mod small{display:block;font-size:12px;color:var(--muted);line-height:1.5}
  .mod .go{position:absolute;top:14px;right:14px;color:#c0c6d2;transition:color .15s,transform .15s}
  .mod:hover .go{color:var(--primary);transform:translateX(2px)}
  .badge{font-size:9.5px;font-weight:600;padding:1px 7px;border-radius:999px}
  .badge.new{color:#8b5cf6;background:#f4f0ff}
  .badge.beta{color:#a9721f;background:#fdf3df}
  .badge.soon{color:#6b7280;background:#eef0f4}
  .mod.soon{opacity:.6;cursor:default}
  .mod.soon:hover{transform:none;box-shadow:none;border-color:transparent}
  .empty{background:var(--white);border-radius:14px;padding:36px;text-align:center;color:var(--muted);font-size:13px}
  mark{background:#fff3c4;color:inherit;border-radius:3px;padding:0 1px}

  @media (max-width:1100px){ .topbar-nav{display:none} }
  @media (max-width:620px){ .topbar,.page{padding-left:16px;padding-right:16px} .grid{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="topbar">
  <a href="home-logged-in.html" class="topbar-brand" aria-label="SmarTuna home">
    <img src="sc-blue-logo.png" alt="">
    <span class="sc-wm"><span class="sc-wm-top">SmarTuna</span><span class="sc-wm-sub">concept</span></span>
  </a>
  <nav class="topbar-nav" aria-label="Main">
    <div class="nav-pill" id="navPill">
      <a href="home-logged-in.html" class="nav-item"><img src="home.png" alt="">Home</a>
      <div class="nav-item-wrap"><a href="modules.html#my-studio" class="nav-item" data-group="my-studio"><img src="my-studio.png" alt="">My Studio</a><div class="nav-dropdown" data-menu="my-studio"></div></div>
      <div class="nav-item-wrap"><a href="modules.html#atlas" class="nav-item" data-group="atlas"><img src="atlas.png" alt="">Atlas</a><div class="nav-dropdown" data-menu="atlas"></div></div>
      <div class="nav-item-wrap"><a href="modules.html#features" class="nav-item" data-group="features">Features</a><div class="nav-dropdown" data-menu="features"></div></div>
      <a href="modules.html#messages" class="nav-item" data-group="messages"><img src="messages.png" alt="">Messages</a>
      <a href="modules.html#reports" class="nav-item" data-group="reports"><img src="report.png" alt="">Reports</a>
      <a href="modules.html#support" class="nav-item" data-group="support"><img src="support.png" alt="">Support</a>
    </div>
  </nav>
  <div class="topbar-right">
    <a class="avatar-btn" id="avatarBtn" href="profile.html" aria-label="Your profile"><span id="avatarInitials">··</span></a>
  </div>
</div>

<main class="page">
  <div class="head">
    <div><h1 id="title">All modules</h1><p id="subtitle">Everything in SmarTuna, grouped the same way as the menu.</p></div>
    <label class="search" for="q">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="search" placeholder="Search modules" autocomplete="off" aria-label="Search modules">
    </label>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Module groups"></div>
  <div id="groups"></div>
</main>

<script>
/* One list drives the cards, the tabs and the menu dropdowns.
   To add a module: add a line to its group. href:null shows it as "Coming soon". */
const I = {
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  fish:'<path d="M3 12c3-5 9-7 14-4l4-3v14l-4-3c-5 3-11 1-14-4z"/><circle cx="15" cy="11" r=".8"/>',
  ship:'<path d="M3 17c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0"/><path d="M5 14l-1-5h16l-1 5"/><path d="M9 9V5h6v4"/>',
  building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>',
  leaf:'<path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l7-7"/>',
  species:'<circle cx="12" cy="12" r="9"/><path d="M8 12c2-3 6-3 8 0-2 3-6 3-8 0z"/>',
  snow:'<path d="M12 2v20M4.9 6.5l14.2 11M19.1 6.5 4.9 17.5"/>',
  anchor:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13a7 7 0 0 0 14 0M8 11h8"/>',
  vessel:'<path d="M2 18h20l-3 3H5z"/><path d="M6 18V9h12v9M10 9V5h4v4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  wave:'<path d="M2 12c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3M2 17c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/>',
  farm:'<path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  doc:'<path d="M9 3h6l4 4v14H5V3z"/><path d="M9 12l2 2 4-4"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  truck:'<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  life:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'
};
const GROUPS = [
  { id:"my-studio", name:"My Studio", about:"Your company's own records", items:[
    { name:"Product", href:"product-list.html", icon:"box", about:"Your products, GTINs and packaging" },
    { name:"Evidence", href:"evidence-list.html", icon:"file", about:"Certificates and documents behind every claim" },
    { name:"Raw Materials", href:"raw-material-list.html", icon:"fish", about:"Raw material lots and where they came from" },
    { name:"Shipments", href:"shipment-list.html", icon:"ship", about:"Every shipment, its route and status" },
    { name:"Your Company", href:"organisation.html", icon:"building", about:"Company profile, sites and team" },
    { name:"Carbon Calculator", href:"carbon-calculator.html", icon:"leaf", about:"Estimate the carbon footprint of a product" }
  ]},
  { id:"atlas", name:"Atlas", about:"Reference data shared across the platform", items:[
    { name:"Species", href:"Species.html", icon:"species", about:"Species database with taxonomy and trade data" },
    { name:"Cold Storage", href:"cold-storage-list.html", icon:"snow", about:"Cold storage facilities" },
    { name:"Ports", href:"port-list.html", icon:"anchor", about:"Ports with UN/LOCODE and country" },
    { name:"Vessels", href:"vessel-list.html", icon:"vessel", about:"Fishing and carrier vessels" },
    { name:"Country", href:"country.html", icon:"globe", about:"Countries with regulatory and trade data" },
    { name:"MSC Fisheries", href:"fishery.html", icon:"wave", about:"MSC certified fisheries" },
    { name:"ASC Farms", href:"asc-farms.html", icon:"farm", about:"ASC certified farms" }
  ]},
  { id:"features", name:"Features", about:"Tools that work across your data", items:[
    { name:"SmarTuna A.I", href:"smartuna-ai.html", icon:"spark", badge:"new", about:"Ask questions about your data in plain language" },
    { name:"SmarTuna Assistant", href:"smartuna-assistant.html", icon:"mic", badge:"beta", about:"Voice assistant for the dashboard" },
    { name:"EU CATCH Form", href:"eu-catch-support.html", icon:"doc", about:"Prepare EU catch certificate data", tag:"Compliance" },
    { name:"NOAA SIMP", href:"simp-support.html", icon:"shield", badge:"new", about:"US Seafood Import Monitoring Program support", tag:"Compliance" },
    { name:"FSMA Act 204", href:"fsma-support.html", icon:"shield", badge:"new", about:"FDA food traceability rule support", tag:"Compliance" },
    { name:"Load Planner", href:"load-planner.html", icon:"truck", about:"Plan how cargo fits in a container" }
  ]},
  { id:"messages", name:"Messages", about:"Conversations with your partners", items:[
    { name:"Messages", href:null, icon:"chat", about:"Message suppliers, buyers and your team" }
  ]},
  { id:"reports", name:"Reports", about:"Exports and reporting", items:[
    { name:"Data Export Centre", href:"report-center.html", icon:"down", about:"Export module data with filters and templates" },
    { name:"Reports", href:null, icon:"chart", about:"Ready-made reports and charts" }
  ]},
  { id:"support", name:"Support", about:"Help when something's wrong", items:[
    { name:"Report an issue", href:"report.html", icon:"life", about:"Tell us about a bug or a problem" },
    { name:"Contact us", href:"contact.html", icon:"mail", about:"Questions, demos and partnerships" }
  ]}
];

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k] || I.box}</svg>`;
const ARROW = '<svg class="go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
let current = "all";

function hl(text, q){
  const t = esc(text); if (!q) return t;
  const i = text.toLowerCase().indexOf(q); if (i < 0) return t;
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}
function card(m, q){
  const badge = m.badge ? `<span class="badge ${m.badge}">${m.badge === "new" ? "New" : "Beta"}</span>` : !m.href ? `<span class="badge soon">Coming soon</span>` : "";
  const inner = `<span class="ic">${svg(m.icon)}</span><span><b>${hl(m.name, q)}${badge}</b><small>${hl(m.about, q)}${m.tag ? ` · ${esc(m.tag)}` : ""}</small></span>`;
  return m.href ? `<a class="mod" href="${esc(m.href)}">${inner}${ARROW}</a>` : `<div class="mod soon" aria-disabled="true">${inner}</div>`;
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const groups = GROUPS.filter(g => current === "all" || g.id === current)
    .map(g => ({ ...g, list: g.items.filter(m => !q || [m.name, m.about, m.tag || ""].some(v => v.toLowerCase().includes(q))) }))
    .filter(g => g.list.length);
  $("#groups").innerHTML = groups.length ? groups.map(g => `<section class="group" id="g-${g.id}" aria-labelledby="h-${g.id}">
      ${current === "all" || q ? `<div class="group-h"><h2 id="h-${g.id}">${esc(g.name)}</h2><p>${esc(g.about)}</p></div>` : `<h2 id="h-${g.id}" hidden>${esc(g.name)}</h2>`}
      <div class="grid">${g.list.map(m => card(m, q)).join("")}</div></section>`).join("")
    : `<div class="empty">No modules match “${esc($("#q").value.trim())}”.</div>`;
  const g = GROUPS.find(x => x.id === current);
  $("#title").textContent = g ? g.name : "All modules";
  $("#subtitle").textContent = g ? g.about : "Everything in SmarTuna, grouped the same way as the menu.";
  document.title = (g ? g.name : "All modules") + " · SmarTuna concept";
  document.querySelectorAll(".tab").forEach(t => { const on = t.dataset.g === current; t.classList.toggle("on", on); t.setAttribute("aria-selected", on); });
  document.querySelectorAll(".nav-item[data-group]").forEach(n => n.classList.toggle("active", n.dataset.group === current));
}
function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  current = GROUPS.some(g => g.id === h) ? h : "all";
  render();
}
$("#tabs").innerHTML = [{ id:"all", name:"All", n: GROUPS.reduce((t, g) => t + g.items.length, 0) }, ...GROUPS.map(g => ({ id:g.id, name:g.name, n:g.items.length }))]
  .map(t => `<a class="tab" role="tab" data-g="${t.id}" href="#${t.id === "all" ? "" : t.id}">${esc(t.name)}<span>${t.n}</span></a>`).join("");
document.querySelectorAll("[data-menu]").forEach(d => {
  const g = GROUPS.find(x => x.id === d.dataset.menu);
  d.innerHTML = g.items.map(m => m.href ? `<a href="${esc(m.href)}">${esc(m.name)}${m.badge ? `<span class="badge ${m.badge}">${m.badge === "new" ? "New" : "Beta"}</span>` : ""}</a>` : "").join("")
    + `<a class="all" href="modules.html#${g.id}">See all ${esc(g.name)}</a>`;
});
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (!t) return; e.preventDefault();
  history.replaceState(null, "", t.dataset.g === "all" ? location.pathname : "#" + t.dataset.g); fromHash(); });
$("#q").addEventListener("input", render);
window.addEventListener("hashchange", fromHash);
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
fromHash();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // signed-in users only, like the dashboard; shows their initials or photo in the corner
  (async function(){
    try{
      const db = window.supabase.createClient("https://enbdaajcromxmhgcverp.supabase.co", "sb_publishable_NxQj3wE3UqijQVwwUNCfxg_f2uFLRz5");
      const { data:{ session } } = await db.auth.getSession();
      if(!session){ location.href = "login.html"; return; }
      const { data:p } = await db.from("profiles").select("first_name,last_name,avatar_color,photo_url").eq("id", session.user.id).single();
      const first = p?.first_name || session.user.email.split("@")[0], last = p?.last_name || "";
      const btn = document.getElementById("avatarBtn");
      if(p?.photo_url){ btn.innerHTML = `<img src="${p.photo_url.replace(/"/g,"&quot;")}" alt="">`; }
      else { btn.style.background = p?.avatar_color || "#1a6fdb"; document.getElementById("avatarInitials").textContent = (first[0] + (last[0] || "")).toUpperCase(); }
    }catch(e){ /* offline: keep the page usable */ }
  })();
</script>
</body>
</html>
