<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Load plans — SmarTuna</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" />

  <link rel="stylesheet" href="load-plans.css" />
</head>
<body>

  <header class="top-nav">
    <div class="brand">
      <img class="brand-logo" src="sc-blue-logo.png" alt="SmarTuna" />
      <span class="brand-text">SmarTuna</span>
    </div>
    <nav class="crumb">
      <a href="index.html">Home</a>
      <span class="crumb-sep">/</span>
      <span class="crumb-current">Load plans</span>
    </nav>
    <div class="top-actions">
      <button class="btn-soft" id="btnRefresh" title="Reload from the database">Refresh</button>
      <a class="btn-soft" href="load-compare.html">Compare</a>
      <a class="btn-primary" href="load-planner.html">New plan</a>
    </div>
  </header>

  <section class="page-head">
    <div>
      <h1>Load plans</h1>
      <p class="sub" id="pageSub">Every plan you've saved, drafted or published.</p>
    </div>
  </section>

  <section class="summary" id="summary">
    <button type="button" class="stat-card" data-jump="all">
      <span class="stat-label">All plans</span>
      <span class="stat-value" id="sumAll">—</span>
    </button>
    <button type="button" class="stat-card" data-jump="draft">
      <span class="stat-label">Drafts</span>
      <span class="stat-value tone-amber" id="sumDraft">—</span>
    </button>
    <button type="button" class="stat-card" data-jump="published">
      <span class="stat-label">Published</span>
      <span class="stat-value tone-green" id="sumPublished">—</span>
    </button>
    <button type="button" class="stat-card" data-jump="archived">
      <span class="stat-label">Archived</span>
      <span class="stat-value tone-muted" id="sumArchived">—</span>
    </button>
    <div class="stat-card stat-static">
      <span class="stat-label">Items planned</span>
      <span class="stat-value" id="sumItems">—</span>
    </div>
  </section>

  <section class="toolbar">
    <div class="filter-tabs" id="filterTabs">
      <button type="button" class="filter-tab active" data-status="all">All</button>
      <button type="button" class="filter-tab" data-status="draft">Drafts</button>
      <button type="button" class="filter-tab" data-status="published">Published</button>
      <button type="button" class="filter-tab" data-status="archived">Archived</button>
      <button type="button" class="filter-tab" data-status="trash">Trash</button>
    </div>

    <div class="toolbar-right">
      <label class="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Search by name, ref or container…" autocomplete="off" />
      </label>
      <label class="sort">
        <span>Sort</span>
        <select id="sortSelect">
          <option value="updated">Last updated</option>
          <option value="created">Newest first</option>
          <option value="name">Name A–Z</option>
          <option value="fill">Fullest first</option>
          <option value="items">Most items</option>
        </select>
      </label>
    </div>
  </section>

  <main class="plans" id="plansGrid">
    <div class="state-msg" id="stateMsg">Loading plans…</div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="load-plans.js"></script>
</body>
</html>
