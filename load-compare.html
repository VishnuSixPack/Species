<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare plans — SmarTuna</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" />

  <link rel="stylesheet" href="load-plans.css" />
  <link rel="stylesheet" href="load-compare.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <header class="top-nav">
    <div class="brand">
      <img class="brand-logo" src="sc-blue-logo.png" alt="SmarTuna" />
      <span class="brand-text">SmarTuna</span>
    </div>
    <nav class="crumb">
      <a href="load-plans.html">Load plans</a>
      <span class="crumb-sep">/</span>
      <span class="crumb-current">Compare</span>
    </nav>
    <div class="top-actions">
      <button class="btn-soft" id="btnSwap" title="Swap A and B">⇄ Swap</button>
      <a class="btn-soft" href="load-plans.html">All plans</a>
    </div>
  </header>

  <section class="page-head">
    <div>
      <h1>Compare plans</h1>
      <p class="sub">Pick two plans to see them side by side and find out which packs better.</p>
    </div>
  </section>

  <!-- Verdict banner -->
  <section class="verdict" id="verdict" hidden></section>

  <!-- Viewports -->
  <section class="compare-stage">
    <div class="pane" data-slot="a">
      <div class="pane-head">
        <span class="slot-tag tag-a">A</span>
        <select class="plan-pick" id="pickA"><option value="">Choose a plan…</option></select>
        <a class="pane-open" id="openA" href="#" title="Open in the planner" hidden>Open ↗</a>
      </div>
      <div class="pane-view" id="viewA">
        <canvas id="canvasA"></canvas>
        <div class="pane-empty" id="emptyA">Choose a plan to compare</div>
      </div>
      <div class="pane-foot" id="footA"></div>
    </div>

    <div class="pane" data-slot="b">
      <div class="pane-head">
        <span class="slot-tag tag-b">B</span>
        <select class="plan-pick" id="pickB"><option value="">Choose a plan…</option></select>
        <a class="pane-open" id="openB" href="#" title="Open in the planner" hidden>Open ↗</a>
      </div>
      <div class="pane-view" id="viewB">
        <canvas id="canvasB"></canvas>
        <div class="pane-empty" id="emptyB">Choose a plan to compare</div>
      </div>
      <div class="pane-foot" id="footB"></div>
    </div>
  </section>

  <!-- Shared view controls -->
  <section class="stage-controls">
    <div class="view-pills" id="viewPills">
      <button class="view-pill selected" data-view="perspective">Perspective</button>
      <button class="view-pill" data-view="top">Top</button>
      <button class="view-pill" data-view="side">Side</button>
      <button class="view-pill" data-view="front">Front</button>
    </div>
    <label class="sync-toggle">
      <input type="checkbox" id="syncCams" checked />
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span class="switch-label">Lock both cameras together</span>
    </label>
    <label class="sync-toggle">
      <input type="checkbox" id="normScale" />
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span class="switch-label">Match scale (compare different container sizes fairly)</span>
    </label>
  </section>

  <!-- Metric comparison -->
  <section class="scorecard" id="scorecard" hidden>
    <h2>Scorecard</h2>
    <div class="metric-table" id="metricTable"></div>
  </section>

  <!-- Headroom -->
  <section class="headroom" id="headroom" hidden>
    <h2>Room to spare</h2>
    <p class="headroom-note" id="headroomNote"></p>
    <div class="headroom-grid" id="headroomGrid"></div>
  </section>

  <div id="toast" class="toast"></div>

  <script type="module" src="load-compare.js"></script>
</body>
</html>
