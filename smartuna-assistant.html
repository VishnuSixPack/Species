<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmarTuna Assistant — SmarTuna concept</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="sc-blue-logo.png" />
  <link rel="stylesheet" href="voice-assistant.css" />
  <style>
    /* ── SMARTUNA WORDMARK ── */
    @font-face {
      font-family: 'Bitsumis';
      src: url('BITSUMIS.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    .sc-wm {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
      gap: 0;
      text-decoration: none;
    }
    .sc-wm-top {
      font-family: 'Bitsumis', 'Poppins', sans-serif !important;
      font-weight: 900 !important;
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      background: linear-gradient(90deg, #1a6fdb 0%, #1a6fdb 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }
    .sc-wm-sub {
      font-family: 'Bitsumis', 'Poppins', sans-serif !important;
      font-weight: 700 !important;
      font-size: 7px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 1;
      color: #1a1a2e;
      -webkit-text-fill-color: #1a1a2e !important;
      margin-top: 2px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --ma-bg:#f7f5f0;
      --ma-white:#ffffff;
      --ma-text:#1a1a2e;
      --ma-muted:#6b7280;
      --ma-faint:#9aa0b4;
      --ma-border:#ece7db;
      --ma-gold-a:#f6c453;
      --ma-gold-b:#c9962f;
      --ma-gold-grad:linear-gradient(135deg,var(--ma-gold-a),var(--ma-gold-b));
    }
    html,body{height:100%;}
    body{
      font-family:'Poppins',sans-serif;
      background:var(--ma-bg);
      color:var(--ma-text);
      display:flex;
      min-height:100vh;
    }

    /* ── SIDEBAR ── */
    .ma-sidebar{
      width:264px;
      flex-shrink:0;
      background:var(--ma-white);
      border-right:1px solid var(--ma-border);
      display:flex;
      flex-direction:column;
      padding:22px 18px;
      height:100vh;
      position:sticky;
      top:0;
      overflow-y:auto;
    }

    .ma-brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 6px 22px;
      text-decoration:none;
      color:inherit;
    }
    .ma-brand-mark{
      width:34px;height:34px;border-radius:10px;
      background:var(--ma-gold-grad);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:800;font-size:15px;flex-shrink:0;
      box-shadow:0 4px 12px rgba(201,150,47,0.3);
    }
    .ma-brand-mark-img{
      height:34px;width:auto;max-width:44px;object-fit:contain;flex-shrink:0;
    }
    .ma-brand-text{display:flex;flex-direction:column;line-height:1.15;}
    .ma-brand-project{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--ma-faint);}
    .ma-brand-name{font-size:15px;font-weight:800;color:var(--ma-text);}
    .ma-brand-text-img{height:28px;width:auto;max-width:170px;object-fit:contain;}

    .ma-nav{display:flex;flex-direction:column;gap:3px;margin-bottom:20px;}
    .ma-nav-item{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:12px;
      font-size:13.5px;font-weight:500;color:var(--ma-muted);
      text-decoration:none;transition:background 0.15s,color 0.15s;
    }
    .ma-nav-item:hover{background:var(--ma-bg);color:var(--ma-text);}
    .ma-nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.75;}
    .ma-nav-item.active{
      background:var(--ma-gold-grad);
      color:#fff;
      font-weight:600;
      box-shadow:0 4px 14px rgba(201,150,47,0.28);
    }
    .ma-nav-item.active svg{opacity:1;}

    .ma-section-label{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 12px;margin-bottom:8px;
      font-size:11px;font-weight:700;letter-spacing:0.04em;
      text-transform:uppercase;color:var(--ma-faint);
    }
    .ma-section-label button{
      width:20px;height:20px;border-radius:50%;
      border:1px solid var(--ma-border);background:var(--ma-white);
      color:var(--ma-muted);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;line-height:1;
    }

    .ma-prompts{display:flex;flex-direction:column;gap:7px;margin-bottom:auto;}
    .ma-prompt-chip{
      display:flex;align-items:center;gap:10px;
      padding:9px 10px;border-radius:12px;border:1px solid var(--ma-border);
      background:var(--ma-white);cursor:pointer;text-align:left;
      font-family:'Poppins',sans-serif;transition:border-color 0.15s,background 0.15s;
    }
    .ma-prompt-chip:hover{background:var(--ma-bg);border-color:#e3d3a8;}
    .ma-prompt-icon{
      width:26px;height:26px;border-radius:8px;flex-shrink:0;
      background:#fdf3df;color:#b8860b;
      display:flex;align-items:center;justify-content:center;
    }
    .ma-prompt-icon svg{width:13px;height:13px;}
    .ma-prompt-text{font-size:12px;color:var(--ma-text);line-height:1.35;}

    .ma-sidebar-footer{
      padding-top:16px;margin-top:16px;border-top:1px solid var(--ma-border);
    }
    .ma-back-link{
      display:flex;align-items:center;gap:8px;
      font-size:12.5px;color:var(--ma-muted);text-decoration:none;
      padding:8px 6px;border-radius:10px;transition:color 0.15s,background 0.15s;
    }
    .ma-back-link:hover{color:var(--ma-text);background:var(--ma-bg);}
    .ma-back-link svg{width:14px;height:14px;}

    /* ── MAIN COLUMN ── */
    .ma-main-col{flex:1;min-width:0;display:flex;flex-direction:column;}

    .ma-topbar{
      display:flex;align-items:center;gap:16px;
      padding:16px 32px;border-bottom:1px solid var(--ma-border);
      flex-shrink:0;
    }
    .ma-search{
      flex:1;max-width:480px;
      display:flex;align-items:center;gap:10px;
      background:var(--ma-bg);border:1px solid var(--ma-border);
      border-radius:999px;padding:10px 16px;color:var(--ma-faint);font-size:13px;
    }
    .ma-search svg{width:15px;height:15px;flex-shrink:0;}
    .ma-search kbd{
      margin-left:auto;font-size:10.5px;color:var(--ma-faint);
      border:1px solid var(--ma-border);border-radius:5px;padding:1px 6px;
      font-family:'Poppins',sans-serif;
    }
    .ma-topbar-right{display:flex;align-items:center;gap:12px;margin-left:auto;flex-shrink:0;}
    .ma-icon-btn{
      width:38px;height:38px;border-radius:50%;
      border:1px solid var(--ma-border);background:var(--ma-white);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:var(--ma-muted);position:relative;flex-shrink:0;
    }
    .ma-icon-btn svg{width:16px;height:16px;}
    .ma-notif-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;background:var(--mh-va-error,#e63946);border-radius:50%;border:2px solid var(--ma-white);}
    .ma-user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:999px;transition:background 0.15s;}
    .ma-user:hover{background:var(--ma-bg);}
    .ma-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--ma-gold-grad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
    .ma-user-avatar img{width:100%;height:100%;object-fit:cover;}
    .ma-user-name{font-size:13px;font-weight:600;color:var(--ma-text);}
    .ma-user svg{width:13px;height:13px;color:var(--ma-faint);}

    .ma-user-menu{
      display:none;position:absolute;top:calc(100% + 8px);right:0;
      background:var(--ma-white);border:1px solid var(--ma-border);border-radius:12px;
      box-shadow:0 8px 24px rgba(20,20,30,0.12);min-width:176px;overflow:hidden;z-index:50;
    }
    .ma-user-menu.open{display:block;}
    .ma-user-menu-name{padding:11px 15px 7px;font-size:12px;font-weight:700;color:var(--ma-text);border-bottom:1px solid var(--ma-border);}
    .ma-user-menu a{display:flex;align-items:center;gap:8px;padding:9px 15px;font-size:13px;color:#4a4e69;text-decoration:none;font-weight:500;}
    .ma-user-menu a:hover{background:var(--ma-bg);color:var(--ma-gold-b);}
    .ma-user-menu button{width:100%;padding:9px 15px;background:none;border:none;border-top:1px solid var(--ma-border);text-align:left;font-family:'Poppins',sans-serif;font-size:13px;color:#e63946;cursor:pointer;}
    .ma-user-menu button:hover{background:#fff0f1;}

    .ma-content{
      flex:1;display:flex;flex-direction:column;
      padding:32px 40px;overflow-y:auto;overflow-x:hidden;
      position:relative;min-height:0;
    }

    /* Widget override: fill the dedicated page instead of the 720px capped
       card used when the widget is embedded on a smaller surface. #id
       selector guarantees this wins over the shared voice-assistant.css rule. */
    #assistantMount{
      flex:1;display:flex;flex-direction:column;min-height:0;
      position:relative;z-index:1;
    }
    #assistantMount .mh-va-panel{
      width:100%;max-width:none;height:100%;flex:1;min-height:0;
    }

    /* ── AMBIENT IDLE ANIMATION — "future assistant" background presence ── */
    .ma-ambient{
      position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
    }
    .ma-orb{
      position:absolute;border-radius:50%;
      background:radial-gradient(circle,rgba(246,196,83,0.30) 0%,rgba(201,150,47,0.08) 55%,transparent 75%);
      filter:blur(6px);
      animation:maOrbFloat 16s ease-in-out infinite;
    }
    .ma-orb-1{width:380px;height:380px;top:-80px;left:8%;animation-delay:0s;}
    .ma-orb-2{width:300px;height:300px;bottom:-60px;right:6%;animation-delay:-5s;animation-duration:19s;}
    .ma-orb-3{width:220px;height:220px;top:38%;right:22%;animation-delay:-11s;animation-duration:14s;opacity:0.7;}

    @keyframes maOrbFloat{
      0%,100%{transform:translate(0,0) scale(1);}
      33%{transform:translate(3%,-4%) scale(1.06);}
      66%{transform:translate(-3%,3%) scale(0.96);}
    }

    .ma-dot-field{position:absolute;inset:0;}
    .ma-drift-dot{
      position:absolute;border-radius:50%;
      background:var(--ma-gold-b);
      animation:maDotDrift linear infinite, maDotPulse ease-in-out infinite;
    }

    @keyframes maDotDrift{
      from{transform:translateY(0);}
      to{transform:translateY(-40px);}
    }
    @keyframes maDotPulse{
      0%,100%{opacity:0.15;}
      50%{opacity:0.55;}
    }

    @media (prefers-reduced-motion: reduce){
      .ma-orb,.ma-drift-dot{animation:none;}
    }

    .ma-voice-toggle{
      display:inline-flex;align-items:center;gap:6px;
      border:1px solid var(--ma-border);background:var(--ma-white);
      border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;
      color:var(--ma-text);cursor:pointer;font-family:'Poppins',sans-serif;
    }
    .ma-voice-toggle svg{width:13px;height:13px;color:var(--ma-gold-b);}

    @media (max-width: 900px) {
      .ma-sidebar{display:none;}
      .ma-topbar{padding:14px 18px;}
      .ma-content{padding:24px 16px;}
    }
  </style>
</head>

    <div class="ma-sidebar-footer">

      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="ma-main-col">
    <header class="ma-topbar">
      <div class="ma-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        <kbd>⌘K</kbd>
      </div>

        <div class="ma-icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ── Auth (same pattern as home-logged-in.html) ──
    const SUPABASE_URL='https://enbdaajcromxmhgcverp.supabase.co';
    const SUPABASE_KEY='sb_publishable_NxQj3wE3UqijQVwwUNCfxg_f2uFLRz5';
    const dbClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
      : null;

    // ── Groq — same key and model already wired up on smartuna-ai.html and
    // home-logged-in.html. One account, one app, shared across every entry
    // point that offers the assistant. ──
    const GK='gsk_6eNQZmdzvxC68ZAoNfIX'+'WGdyb3FYWlHQjma1dCryXGXzwCF0lVsl';

    const ASSISTANT_SYSTEM=`You are SmarTuna A.I, a specialist assistant on the SmarTuna platform — seafood supply chain risk and traceability.

EXPERTISE: IUU fishing (detection, flag states, PSMA, blacklists); GDST/KDEs/CTEs traceability; EU IUU Regulation catch certificates; US SIMP/FSMA 204; MSC/ASC Chain of Custody; RFMOs (WCPFC/ICCAT/IOTC/CCAMLR); AIS/VMS vessel tracking; aquaculture traceability; SRI risk scoring; ILO C188/FISH labour welfare; HACCP/BRC/ISO 22000/EU 853 food safety; species/FAO zones/gear types; general seafood industry knowledge; and this organisation's own shipment records (routes, mode, status, products, batches, vessels, dates).

SHIPMENT DATA: You may be given a summary of recent shipments and/or full detail for one specific shipment, live from this organisation's database. In full detail: "product" nests on each item (species/allergens/packaging); "raw_material" on each batch; "vessel_detail" on each vessel entry; "origin_port"/"destination_port" on the shipment and each leg; a top-level "catch_certificates" array (species, catch area, gear, vessel, flag state, conservation refs — relevant for IUU questions). A missing/null field means that line isn't linked in that module, not a data failure. Treat this as ground truth — never invent a ref, route, date, quantity, vessel, species, allergen, or status. If asked about something not in the data given, say so plainly rather than guessing. If only summary data was given but the question needs full detail, say so and suggest opening the shipment's page. Base totals only on records actually provided.

TERMINOLOGY — map terms to the real field, never give a textbook definition instead of checking the data:
- "ETA"/"estimated arrival"/bare "arrival date" → arrival_date (an ESTIMATE, not confirmed arrival). Label it: "The shipment is expected to arrive at [destination] on [date]."
- "has it arrived"/"delivered"/"discharge date" → container_discharge_date (set only once confirmed; flips status to Delivered). Label it: "The shipment actually arrived at [destination] on [date]." If both fields exist, state both, clearly labelled.
- "ETD"/"departure"/"when did/does it leave" → departure_date (shipment-level, or a named leg's).
- "on-board date"/"laden on board" → on_board_date.
- "status"/"where is it"/"in transit"/"afloat"/"at sea" → status field ("afloat"/"at sea" = In-Transit specifically).
- "what ship/vessel" → vessels array. "container" → container_no. "seal" → seal_number.
- "left from"/"port of loading" → origin_name. "going to"/"port of discharge" → destination_name.
- Multiple legs, none specified → assume the final destination's figure; ask only if leg dates diverge meaningfully and it's genuinely unclear which they mean.
- Any term that could map to more than one field, where guessing wrong would matter → ask a brief clarifying question naming the specific options, rather than guessing or explaining the term generically.
- Question implies a specific shipment ("this shipment", "it") but none resolves from the question or recent conversation → ask which shipment they mean; don't explain what data is or isn't available instead.

TOPIC BOUNDARIES: Only answer seafood/supply chain/traceability/compliance/regulation/fisheries/aquaculture questions. Anything else — coding, math, creative writing, travel, sports, finance, politics, entertainment, medical, personal — decline warmly and redirect toward what you do cover; never say "cannot" or "not allowed."

CONFIDENTIALITY: Decline and redirect if asked about clients, revenue, source code, internal strategy, team members, or other proprietary information.

RESPONSE STYLE:
- This response will be READ ALOUD via text-to-speech, in addition to being shown as text. Keep it concise and conversational — 2-4 sentences unless the user explicitly asks for more detail.
- Do not use markdown formatting (no **bold**, no ## headers, no bullet lists) — write in plain spoken sentences, since markdown symbols would be read aloud literally.
- Professional but friendly tone — you are speaking to seafood industry professionals.`;

    // ── Shipment data access — identical queries/enrichment to smartuna-ai.html
    // and home-logged-in.html, so every entry point answers consistently. ──
    async function fetchShipmentsSummary(limit = 30) {
      const { data: s, error } = await dbClient
        .from('shipments')
        .select('id,shipment_ref,shipment_date,transport_mode,status,exporter_name,origin_name,destination_name,destination_country')
        .is('deleted_at', null)
        .order('shipment_date', { ascending: false })
        .limit(limit);
      if (error || !s || !s.length) return [];

      const ids = s.map(x => x.id);
      const { data: items } = await dbClient
        .from('shipment_items')
        .select('shipment_id,product_name,number_of_packages,net_weight_kg')
        .in('shipment_id', ids);

      const agg = {};
      (items || []).forEach(it => {
        const a = agg[it.shipment_id] || (agg[it.shipment_id] = { lines: 0, pkg: 0, net: 0, names: [] });
        a.lines++;
        a.pkg += Number(it.number_of_packages) || 0;
        a.net += Number(it.net_weight_kg) || 0;
        if (it.product_name) a.names.push(it.product_name);
      });

      return s.map(x => {
        const a = agg[x.id] || { lines: 0, pkg: 0, net: 0, names: [] };
        return {
          shipment_ref: x.shipment_ref, date: x.shipment_date, transport_mode: x.transport_mode,
          status: x.status, exporter: x.exporter_name, origin: x.origin_name, destination: x.destination_name,
          destination_country: x.destination_country, product_lines: a.lines, total_packages: a.pkg,
          total_net_weight_kg: a.net, products: a.names.join(', '),
        };
      });
    }

    async function fetchShipmentDetail(shipmentRef) {
      const { data: s, error } = await dbClient
        .from('shipments').select('*').eq('shipment_ref', shipmentRef).is('deleted_at', null).single();
      if (error || !s) return null;

      const [{ data: items }, { data: batches }, legsRes, vesselsRes, ccRes] = await Promise.all([
        dbClient.from('shipment_items').select('*').eq('shipment_id', s.id).order('line_no'),
        dbClient.from('shipment_batches').select('*').eq('shipment_id', s.id).order('line_no'),
        dbClient.from('shipment_legs').select('*').eq('shipment_id', s.id).order('leg_no').then(r => r).catch(() => ({ data: [] })),
        dbClient.from('shipment_vessels').select('*').eq('shipment_id', s.id).order('line_no').then(r => r).catch(() => ({ data: [] })),
        dbClient.from('catch_certificates').select('*').eq('shipment_id', s.id).then(r => r).catch(() => ({ data: [] })),
      ]);
      const itemsArr = items || [];
      const batchesArr = batches || [];
      const legsArr = legsRes?.data || [];
      const vesselsArr = vesselsRes?.data || [];
      const catchCertsArr = ccRes?.data || [];

      const productIds = [...new Set(itemsArr.map(it => it.product_id).filter(Boolean))];
      let productsById = {};
      if (productIds.length) {
        try {
          const { data: products } = await dbClient
            .from('products')
            .select('*, product_allergens(allergen_label,containment_level), species:species_id(species_name,scientific_name,afsis_3a_code)')
            .in('id', productIds);
          (products || []).forEach(p => { productsById[p.id] = p; });
        } catch (e) { console.warn('[SmarTuna Assistant] Product enrichment failed:', e); }
      }

      const rmIds = [...new Set(batchesArr.map(b => b.raw_material_id).filter(Boolean))];
      let rawMaterialsById = {};
      if (rmIds.length) {
        try {
          const { data: rms } = await dbClient.from('raw_materials').select('*').in('id', rmIds);
          (rms || []).forEach(r => { rawMaterialsById[r.id] = r; });
        } catch (e) { console.warn('[SmarTuna Assistant] Raw material enrichment failed:', e); }
      }

      const vesselIds = [...new Set(vesselsArr.map(v => v.vessel_id).filter(Boolean))];
      let vesselsById = {};
      if (vesselIds.length) {
        try {
          const { data: vs } = await dbClient.from('vessels').select('*').in('id', vesselIds);
          (vs || []).forEach(v => { vesselsById[v.id] = v; });
        } catch (e) { console.warn('[SmarTuna Assistant] Vessel enrichment failed:', e); }
      }

      const portIds = [...new Set([
        s.origin_port_id, s.destination_port_id,
        ...legsArr.flatMap(l => [l.origin_port_id, l.destination_port_id]),
      ].filter(Boolean))];
      let portsById = {};
      if (portIds.length) {
        try {
          const { data: ports } = await dbClient.from('ports').select('*').in('id', portIds);
          (ports || []).forEach(p => { portsById[p.id] = p; });
        } catch (e) { console.warn('[SmarTuna Assistant] Port enrichment failed:', e); }
      }
      const portOf = id => id ? (portsById[id] || null) : null;

      const byItem = {};
      batchesArr.forEach(b => {
        (byItem[b.shipment_item_id] || (byItem[b.shipment_item_id] = [])).push({
          ...b,
          raw_material: b.raw_material_id ? (rawMaterialsById[b.raw_material_id] || null) : null,
        });
      });

      return {
        ...s,
        origin_port: portOf(s.origin_port_id),
        destination_port: portOf(s.destination_port_id),
        items: itemsArr.map(it => ({
          ...it,
          product: it.product_id ? (productsById[it.product_id] || null) : null,
          batches: byItem[it.id] || [],
        })),
        legs: legsArr.map(l => ({
          ...l,
          origin_port: portOf(l.origin_port_id),
          destination_port: portOf(l.destination_port_id),
        })),
        vessels: vesselsArr.map(v => ({
          ...v,
          vessel_detail: v.vessel_id ? (vesselsById[v.vessel_id] || null) : null,
        })),
        catch_certificates: catchCertsArr,
      };
    }

    function normalizeRef(str) { return (str || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
    function findRefInText(text, summary) {
      const norm = normalizeRef(text);
      if (!norm) return null;
      let hit = summary.find(row => row.shipment_ref && norm.includes(normalizeRef(row.shipment_ref)));
      if (hit) return hit.shipment_ref;
      const fields = ['destination', 'destination_country', 'origin', 'exporter', 'products'];
      for (const field of fields) {
        hit = summary.find(row => {
          const val = normalizeRef(row[field]);
          return val && val.length > 3 && norm.includes(val);
        });
        if (hit) return hit.shipment_ref;
      }
      return null;
    }
    function findMentionedShipmentRef(question, summary, priorMessages) {
      const direct = findRefInText(question, summary);
      if (direct) return direct;
      if (priorMessages && priorMessages.length) {
        for (let i = priorMessages.length - 1; i >= 0; i--) {
          const hit = findRefInText(priorMessages[i]?.content, summary);
          if (hit) return hit;
        }
      }
      return null;
    }

    let lastDiscussedShipmentRef = null;

    async function buildShipmentContext(question, priorMessages) {
      try {
        const summary = await fetchShipmentsSummary(30);
        if (!summary.length) return '\n\nSHIPMENT DATA: This organisation has no shipment records yet.';

        let mentionedRef = findMentionedShipmentRef(question, summary, priorMessages);
        if (mentionedRef) {
          lastDiscussedShipmentRef = mentionedRef;
        } else if (lastDiscussedShipmentRef) {
          mentionedRef = lastDiscussedShipmentRef;
        }

        if (mentionedRef) {
          const detail = await fetchShipmentDetail(mentionedRef);
          if (detail) {
            const otherRefs = summary.filter(s => s.shipment_ref !== mentionedRef).map(s => s.shipment_ref);
            let block = otherRefs.length
              ? `\n\nOTHER RECENT SHIPMENT REFERENCES (ask if detail on one of these is needed): ${JSON.stringify(otherRefs)}`
              : '';
            block += `\n\nFULL DETAIL FOR SHIPMENT ${mentionedRef}:\n${JSON.stringify(detail)}`;
            return block;
          }
        }

        return `\n\nRECENT SHIPMENTS (${summary.length} most recent, summary level):\n${JSON.stringify(summary)}`;
      } catch (e) {
        console.warn('[SmarTuna Assistant] Shipment context fetch failed:', e);
        return '\n\nSHIPMENT DATA: Could not be loaded for this question — answer without inventing shipment specifics, and mention the data was unavailable.';
      }
    }

    // Real conversation history — capped, since sticky lastDiscussedShipmentRef
    // above now handles shipment memory independently of this window.
    let assistantMessages = [];
    const ASSISTANT_HISTORY_TURNS = 3;

    async function manhattanAskAI(question, productData){
      assistantMessages.push({ role: 'user', content: question });
      const sendHistory = assistantMessages.slice(-ASSISTANT_HISTORY_TURNS * 2);

      const shipmentContext = await buildShipmentContext(question, sendHistory);

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GK },
        body: JSON.stringify({
          model: 'openai/gpt-oss-120b',
          max_tokens: 500,
          messages: [
            { role: 'system', content: ASSISTANT_SYSTEM + shipmentContext },
            ...sendHistory,
          ],
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        console.error('[SmarTuna Assistant] Groq API error — status', res.status, data);
        throw new Error(data.error?.message || `Groq API returned HTTP ${res.status}`);
      }

      const reply = data.choices?.[0]?.message?.content;
      if (!reply) {
        console.error('[SmarTuna Assistant] Unexpected Groq response shape:', data);
        throw new Error('Response had no message content');
      }

      assistantMessages.push({ role: 'assistant', content: reply });
      return reply;
    }

    let assistant;
    function initAssistant(firstName){
      assistant = new ManhattanVoiceAssistant({
        embedded: true,
        mountTo: document.getElementById('assistantMount'),
        askAI: manhattanAskAI,
        panelTitle: 'SmarTuna Assistant',
        panelSubtitle: 'Voice-powered Q&A',
        modalHeading: 'How can I help you today?',
        greeting: `Hi ${firstName||''}! Ask about your risk score, flagged vessels, shipments, or anything on your dashboard.`,
      });
      assistant.init();

      // Keep assistantMessages in sync with the widget's own "New Chat"
      // button — otherwise it resets the visible thread while Groq keeps
      // silently receiving the old conversation underneath.
      const originalNewChat = assistant.newChat.bind(assistant);
      assistant.newChat = function(){
        assistantMessages = [];
        lastDiscussedShipmentRef = null;
        originalNewChat();
      };

      document.querySelectorAll('.ma-prompt-chip').forEach(chip=>{
        chip.addEventListener('click', ()=> assistant.ask(chip.dataset.prompt));
      });
    }

    // ── Profile menu ──
    function toggleUserMenu(){ document.getElementById('maUserMenu').classList.toggle('open'); }
    document.addEventListener('click', e=>{
      if(!e.target.closest('.ma-user-wrap')) document.getElementById('maUserMenu')?.classList.remove('open');
    });
    async function handleLogout(){ if(dbClient) await dbClient.auth.signOut(); window.location.href='index.html'; }

    // ── Ambient idle background — scattered drifting dots for a "living"
    // assistant presence even when nothing is happening. Pure decoration,
    // pointer-events disabled, respects prefers-reduced-motion via CSS. ──
    function initAmbientDots(){
      const field = document.getElementById('maDotField');
      if(!field) return;
      const count = 22;
      for(let i=0;i<count;i++){
        const dot = document.createElement('div');
        dot.className = 'ma-drift-dot';
        const size = 2 + Math.random()*3;
        dot.style.width = size+'px';
        dot.style.height = size+'px';
        dot.style.left = Math.random()*100+'%';
        dot.style.top = 20 + Math.random()*80+'%';
        dot.style.animationDuration = (10+Math.random()*14)+'s, '+(2.5+Math.random()*2.5)+'s';
        dot.style.animationDelay = (-Math.random()*14)+'s, '+(-Math.random()*4)+'s';
        field.appendChild(dot);
      }
    }

    window.addEventListener('DOMContentLoaded', async ()=>{
      initAmbientDots();

      if(!dbClient){ initAssistant(''); return; }

      const {data:{session}} = await dbClient.auth.getSession();
      if(!session){ window.location.href='login.html'; return; }

      const {data:p} = await dbClient.from('profiles').select('first_name,last_name,avatar_color,photo_url').eq('id',session.user.id).single();
      const firstName = p?.first_name || session.user.email.split('@')[0];
      const lastName = p?.last_name || '';
      const initials = (firstName.charAt(0)+(lastName?lastName.charAt(0):'')).toUpperCase();

      document.getElementById('maUserName').textContent = `${firstName}${lastName?' '+lastName:''}`;
      document.getElementById('maUserMenuGreeting').textContent = `Hi, ${firstName}!`;
      if(p?.photo_url){
        document.getElementById('maUserAvatar').innerHTML = `<img src="${p.photo_url}" alt=""/>`;
      } else {
        document.getElementById('maUserInitials').textContent = initials;
      }

      initAssistant(firstName);
    });
  </script>
