<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="sc-blue-logo.png"/>
<title>Raw Materials — SmarTuna</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="theme.css"/>
<script src="theme.js"></script>
<style>
  @font-face{font-family:'Bitsumis';src:url('BITSUMIS.TTF') format('truetype');font-display:swap;}
  :root{}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Poppins','DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .sc-wm{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .sc-wm-top{font-family:'Bitsumis',sans-serif !important;font-weight:900 !important;font-size:16px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--wm-top);}
  .sc-wm-sub{font-family:'Bitsumis',sans-serif !important;font-weight:700 !important;font-size:7px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--text);margin-top:2px;}
  .topbar-brand{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 30px;
          background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:400;}
  .nav{display:flex;gap:2px;}
  .nav-item{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);text-decoration:none;}
  .nav-item:hover{background:var(--bg);color:var(--text);}
  .nav-item.active{background:var(--bg);color:var(--text);font-weight:600;}
  .avatar-wrap{position:relative;}
  .avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;
    font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
  .avatar-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);min-width:186px;
    overflow:hidden;z-index:999;}
  .avatar-menu.open{display:block;}
  .avatar-menu-name{padding:11px 15px 7px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);}
  .avatar-menu a,.avatar-menu button{display:block;padding:9px 15px;font-size:13px;color:var(--menu-text);
    text-decoration:none;font-weight:500;width:100%;background:none;border:none;font-family:inherit;
    cursor:pointer;text-align:left;}
  .avatar-menu a:hover,.avatar-menu button:hover{background:var(--bg);color:var(--primary);}

  .wrap{max-width:1400px;margin:0 auto;padding:20px 30px 60px;}
  .crumb{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .crumb a{color:var(--muted);text-decoration:none;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .h1{font-size:21px;font-weight:700;}
  .h1-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .btn{padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
       border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;display:inline-block;}
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);color:#fff;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .search{flex:1;min-width:240px;height:40px;padding:0 14px;border:1px solid var(--border);border-radius:10px;
          font-family:inherit;font-size:13px;background:var(--surface);}
  .search:focus{outline:none;border-color:var(--primary);}
  .pill{height:40px;padding:0 15px;border:1px solid var(--border);border-radius:10px;background:var(--surface);
        font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .pill.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:14px 18px;
     border-bottom:1px solid var(--border);white-space:nowrap;}
  td{font-size:13px;padding:14px 18px;border-bottom:1px solid var(--rule);}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  .ref{font-weight:600;}
  .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .num{text-align:right;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
  .st-active{background:var(--good-bg);color:var(--good-fg);}
  .st-draft{background:var(--surface-2);color:var(--muted);}
  .st-archived{background:var(--warn-bg);color:var(--warn-fg);}
  .src{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
  .cert{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:700;
        padding:2px 7px;border-radius:5px;margin-right:4px;}
  .empty{padding:60px 24px;text-align:center;}
  .empty h4{font-size:15px;margin-bottom:8px;}
  .empty p{font-size:12.5px;color:var(--muted);max-width:440px;margin:0 auto 20px;line-height:1.6;}
  @media(max-width:900px){ .nav{display:none;} .hide-sm{display:none;} }
</style>
</head>
<body>
<div class="topbar">
  <a href="home-logged-in.html" class="topbar-brand">
    <img src="sc-blue-logo.png" data-dark-src="sc-white-logo.png" alt="SmarTuna" style="width:28px;height:28px;object-fit:contain;"/>
    <span class="sc-wm"><span class="sc-wm-top">SmarTuna</span><span class="sc-wm-sub">concept</span></span>
  </a>
  <div class="nav">
    <a href="home-logged-in.html" class="nav-item">Home</a>
    <a href="raw-material-list.html" class="nav-item active">My Studio</a>
    <a href="Species.html" class="nav-item">Atlas</a>
    <a href="report.html" class="nav-item">Support</a>
  </div>
  <div class="avatar-wrap">
    <div class="avatar-btn" id="avatarBtn" onclick="toggleAvatarMenu()"><span id="avatarInitials">··</span></div>
    <div class="avatar-menu" id="avatarMenu">
      <div class="avatar-menu-name" id="avatarGreeting">Hello!</div>
      <a href="profile.html">Profile</a><a href="organisation.html">Your Company</a>
      <button onclick="handleLogout()">Logout</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="crumb"><a href="home-logged-in.html">My Studio</a> / Raw Materials</div>
  <div class="page-head">
    <div>
      <div class="h1">Raw Materials</div>
      <div class="h1-sub" id="countSub">Loading…</div>
    </div>
    <a href="cc-list.html" class="btn" style="display:inline-flex;align-items:center;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Catch Certificates</a>
    <a href="raw-material-form.html" class="btn btn-primary">New raw material</a>
  </div>
  <div class="toolbar">
    <input class="search" id="q" placeholder="Search by reference, species, supplier or vessel…"/>
    <button class="pill" id="fWild" onclick="toggleF('wild')">Wild Capture</button>
    <button class="pill" id="fFarm" onclick="toggleF('farm')">Aquaculture</button>
    <button class="pill" id="fGap" onclick="toggleF('gap')">Missing catch data</button>
  </div>
  <div class="card" id="host"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://enbdaajcromxmhgcverp.supabase.co';
const SUPABASE_KEY='sb_publishable_NxQj3wE3UqijQVwwUNCfxg_f2uFLRz5';
const dbClient=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=v=>(v==null||v===''||isNaN(Number(v)))?null:Number(v).toLocaleString('en-US');
function fmtDate(v){ if(!v) return null; const d=new Date(v); return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

function toggleAvatarMenu(){ $('avatarMenu').classList.toggle('open'); }
document.addEventListener('click',e=>{const w=document.querySelector('.avatar-wrap');
  if(w&&!w.contains(e.target)) $('avatarMenu')?.classList.remove('open');});
function greetingTime(){const h=new Date().getHours();return h<12?'Good Morning':(h<18?'Good Afternoon':'Good Evening');}
async function handleLogout(){ if(dbClient) await dbClient.auth.signOut(); location.href='index.html'; }

const SRC_ICON={'Wild Capture':'🌊','Aquaculture':'🐟'};
let ROWS=[], F={wild:false,farm:false,gap:false};

function toggleF(k){
  F[k]=!F[k];
  if(k==='wild'&&F.wild) F.farm=false;
  if(k==='farm'&&F.farm) F.wild=false;
  $('fWild').classList.toggle('on',F.wild);
  $('fFarm').classList.toggle('on',F.farm);
  $('fGap').classList.toggle('on',F.gap);
  render();
}

function rowHTML(r){
  const cls={'Active':'st-active','Draft':'st-draft','Archived':'st-archived'}[r.status]||'st-draft';
  const certs=(r.certifications||[]).slice(0,3).map(c=>`<span class="cert">${esc(c)}</span>`).join('');
  const vess=(r._vessels||[]).slice(0,2).join(', ');
  return `<tr onclick="location.href='raw-material-detail.html?id=${encodeURIComponent(r.id)}'">
    <td><div class="ref">${esc(r.rm_ref||'—')}</div><div class="sub">${esc(r.name||'')}</div></td>
    <td><div>${esc(r.species_name||'—')}</div><div class="sub"><i>${esc(r.scientific_name||'')}</i></div></td>
    <td class="hide-sm"><span class="src">${SRC_ICON[r.source_type]||''} ${esc(r.source_type||'—')}</span>
      <div class="sub">${esc(r.product_form||'')}</div></td>
    <td class="hide-sm"><div>${esc(r.supplier_name||'—')}</div><div class="sub">${esc(r.origin_country||'')}</div></td>
    <td class="hide-sm">${r._catches?`${r._catches} event${r._catches===1?'':'s'}`:'<span style="color:var(--dim);">none</span>'}
      <div class="sub">${esc(vess)}</div></td>
    <td class="num">${fmtN(r.quantity_kg)?fmtN(r.quantity_kg)+' kg':'—'}</td>
    <td class="hide-sm">${certs||'<span style="color:var(--dim);">—</span>'}</td>
    <td class="hide-sm">${fmtDate(r.received_date)||'—'}</td>
    <td><span class="badge ${cls}">${esc(r.status||'Draft')}</span></td>
  </tr>`;
}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const shown=ROWS.filter(r=>{
    if(F.wild&&r.source_type!=='Wild Capture') return false;
    if(F.farm&&r.source_type!=='Aquaculture') return false;
    if(F.gap&&!(r.source_type==='Wild Capture'&&!r._catches)) return false;
    if(!q) return true;
    return [r.rm_ref,r.name,r.species_name,r.scientific_name,r.supplier_name,r.origin_country,
            ...(r._vessels||[])].filter(Boolean).join(' ').toLowerCase().includes(q);
  });

  const gaps=ROWS.filter(r=>r.source_type==='Wild Capture'&&!r._catches).length;
  $('countSub').innerHTML = ROWS.length
    ? `${shown.length} of ${ROWS.length} lot${ROWS.length===1?'':'s'}`
      + (gaps?` · <span style="color:var(--warn-fg);">${gaps} missing catch data</span>`:'')
    : 'No raw materials yet';

  if(!shown.length){
    $('host').innerHTML = ROWS.length
      ? `<div class="empty"><h4>Nothing matches</h4><p>Try a different search term or clear the filters.</p></div>`
      : `<div class="empty"><h4>No raw materials yet</h4>
          <p>A raw material sits between Species and Product. It records which species,
             from which supplier, and — for wild capture — which vessel, area and trip.
             Shipment lots and EU Catch documents both read from it.</p>
          <a href="raw-material-form.html" class="btn btn-primary">Create your first raw material</a></div>`;
    return;
  }
  $('host').innerHTML=`<table><thead><tr>
    <th>Reference</th><th>Species</th><th class="hide-sm">Source</th><th class="hide-sm">Supplier</th>
    <th class="hide-sm">Catch Events</th><th class="num">Quantity</th><th class="hide-sm">Certifications</th>
    <th class="hide-sm">Received</th><th>Status</th>
  </tr></thead><tbody>${shown.map(rowHTML).join('')}</tbody></table>`;
}

async function load(){
  if(!dbClient){ render(); return; }
  try{
    const {data,error}=await dbClient.from('raw_materials').select('*')
      .is('deleted_at',null).order('created_at',{ascending:false});
    if(error) throw error;
    ROWS=data||[];
    if(ROWS.length){
      const {data:c}=await dbClient.from('raw_material_catches')
        .select('raw_material_id,vessel_name').in('raw_material_id',ROWS.map(r=>r.id));
      const agg={};
      (c||[]).forEach(x=>{ const a=agg[x.raw_material_id] ||= {n:0,v:[]};
        a.n++; if(x.vessel_name) a.v.push(x.vessel_name); });
      ROWS=ROWS.map(r=>({...r,_catches:agg[r.id]?.n||0,_vessels:[...new Set(agg[r.id]?.v||[])]}));
    }
  }catch(err){ console.error('Load failed:',err); }
  render();
}

$('q').addEventListener('input',render);

async function loadProfile(){
  if(!dbClient) return;
  try{
    const {data:{session}}=await dbClient.auth.getSession();
    if(!session){ location.href='login.html'; return; }
    const {data:p}=await dbClient.from('profiles')
      .select('first_name,last_name,avatar_color,photo_url').eq('id',session.user.id).single();
    const f=p?.first_name||session.user.email.split('@')[0], l=p?.last_name||'';
    if(p?.photo_url) $('avatarBtn').innerHTML=`<img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>`;
    else{ $('avatarBtn').style.background=p?.avatar_color||'var(--primary)';
          $('avatarInitials').textContent=(f.charAt(0)+(l?l.charAt(0):'')).toUpperCase(); }
    $('avatarGreeting').textContent=`${greetingTime()}, ${f}!`;
    if(window.applyProfileTheme) applyProfileTheme(p);
  }catch(e){ console.warn('Profile load failed:',e.message); }
}

load(); loadProfile();
</script>
</body>
</html>
