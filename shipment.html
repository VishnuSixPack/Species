<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Shipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('dash-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
:root{
  --brand:#2059a8;
  --page:#f4f5f7; --surface:#ffffff; --border:#e6e8ec; --field-border:#cfd5de; --field-bg:#ffffff;
  --text:#14161a; --label:#1c1f25; --muted:#79818f; --placeholder:#7b8494;
  --accent:#2f6fed; --accent-soft:rgba(47,111,237,.12); --accent-ring:rgba(47,111,237,.18);
  --ok-bg:#d9f5e1; --ok-text:#1c7a43; --warn-bg:#fdf0d5; --warn-text:#8a5f0f;
  --neutral-bg:#eceef2; --neutral-text:#5f6775; --danger:#d14343; --danger-soft:rgba(209,67,67,.1);
  --rule:#5b616b; --menu-shadow:0 14px 34px rgba(16,24,40,.16); --shadow:0 1px 2px rgba(16,24,40,.05);
  --band:#f0f2f6;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#14305e;
  --page:#0f1115; --surface:#171a20; --border:#272b33; --field-border:#3a404b; --field-bg:#1c2027;
  --text:#e8eaee; --label:#dfe2e8; --muted:#98a0ae; --placeholder:#8a92a0;
  --accent:#7aa2ff; --accent-soft:rgba(122,162,255,.16); --accent-ring:rgba(122,162,255,.26);
  --ok-bg:#14361f; --ok-text:#6ddc98; --warn-bg:#3a2d10; --warn-text:#e6bd63;
  --neutral-bg:#252a33; --neutral-text:#a3abb8; --danger:#ff7b7b; --danger-soft:rgba(255,123,123,.12);
  --rule:#606673; --menu-shadow:0 14px 34px rgba(0,0,0,.5); --shadow:none; --band:#1b1f27;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--accent)}

/* ---- shell ---- */
.top-band{height:48px;background:var(--brand);color:#fff}
.tb-inner{height:100%;max-width:1320px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none}
.brand-mark{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-size:15px;font-weight:600}
.brand-sub{font-size:11px;opacity:.75;padding-left:10px;border-left:1px solid rgba(255,255,255,.3)}
.tb-actions{display:flex;align-items:center;gap:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:#fff;color:#2059a8;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.theme-toggle{display:flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;color:#fff;font-size:11px;padding:3px;border-radius:20px}
.theme-toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tt-track{width:38px;height:20px;border-radius:20px;background:rgba(255,255,255,.25);position:relative}
.tt-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.tt-thumb svg{width:11px;height:11px;fill:none;stroke:#f5a400;stroke-width:2;stroke-linecap:round}
.tt-thumb .i-moon{display:none;fill:#2059a8;stroke:none}
[data-theme="dark"] .tt-thumb{transform:translateX(18px)}
[data-theme="dark"] .tt-thumb .i-sun{display:none}
[data-theme="dark"] .tt-thumb .i-moon{display:block}
.crumbs{background:var(--surface);border-bottom:1px solid var(--border)}
.crumbs-inner{max-width:1320px;margin:0 auto;padding:0 24px;height:38px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.crumbs .sep{color:var(--field-border)}
.crumbs [aria-current]{color:var(--text)}

.page{max-width:1320px;margin:0 auto;padding:26px 24px 120px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--border)}
.page-head h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-head .src-badge{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;letter-spacing:0}
.page-head .sub{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.page-head .sub b{color:var(--accent);font-weight:500}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--field-border);background:var(--surface);color:var(--text);text-decoration:none;transition:border-color .12s,filter .12s,background .12s}
.btn:hover{border-color:#b3bccb}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:30px;align-items:start}
.side{position:sticky;top:16px}
#sections{min-width:0}
.side .grp{margin-bottom:18px}
.side .grp-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 6px}
.side a{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-left:-10px;border-left:2px solid transparent;font-size:13px;color:var(--text);text-decoration:none;border-radius:0 6px 6px 0}
.side a:hover{background:var(--surface)}
.side a.active{border-left-color:var(--accent);color:var(--accent);font-weight:500}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--field-border);flex:none;transition:background .2s}
.ndot.ok{background:#1fbf6a;box-shadow:0 0 0 3px rgba(31,191,106,.18)}
.ndot.pending{background:#e5a32b}
.side .save{width:100%;justify-content:center;margin-top:8px;height:42px}
.side hr{border:0;border-top:1px solid var(--border);margin:6px 0 14px}
.side .progress{font-size:11.5px;color:var(--muted);margin:10px 0 0;text-align:center}

/* ---- cards ---- */
.section-head{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.section-head span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
.section-head i{flex:1;height:1px;background:var(--rule);opacity:.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px;scroll-margin-top:16px}
.card-head{display:flex;align-items:center;gap:16px;padding:13px 20px}
.card-head h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.card-head .spacer{flex:1}
.card-body{padding:4px 20px 22px;border-top:1px solid var(--border)}
.card.collapsed .card-body{display:none}
.card.off .card-body{opacity:.5;pointer-events:none}
.iconbtn{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--page)}
.iconbtn svg{transition:transform .18s}
.card.collapsed .iconbtn svg{transform:rotate(180deg)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-text)}
.pill.pending{background:var(--warn-bg);color:var(--warn-text)}
.pill.optional,.pill.off{background:var(--neutral-bg);color:var(--neutral-text)}
.switch{position:relative;display:inline-flex;width:40px;height:22px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#c6cdd8;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{box-shadow:0 0 0 3px var(--accent-ring)}
[data-theme="dark"] .switch span{background:#3a404b}
.subhead{display:flex;align-items:center;gap:12px;margin:18px 0 0}
.subhead span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.subhead i{flex:1;height:1px;background:var(--border)}
.subhead .rm{margin-left:4px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:18px}
.panel-body{padding:16px 18px 20px}
.panel h3{font-size:14px;font-weight:600;margin:0 0 4px}
.panel .divider{height:1px;background:var(--border);margin:20px -18px 2px}
.panel.off .ts-body{opacity:.55;pointer-events:none}
.ts-head{padding:14px 18px}
.ts-head h3{margin:0 0 2px}
.ts-note{margin:0;font-size:12px;color:var(--muted)}
.ts-body{padding:4px 18px 18px;border-top:1px solid var(--border)}

/* ---- fields ---- */
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 18px;margin-top:16px;align-items:start}
.row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.row.wide1{grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr))}
.unit-tag{display:flex;align-items:center;padding:0 12px;border-left:1px solid var(--field-border);background:var(--page);color:var(--muted);font-size:12px;white-space:nowrap}
.row.one{grid-template-columns:1fr}
.span2{grid-column:span 2}.span3{grid-column:span 3}.full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;min-width:0}
.field > label{font-size:12.5px;font-weight:500;color:var(--label);display:flex;align-items:center;gap:6px;min-height:20px}
.field .req{color:var(--danger);font-weight:600}
.field .tag{font-size:10px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;line-height:16px}
.field > .hint{margin:0 0 6px}
.field > label + .clearwrap,.field > label + .with-plus,.field > label + .unit-wrap,.field > label + textarea,.field > label + .yesno,.field > label + input,.field > label + .lockbox,.field > label + .trigger{margin-top:6px}
.field.dim > label{color:var(--muted)}
.hint{font-size:11px;color:var(--muted);margin:0;line-height:1.45}
.after{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.after.alert{color:var(--warn-text)}
.after.bad{color:var(--danger)}
.field.err .ctl,.field.err .trigger{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.field.err > label::after{content:"Required";font-size:10.5px;color:var(--danger);font-weight:500;margin-left:auto}

.ctl{width:100%;height:40px;border:1px solid var(--field-border);background:var(--field-bg);color:var(--text);border-radius:8px;padding:0 12px;font:inherit;font-size:13.5px;outline:none;transition:border-color .12s,box-shadow .12s}
textarea.ctl{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.ctl::placeholder{color:var(--placeholder)}
.ctl:hover:not(:disabled){border-color:#b3bccb}
.ctl:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.ctl:disabled,.ctl[readonly]{background:var(--page);color:var(--muted);cursor:not-allowed}
.ctl.strong{font-weight:600}
.lockbox{height:40px;border:1px solid var(--border);background:var(--page);border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lockbox svg{flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.lockbox a{text-decoration:none;font-weight:500;color:var(--accent)}

.unit-wrap{display:flex;border:1px solid var(--field-border);border-radius:8px;background:var(--field-bg);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.unit-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.unit-wrap .ctl{border:0;border-radius:0;box-shadow:none!important}
.unit-wrap select{border:0;border-left:1px solid var(--field-border);background:var(--page);color:var(--muted);font:inherit;font-size:12px;padding:0 10px;min-width:74px;cursor:pointer;outline:none}
.field.err .unit-wrap{border-color:var(--danger)}
.with-plus{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:8px}
.plus{width:40px;height:40px;border:0;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:filter .12s}
.plus:hover:not(:disabled){filter:brightness(.95)}
.plus:disabled{opacity:.45;cursor:not-allowed}
.plus:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.yesno{display:inline-flex;align-items:center;gap:10px;height:40px;font-size:13px;cursor:pointer;user-select:none}

/* ---- dropdown ---- */
.clearwrap{position:relative}
.clearwrap .trigger,.clearwrap .ctl{padding-right:40px}
.clearbtn{position:absolute;right:8px;top:20px;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;width:26px;height:26px;display:none;place-items:center;border-radius:5px;z-index:2}
.clearwrap.has-value .clearbtn{display:grid}
.clearwrap.has-value .caret{visibility:hidden}
.clearbtn:hover{color:var(--text);background:var(--page)}
.clearwrap:has(.ctl:disabled) .clearbtn,.clearwrap:has(.trigger:disabled) .clearbtn,.card.off .clearbtn{display:none}
.dd,.dp{position:relative}
.dd.open,.dp.open{z-index:60}
.trigger{width:100%;min-height:40px;border:1px solid var(--field-border);background:var(--field-bg);color:var(--placeholder);border-radius:8px;padding:4px 12px;font:inherit;font-size:13.5px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .12s,box-shadow .12s}
.trigger:hover:not(:disabled){border-color:#b3bccb}
.trigger:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.trigger:disabled{background:var(--page);cursor:not-allowed}
.trigger.has{color:var(--text)}
.trigger .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trigger .chips{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.trigger .caret{color:var(--muted);flex:none;transition:transform .18s}
.dd.open .trigger,.dp.open .trigger{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.dd.open .caret{transform:rotate(180deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:2px 4px 2px 8px;max-width:100%}
.chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .chip-x{border:0;background:transparent;color:inherit;cursor:pointer;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;padding:0;font-size:13px;line-height:1}
.chip .chip-x:hover{background:rgba(0,0,0,.08)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--menu-shadow);padding:6px;max-height:264px;overflow-y:auto;display:none}
.dd.open .menu,.dp.open .menu,.search.open .menu{display:block;animation:pop .13s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.opt:hover,.opt.active{background:var(--page)}
.opt.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt .tick{margin-left:auto;opacity:0;flex:none}
.opt.sel .tick{opacity:1}
.opt .sub{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400;padding-left:14px}
.opt.sel .sub + .tick{margin-left:8px}
.opt.empty{color:var(--muted);cursor:default}
.opt.empty:hover{background:none}
.menu .mhead{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}

/* ---- date picker ---- */
.dp .menu{width:288px;padding:12px}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-title{flex:1;text-align:center;font-weight:600;font-size:13.5px}
.calnav{border:1px solid var(--border);background:var(--surface);color:var(--text);width:28px;height:28px;border-radius:7px;display:grid;place-items:center;cursor:pointer}
.calnav:hover{background:var(--page)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{font-size:10.5px;color:var(--muted);text-align:center;padding:4px 0 6px;font-weight:500}
.day{height:34px;border:0;background:transparent;color:var(--text);border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px}
.day:hover{background:var(--page)}
.day.today{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.day.sel{background:var(--accent);color:#fff;font-weight:600}
.day.blank{visibility:hidden}
.cal-foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.cal-foot button{border:0;background:transparent;color:var(--accent);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;padding:4px 6px;border-radius:6px}
.cal-foot button:hover{background:var(--page)}
.cal-foot .clear{color:var(--muted)}

/* ---- misc controls ---- */
.linkbtn{border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px;border-radius:6px;display:inline-flex;align-items:center;gap:6px}
.linkbtn:hover:not(:disabled){text-decoration:underline}
.linkbtn:disabled{color:var(--muted);opacity:.6;cursor:not-allowed}
.linkbtn:focus-visible,.rm:focus-visible,.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.addbtn{margin-top:14px;height:36px;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:0 14px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.addbtn:hover{background:var(--accent-soft)}
.rm{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11.5px;padding:2px 4px;font-family:inherit;border-radius:4px}
.rm:hover{color:var(--danger);background:var(--danger-soft)}
.xbtn{width:18px;height:18px;border-radius:50%;border:0;background:var(--page);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.xbtn:hover{background:var(--danger-soft);color:var(--danger)}
.chain{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:16px}
.chain .field{flex:0 1 230px}
.arrow{height:40px;display:flex;align-items:center;color:var(--muted);font-size:16px;user-select:none}
.chain .linkbtn{height:40px}
.seg{margin-left:auto;display:inline-flex;align-items:center;height:24px;background:var(--page);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{height:18px;display:flex;align-items:center;border:0;background:transparent;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;padding:0 9px;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.linkbtn.done{color:var(--ok-text)}

/* ---- product search band ---- */
.band{margin:0 -20px;padding:16px 20px 18px;background:var(--band);border-bottom:1px solid var(--border)}
.band h4{margin:0;font-size:13px;font-weight:600}
.band p{margin:2px 0 12px;font-size:12px;color:var(--muted)}
.band-row{display:flex;align-items:center;gap:12px}
.band-row .or{color:var(--muted);font-size:12px}
.search{position:relative;flex:1;min-width:0}
.search .ctl{padding-left:36px}

/* ---- tables / allocation ---- */

.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--page)}
.tbl .ref{font-weight:600;color:var(--accent)}

/* ---- line items ---- */

/* ---- modal / toast ---- */
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(10,14,22,.46);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fadeIn .18s ease}
.overlay.out{animation:fadeOut .18s ease forwards}
.modal{position:relative;width:min(430px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 28px 24px;text-align:center;box-shadow:0 34px 80px rgba(8,12,20,.38);animation:rise .42s cubic-bezier(.19,1,.3,1)}

.modal.ask .badge{background:linear-gradient(145deg,#5b8cff,#2f6fed);box-shadow:0 12px 26px rgba(47,111,237,.3)}
.modal .badge svg{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .55s .2s cubic-bezier(.65,0,.35,1) forwards}
.modal.ask .badge svg{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.modal h3{margin:0 0 8px;font-size:17px;font-weight:600}
.modal p{margin:0 auto;font-size:13px;color:var(--muted);line-height:1.6;max-width:34ch}

.modal li span{color:var(--warn-text);font-size:11.5px}
.modal .obj{color:var(--text);font-weight:600}
.modal .mbtns{display:flex;gap:10px;margin-top:20px}
.modal .mbtns button{flex:1;height:42px;border-radius:10px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}

.modal .primary:hover{filter:brightness(1.07)}
.modal .secondary{border:1px solid var(--field-border);background:var(--surface);color:var(--text)}
.modal input.ctl{margin-top:14px;text-align:left}
.modal .mx{position:absolute;top:12px;right:12px;border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes sink{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#202b3b;color:#fff;border-radius:8px;padding:11px 18px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:.25s;pointer-events:none;z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}

.hidden{display:none!important}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

}

.rt-line .rt-a{left:0} .rt-line .rt-z{left:100%}
.rt-line i.on{border-color:var(--accent);background:var(--accent)}
.rt-line.late .rt-z{border-color:var(--danger)}
.rt-line .rt-t{width:8px;height:8px;margin:-4px 0 0 -4px;border-width:2px;border-color:var(--muted)}
.mode{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.mode svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.late-t{font-size:11px;color:var(--danger);font-weight:500}
.docs-ok{font-size:11.5px;color:var(--ok-text);font-weight:500}
.docs-miss{font-size:11.5px;color:var(--warn-text);background:var(--warn-bg);border-radius:999px;padding:2px 9px;font-weight:500;cursor:help;white-space:nowrap}

/* ---- summary drawer ---- */
.dr-ov{position:fixed;inset:0;z-index:150;background:rgba(10,14,22,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.dr-ov.show{opacity:1;pointer-events:auto}
body.dr-open{overflow:hidden}
.dr{position:absolute;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(8,12,20,.25);transform:translateX(30px);transition:transform .28s cubic-bezier(.19,1,.3,1)}
.dr-ov.show .dr{transform:none}
.dr-load{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 24px 14px;border-bottom:1px solid var(--border)}
.dr-ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dr-ttl h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em}
.dr-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.dr .mx{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.dr .mx:hover{background:var(--page);color:var(--text)}
.dr-body{flex:1;overflow:auto;padding:4px 24px 24px}
.dr-body section{padding:16px 0;border-bottom:1px solid var(--border)}
.dr-body section:last-child{border-bottom:0}
.dr-body h3{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dr-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 0;border-bottom:1px solid var(--border)}
.dr-strip .kv{background:var(--page);border-radius:9px;padding:9px 12px}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-weight:500;font-size:13px;word-break:break-word}
.kv .none{color:var(--placeholder);font-style:normal}
.kv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.dr-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;border-bottom:1px solid var(--border)}
.dr-2 section{border-bottom:0}
.party{padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px}
.party span{display:block;font-size:11px;color:var(--muted)}
.party b{display:block;font-weight:600}
.party em{font-style:normal;font-size:11.5px;color:var(--muted)}
.docs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.docs li{display:grid;grid-template-columns:22px auto 1fr;gap:8px;align-items:center;font-size:12.5px}
.docs .dk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.docs li.ok .dk{background:var(--ok-bg);color:var(--ok-text)}
.docs li.miss .dk{background:var(--warn-bg);color:var(--warn-text)}
.docs li b{font-weight:500}
.docs li span:last-child{color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs li.miss span:last-child{color:var(--warn-text);font-weight:500}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:8px;top:18px;bottom:-2px;width:2px;background:var(--neutral-bg)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--accent)}
.tl-dot{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--field-border)}
.tl li.done .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.tl li.cur .tl-dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-ring)}
.tl li.late .tl-dot{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)}
.tl-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl-h b{font-weight:600}
.tl-h span{color:var(--muted);font-size:12.5px}
.tl-dates{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px;font-size:12.5px}
.tl-dates em{display:block;font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tl-dates .act{color:var(--ok-text);font-weight:600}
.dr-lines{min-width:620px}
.dr-body .tbl-wrap{margin-top:0}
.mixed-chips{display:flex;gap:8px;flex-wrap:wrap}
.mchip{font:inherit;text-align:left;border:1px solid var(--field-border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 12px;cursor:pointer}
.mchip:hover{border-color:var(--accent)}
.mchip b{display:block;color:var(--accent);font-weight:600}
.mchip span{font-size:11.5px;color:var(--muted)}
.notes{margin:0;white-space:pre-wrap}
.dr-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--border);flex-wrap:wrap}
@media (max-width:1100px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .search{max-width:none;flex:1 1 100%}
  select.ctl{flex:1 1 calc(50% - 5px);max-width:none;min-width:0}
  .filters .count{margin-left:0;flex:1 1 100%}
  table.stbl,.stbl thead,.stbl tbody,.stbl tr,.stbl td{display:block;min-width:0;width:auto}
  .stbl thead{display:none}
  .stbl tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"ship status" "order docs" "route route" "mode qty";gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .stbl td:nth-child(1){grid-area:ship} .stbl td:nth-child(2){grid-area:order} .stbl td:nth-child(3){grid-area:route}
  .stbl td:nth-child(4){grid-area:mode} .stbl td:nth-child(5){grid-area:qty} .stbl td:nth-child(6){grid-area:status;text-align:right} .stbl td:nth-child(7){grid-area:docs;text-align:right;align-self:center}
  .stbl td{padding:0;border:0}
  .stbl td.rt-cell{width:auto;margin:2px 0}
  .stbl tbody tr.empty{display:block}
  .dr-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dr-2{grid-template-columns:1fr;gap:0}
  .dr-head,.dr-body,.dr-foot{padding-left:16px;padding-right:16px}
}
@media print{ .dr-ov{display:none} }

<main class="page">
  <div class="page-head"><div><h1><span id="pageTitle">Create shipment</span> <span class="src-badge">from master order</span></h1><p class="sub" id="headSub"></p></div>
    <div class="head-actions"><button type="button" class="btn" data-action="changeSource"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><polyline points="21 3 21 8 16 8"/><polyline points="3 21 3 16 8 16"/></svg>Change source</button></div></div>

<div class="mobile-save"><span class="progress"></span><button type="button" class="btn primary" data-action="save"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>Save shipment</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   Shared form core: state paths, controls, section cards, side nav,
   popups, theme and storage. Pages define S, SECTIONS, HOOKS, ACTIONS.
   ===================================================================== */
let S = {};
const SECTIONS = [];
const HOOKS = {};      // onChange(path), onInput(path), onStatus()
const ACTIONS = {};    // data-action handlers
let SHOW_ERR = false;

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = v => String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = p => p.split(".").reduce((o,k)=>o==null?undefined:o[k], S);
const set = (p,v) => { const k=p.split("."); const last=k.pop(); k.reduce((o,x)=>o[x],S)[last]=v; };
const isEmpty = v => v==null || v==="" || (Array.isArray(v) && v.length===0);
const filled = p => !isEmpty(typeof get(p)==="string" ? get(p).trim() : get(p));
const num = v => { const n = parseFloat(String(v??"").replace(/,/g,"")); return isNaN(n) ? 0 : n; };
const fmtN = n => Number(n||0).toLocaleString("en-US");
const todayISO = () => { const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };
const MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return `${String(d).padStart(2,"0")} ${MONTHS_S[m-1]} ${y}`; };
const addDays = (iso,n) => { const [y,m,d]=iso.split("-").map(Number); const t=new Date(y,m-1,d+n); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };

const OPT = {};
const listOf = src => typeof src==="string" ? (OPT[src]||[]) : (src||[]);
const optVal = o => typeof o==="string" ? o : o.value;

/* ---------- icons ---------- */
const CARET = `<svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
const TICK  = `<svg class="tick" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const CAL   = `<svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6"/><line x1="16" y1="2.5" x2="16" y2="6"/></svg>`;
const XICON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
const LOCK  = `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
const CHEV  = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`;
const SEARCHI = `<svg class="sicon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>`;

/* ---------- builders ---------- */
function field(label, ctl, o={}){
  const err = SHOW_ERR && o.req && o.path && !filled(o.path) && !o.disabled;
  return `<div class="field ${o.cls||""} ${o.dim?"dim":""} ${err?"err":""}">
    <label>${label}${o.req?'<span class="req">*</span>':""}${o.tag?`<span class="tag">${o.tag}</span>`:""}${o.extra||""}</label>
    ${o.hint?`<p class="hint">${o.hint}</p>`:""}${ctl}${o.after||""}</div>`;
}
const clearBtn = (path,multi) => `<button class="clearbtn" type="button" data-clear="${path}" ${multi?'data-multi="1"':""} aria-label="Clear">${XICON}</button>`;
function textIn(path, ph="", o={}){
  const v = get(path) ?? "";
  return `<div class="clearwrap ${v!==""?"has-value":""}"><input class="ctl ${o.strong&&v?"strong":""}" type="text" ${o.num?'inputmode="decimal" data-num="1"':""} ${o.live?'data-live="1"':""}
    data-bind="${path}" value="${esc(v)}" placeholder="${esc(ph)}" ${o.disabled?"disabled":""} aria-label="${esc(o.aria||ph)}">${o.noclear?"":clearBtn(path)}</div>`;
}
function textArea(path, ph="", rows=3){
  return `<textarea class="ctl" rows="${rows}" data-bind="${path}" placeholder="${esc(ph)}">${esc(get(path)??"")}</textarea>`;
}
function lockBox(text, o={}){ return `<div class="lockbox" title="${esc(o.title||"Set automatically")}">${LOCK}<span>${text}</span></div>`; }
function unitIn(path, unitPath, units, ph=""){
  const u = get(unitPath);
  return `<div class="unit-wrap"><input class="ctl" type="text" inputmode="decimal" data-num="1" data-bind="${path}" value="${esc(get(path)??"")}" placeholder="${esc(ph)}" aria-label="${esc(ph)}">
    <select data-bind="${unitPath}" aria-label="Unit">${units.map(x=>`<option ${x===u?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`;
}
function yesNo(path, aria){
  const v = !!get(path);
  return `<label class="yesno"><span class="switch"><input type="checkbox" data-bind="${path}" data-bool="1" ${v?"checked":""} aria-label="${esc(aria||path)}"><span></span></span><span>${v?"Yes":"No"}</span></label>`;
}
function optionHTML(o, selected){
  const v = optVal(o);
  const sub = typeof o==="string" || !o.sub ? "" : `<span class="sub">${esc(o.sub)}</span>`;
  return `<div class="opt ${selected?"sel":""}" role="option" aria-selected="${selected}" data-value="${esc(v)}">${esc(v)}${sub}${TICK}</div>`;
}
function chipsHTML(path, vals){
  return vals.map(v=>`<span class="chip"><b>${esc(v)}</b><span class="chip-x" role="button" tabindex="0" data-chip="${path}" data-v="${esc(v)}" aria-label="Remove ${esc(v)}">×</span></span>`).join("");
}
function dropdown(path, src, ph="Select an option", o={}){
  const val = get(path), multi = !!o.multi;
  const list = listOf(src);
  const has = multi ? (val||[]).length>0 : !!val;
  const lazy = list.length > LAZY_AT && typeof src==="string";
  const items = lazy ? "" : list.length ? list.map(x=>optionHTML(x, multi ? (val||[]).includes(optVal(x)) : optVal(x)===val)).join("")
                            : `<div class="opt empty">No options</div>`;
  const search = list.length > SEARCH_AT ? `<div class="dd-search"><input type="text" class="ctl" placeholder="Type to search ${list.length.toLocaleString()} options…" aria-label="Search options" autocomplete="off"></div>` : "";
  const shown = multi ? (has ? `<span class="chips">${chipsHTML(path,val)}</span>` : `<span class="txt">${esc(ph)}</span>`)
                      : `<span class="txt">${has?esc(val):esc(ph)}</span>`;
  const dd = `<div class="clearwrap ${has?"has-value":""}"><div class="dd" data-path="${path}" ${multi?'data-multi="1"':""} data-src="${typeof src==="string"?src:""}">
      <button type="button" class="trigger ${has?"has":""}" ${o.disabled?"disabled":""} aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(o.aria||ph)}">${shown}${CARET}</button>
      <div class="menu" role="listbox" ${multi?'aria-multiselectable="true"':""}>${search}<div class="dd-opts" ${lazy?'data-lazy="1"':""}>${items}</div></div>
    </div>${clearBtn(path,multi)}</div>`;
  if(!o.plus) return dd;
  return `<div class="with-plus">${dd}<button type="button" class="plus" data-addopt="${path}" data-src="${src}" ${multi?'data-multi="1"':""} ${o.disabled?"disabled":""} aria-label="Add new option" title="Add new option">+</button></div>`;
}
const SEARCH_AT = 10, LAZY_AT = 80, LAZY_SHOW = 100;
/* render (or filter) the options of an open dropdown */
function fillOptions(box, q){
  const wrap = box.querySelector(".dd-opts"); if(!wrap) return;
  q = (q||"").trim().toLowerCase();
  const path = box.dataset.path, multi = !!box.dataset.multi, val = get(path);
  if(wrap.dataset.lazy){
    const all = listOf(box.dataset.src);
    const hits = q ? all.filter(o=>optVal(o).toLowerCase().includes(q) || String(o.sub||"").toLowerCase().includes(q)) : all;
    const sel = x => multi ? (val||[]).includes(optVal(x)) : optVal(x)===val;
    const top = [...hits.filter(sel), ...hits.filter(x=>!sel(x))].slice(0, LAZY_SHOW);
    wrap.innerHTML = top.length ? top.map(x=>optionHTML(x, sel(x))).join("") + (hits.length>LAZY_SHOW ? `<div class="opt empty">Showing ${LAZY_SHOW} of ${hits.length.toLocaleString()} · keep typing to narrow down</div>` : "")
                                : `<div class="opt empty">No match for “${esc(q)}”</div>`;
  } else {
    let shown = 0;
    wrap.querySelectorAll(".opt[data-value]").forEach(o=>{ const hit = !q || o.textContent.toLowerCase().includes(q); o.hidden = !hit; if(hit) shown++; });
    let none = wrap.querySelector(".opt.none"); if(!shown && !none){ none = document.createElement("div"); none.className = "opt empty none"; wrap.appendChild(none); }
    if(none){ none.textContent = shown ? "" : `No match for “${q}”`; none.hidden = !!shown; }
  }
}
document.addEventListener("input", e=>{ const inp = e.target.closest(".dd-search input"); if(inp) fillOptions(inp.closest(".dd"), inp.value); });
function datePicker(path, ph="Select date", o={}){
  const v = get(path);
  return `<div class="clearwrap ${v?"has-value":""}"><div class="dp" data-path="${path}" data-ph="${esc(ph)}">
    <button type="button" class="trigger ${v?"has":""}" ${o.disabled?"disabled":""} aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(ph)}"><span class="txt">${v?fmtDate(v):esc(ph)}</span>${CAL}</button>
    <div class="menu" role="dialog" aria-label="Choose date"></div></div>${clearBtn(path)}</div>`;
}
function calendarHTML(view, selected){
  const [y,m] = view.split("-").map(Number);
  const first = (new Date(y,m-1,1).getDay()+6)%7, days = new Date(y,m,0).getDate(), t = todayISO();
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let cells = "";
  for(let i=0;i<first;i++) cells += `<button class="day blank" tabindex="-1"></button>`;
  for(let d=1; d<=days; d++){
    const iso = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cells += `<button type="button" class="day ${iso===selected?"sel":""} ${iso===t&&iso!==selected?"today":""}" data-date="${iso}">${d}</button>`;
  }
  return `<div class="cal-head"><button type="button" class="calnav" data-step="-1" aria-label="Previous month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="cal-title">${months[m-1]} ${y}</div>
    <button type="button" class="calnav" data-step="1" aria-label="Next month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div>
    <div class="cal-grid">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="cal-foot"><button type="button" data-date="${t}">Today</button><button type="button" class="clear" data-dclear="1">Clear</button></div>`;
}
const subhead = (t, extra="") => `<div class="subhead"><span>${t}</span><i></i>${extra}</div>`;

/* ---------- sections ---------- */
function statusOf(sec){
  if(S._off && S._off[sec.id]) return "off";
  const r = sec.req ? sec.req() : null;
  if(r) return r.every(Boolean) ? "ok" : "pending";
  const a = sec.all ? sec.all() : [];
  return a.length && a.every(Boolean) ? "ok" : "optional";
}
const PILL = {ok:"completed", pending:"incomplete", optional:"optional", off:"excluded"};
function mount(){
  S._off = S._off || {};
  let html = "", nav = "", lastGroup = null;
  SECTIONS.forEach(sec=>{
    if(sec.group !== lastGroup){
      if(lastGroup!==null) nav += `</div>`;
      html += `<div class="section-head"><span>${sec.group}</span><i></i></div>`;
      nav  += `<div class="grp"><div class="grp-label">${sec.group}</div>`;
      lastGroup = sec.group;
    }
    const sw = sec.noSwitch ? "" : `<label class="switch"><input type="checkbox" data-secswitch="${sec.id}" ${S._off[sec.id]?"":"checked"} aria-label="Include ${sec.title} section"><span></span></label>`;
    html += `<section class="card ${S._off[sec.id]?"off":""}" id="sec-${sec.id}" data-sec="${sec.id}" aria-labelledby="h-${sec.id}">
      <div class="card-head">${sw}<h2 id="h-${sec.id}">${sec.title}</h2><div class="spacer"></div>
        <span class="pill" data-pill="${sec.id}"></span>
        <button type="button" class="iconbtn" data-collapse="${sec.id}" aria-expanded="true" aria-label="Collapse ${sec.title}">${CHEV}</button></div>
      <div class="card-body" data-body="${sec.id}"></div></section>`;
    nav += `<a href="#sec-${sec.id}" data-nav="${sec.id}"><i class="ndot"></i>${sec.navTitle||sec.title}</a>`;
  });
  nav += `</div>`;
  $("#sections").innerHTML = html;
  $("#sidenav").innerHTML = nav;
  SECTIONS.forEach(s=>renderSection(s.id, true));
  updateStatus();
  observeNav();
}
function renderSection(id, quiet){
  const sec = SECTIONS.find(s=>s.id===id); if(!sec) return;
  $(`[data-body="${id}"]`).innerHTML = sec.render();
  if(sec.after) sec.after();
  if(!quiet) updateStatus();
}
const renderAll = () => { SECTIONS.forEach(s=>renderSection(s.id,true)); updateStatus(); };
function secOfPath(path){ const el = document.querySelector(`[data-bind="${CSS.escape(path)}"],[data-path="${CSS.escape(path)}"]`); return el?.closest("[data-sec]")?.dataset.sec; }
function updateStatus(){
  let done = 0, total = 0;
  SECTIONS.forEach(sec=>{
    const st = statusOf(sec);
    const pill = $(`[data-pill="${sec.id}"]`);
    if(pill){ pill.textContent = PILL[st]; pill.className = "pill "+st; }
    const dot = $(`[data-nav="${sec.id}"] .ndot`);
    if(dot) dot.className = "ndot "+(st==="ok"?"ok":st==="pending"?"pending":"");
    if(sec.req && st!=="off"){ total++; if(st==="ok") done++; }
  });
  $$(".progress").forEach(p=>p.textContent = `${done} of ${total} required sections complete`);
  HOOKS.onStatus && HOOKS.onStatus();
}
function rerenderKeepFocus(path){
  const active = document.activeElement;
  const pos = active && active.selectionStart;
  const id = secOfPath(path); if(id) renderSection(id);
  const el = document.querySelector(`[data-bind="${CSS.escape(path)}"]`);
  if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
}
function observeNav(){
  if(!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        $$(".side a").forEach(a=>a.classList.toggle("active", a.dataset.nav===en.target.dataset.sec));
        const a = $(`.side a[data-nav="${en.target.dataset.sec}"]`);
        if(a && window.innerWidth<=980) a.scrollIntoView({block:"nearest",inline:"center"});
      }
    });
  },{rootMargin:"-20% 0px -70% 0px"});
  $$(".card[data-sec]").forEach(c=>io.observe(c));
}

function popup({ok=true, kind, title, msg, list, primary, onPrimary, secondary, onSecondary, input}){
  closePopup(true);
  const k = kind || (ok?"":"err");
  const icon = k==="ask" ? `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`
    : ok ? `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
         : `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="13"/><line x1="12" y1="17.5" x2="12" y2="17.5"/></svg>`;
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "overlay";
  ov.innerHTML = `<div class="modal ${k}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <button class="mx" data-close="1" aria-label="Close">${XICON}</button>
    <div class="badge">${icon}</div><h3>${esc(title)}</h3>${msg?`<p>${msg}</p>`:""}
    ${list?`<ul>${list.map(l=>`<li data-goto="${l.id}"><b>${esc(l.title)}</b><span>${esc(l.note||"incomplete")}</span></li>`).join("")}</ul>`:""}
    ${input?`<input class="ctl" id="popupInput" type="text" placeholder="${esc(input)}">`:""}
    <div class="mbtns">${secondary?`<button class="secondary" data-sec-btn="1">${esc(secondary)}</button>`:""}<button class="primary" data-pri="1">${esc(primary||(ok?"Done":"Got it"))}</button></div></div>`;
  document.body.appendChild(ov);
  const inp = $("#popupInput", ov);
  (inp || $(".primary", ov)).focus();
  const doPrimary = () => { const v = inp ? inp.value.trim() : null; if(input && !v){ inp.focus(); return; } closePopup(); onPrimary && onPrimary(v); };
  if(inp) inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); doPrimary(); } });
  ov.addEventListener("click", e=>{
    if(e.target.closest("[data-pri]")) return doPrimary();
    if(e.target.closest("[data-sec-btn]")){ closePopup(); onSecondary && onSecondary(); return; }
    const g = e.target.closest("[data-goto]");

    if(e.target===ov || e.target.closest("[data-close]")) closePopup();
  });

document.addEventListener("click", e=>{
  /* collapse */
  const col = e.target.closest("[data-collapse]");

    const h = c.classList.contains("collapsed"); col.setAttribute("aria-expanded", !h); return; }

  /* chip remove */
  const chip = e.target.closest("[data-chip]");
  if(chip){ e.stopPropagation(); const p = chip.dataset.chip; set(p, (get(p)||[]).filter(x=>x!==chip.dataset.v));
    const box = chip.closest(".dd"); if(box) refreshMulti(box); changed(p); updateStatus(); return; }

  /* trigger */
  const trig = e.target.closest(".dd .trigger, .dp .trigger");
  if(trig && !trig.disabled){
    const box = trig.parentElement, open = box.classList.contains("open");
    closeAll();
    if(!open){
      if(box.classList.contains("dp")){
        box.dataset.view = (get(box.dataset.path) || todayISO()).slice(0,7);
        box.querySelector(".menu").innerHTML = calendarHTML(box.dataset.view, get(box.dataset.path));

      const sel = box.querySelector(".opt.sel"); if(sel) sel.scrollIntoView({block:"nearest"});
    }
    return;
  }
  /* option */
  const opt = e.target.closest(".dd .opt[data-value]");
  if(opt){
    const box = opt.closest(".dd"), path = box.dataset.path, v = opt.dataset.value;
    if(box.dataset.multi){
      const cur = get(path)||[]; set(path, cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v]);
      refreshMulti(box); changed(path); updateStatus(); return;
    }
    set(path, v); closeAll(); changed(path);
    const id = box.closest("[data-sec]")?.dataset.sec; if(id) renderSection(id);
    const t = document.querySelector(`.dd[data-path="${CSS.escape(path)}"] .trigger`); if(t) t.focus();
    return;
  }
  /* calendar */
  const nav = e.target.closest(".calnav");
  if(nav){ const dp = nav.closest(".dp"); let [y,m] = dp.dataset.view.split("-").map(Number); m += +nav.dataset.step;
    if(m<1){m=12;y--} if(m>12){m=1;y++} dp.dataset.view = `${y}-${String(m).padStart(2,"0")}`;
    dp.querySelector(".menu").innerHTML = calendarHTML(dp.dataset.view, get(dp.dataset.path)); return; }
  const day = e.target.closest(".dp [data-date], .dp [data-dclear]");
  if(day){ const dp = day.closest(".dp"), path = dp.dataset.path;
    set(path, day.dataset.dclear ? "" : day.dataset.date); closeAll(); changed(path);
    const id = dp.closest("[data-sec]")?.dataset.sec; if(id) renderSection(id);
    document.querySelector(`.dp[data-path="${CSS.escape(path)}"] .trigger`)?.focus(); return; }

  /* clear */
  const clr = e.target.closest("[data-clear]");
  if(clr){ const p = clr.dataset.clear; set(p, clr.dataset.multi ? [] : ""); changed(p);
    const id = clr.closest("[data-sec]")?.dataset.sec; if(id) renderSection(id); return; }

  /* add option (+) */
  const add = e.target.closest("[data-addopt]");
  if(add && !add.disabled){
    const path = add.dataset.addopt, src = add.dataset.src, multi = !!add.dataset.multi;
    popup({kind:"ask", title:"Add a new option", msg:"It will be added to this list and selected.", input:"Type the new option", primary:"Add", secondary:"Cancel",
      onPrimary: v => { OPT[src] = OPT[src] || []; if(!listOf(src).some(o=>optVal(o).toLowerCase()===v.toLowerCase())){ OPT[src].push(v); HOOKS.onAddOption && HOOKS.onAddOption(src, v); }
        const existing = listOf(src).map(optVal).find(x=>x.toLowerCase()===v.toLowerCase()) || v;
        set(path, multi ? [...new Set([...(get(path)||[]), existing])] : existing);
        changed(path); const id = secOfPath(path); if(id) renderSection(id); toast(`“${existing}” added`); }});
    return;
  }
  /* page actions */
  const act = e.target.closest("[data-action]");
  if(act && !act.disabled && ACTIONS[act.dataset.action]){ ACTIONS[act.dataset.action](act, e); return; }

  if(!e.target.closest(".dd,.dp,.search")) closeAll();
});

/* readable error text from Supabase / PostgREST errors */
function errText(e){
  if(!e) return "Unknown error";
  const m = e.message || String(e);
  if(/schema must be one of/i.test(m) || e.code==="PGRST106") return "The smartuna schema isn’t exposed to the API. In Supabase: Settings → API → Exposed schemas, add “smartuna”.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Can’t reach Supabase. Check the project URL and your internet connection.";
  if(/Invalid API key|No API key/i.test(m)) return "The publishable key was rejected. Check the key for this project.";
  if(/permission denied/i.test(m)) return "Permission denied by the database. Make sure you are signed in and the smartuna grants were applied.";
  return m.replace(/^DUPLICATE:/,"Duplicate of ");
}
async function q(promise){ const {data, error} = await promise; if(error) throw error; return data; }

async function fetchAll(build, size=1000){
  let out = [], from = 0;
  for(;;){ const rows = await q(build().range(from, from+size-1)); out = out.concat(rows); if(rows.length < size) return out; from += size; }
}

function tsPanel(g, active){
  const cfg = TS[g], cap = tsCap(g), legs = legsOf(g), full = tsFull(g), list = get(cfg.path);
  const fields = list.map((v,i)=>{
    const head = i===0 ? cfg.label : `${cfg.label} ${i+1} <button class="xbtn" type="button" data-action="rmTs" data-grp="${g}" data-i="${i}" aria-label="Remove"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
    const ctl = g==="sea" ? dropdown(`${cfg.path}.${i}`,"ports", i===0?"Search ports":"Search the next port",{disabled:!active})
                          : textIn(`${cfg.path}.${i}`, cfg.ph, {disabled:!active});
    return field(head, ctl, {dim:!active, req:active && i===0, path:`${cfg.path}.${i}`, disabled:!active});
  }).join(arrow);
  return `<div class="panel ${active?"":"off"}"><div class="ts-head"><h3>Transhipment info</h3>
    <p class="ts-note">${active ? `${cfg.note} ${legs} ${cfg.noun} leg${legs>1?"s":""} allow${legs===1?"s":""} up to ${cap} handover${cap>1?"s":""}.` : "To be filled later. Switch ship mode to Transhipment to enable."}</p></div>
    <div class="ts-body"><div class="chain">${fields}${arrow}
      <button class="linkbtn" type="button" data-action="addTs" data-grp="${g}" ${active&&!full?"":"disabled"} title="${full?`Add another ${cfg.noun} first: a handover needs a leg on each side.`:""}">${cfg.add}</button></div></div></div>`;
}
function lgReq(){
  const L = S.lg;
  const optionalLoad = L.mode==="Sea" && L.loadBasis==="LCL";
  const r = [!!L.mode, !!L.loadBasis, optionalLoad || !!L.loadType, !!L.incoterm];
  if(L.mode==="Sea"){ const s = L.sea; r.push(!!s.shippingLine, !!s.vessels[s.vessels.length-1].trim(), !!s.shipMode, !!s.container.containerNo.trim(), !!s.container.sealNo.trim(), !!s.blNo.trim(), !!s.blDate); if(s.shipMode==="Transhipment") r.push(!!s.transhipmentPorts[0]); }
  if(L.mode==="Air"){ const a = L.air; r.push(!!a.airline, !!a.flights[0].trim(), !!a.shipMode, !!a.awbNo.trim(), !!a.awbDate); if(a.shipMode==="Transhipment") r.push(!!a.transhipmentAirports[0].trim()); }
  if(L.mode==="Truck"){ const t = L.truck; r.push(!!t.trucks[0].trim(), !!t.shipMode); if(t.shipMode==="Transhipment") r.push(!!t.transfers[0].trim()); }
  return r;
}

/* ---------- hooks ---------- */
function recalcDue(){
  const days = PAY_DAYS[S.pay.term];
  if(!S.com.dueManual && S.com.invDate && days!=null) S.com.due = addDays(S.com.invDate, days);
}
HOOKS.onChange = path => {
  const pm = path.match(/^parties\.(who|to)\.party$/);
  if(pm){ fillPartyGln(S.parties[pm[1]]); renderSection("parties", true); }
  if(path==="lg.mode"){
    const L = S.lg, cfg = LOAD[L.mode];
    L.loadBasis = cfg ? cfg.basis[0] : ""; L.loadType = "";
    const ok = incotermsFor(L.mode).some(t=>t.value===L.incoterm);
    incotermNote = (L.incoterm && !ok) ? `${L.incoterm} applies to sea freight only, so it was cleared for ${L.mode}.` : "";
    if(!ok) L.incoterm = "";
  }
  if(path==="lg.incoterm") incotermNote = "";
  if(path==="com.invDate" || path==="pay.term"){ recalcDue(); renderSection("com", true); }
  if(path==="com.due") S.com.dueManual = !!S.com.due;
  if(path.startsWith("dep.")){ renderSection("arr", true); }
  if(path.startsWith("arr.")){ renderSection("dest", true); }
  if(path==="lg.mode") scheduleMixed();
};
HOOKS.onInput = path => {
  if(path==="lg.sea.container.containerNo" || path==="lg.sea.container.sealNo" || path==="details.custOrder") scheduleMixed();
  if(path.startsWith("lg.sea.container") && S.lg.sea.traceableObject && !isLinked()){ S.lg.sea.traceableObject = null; rerenderKeepFocus(path); }
  if(path.startsWith("lines.")) {}
};
HOOKS.onStatus = () => { const h = $("#headSub"); if(h && ORDER) h.innerHTML = `<b>${esc(S.ref)}</b> · ${esc(ORDER.product?.name||"")} · ${fmtN(thisQty())} of ${fmtN(orderQty())} ${esc(UNIT)}`; };

/* ---------- actions ---------- */
Object.assign(ACTIONS, {
  setBasis(el){ S.lg.loadBasis = el.dataset.basis; const list = LOAD[S.lg.mode].types[S.lg.loadBasis].map(optVal); if(!list.includes(S.lg.loadType)) S.lg.loadType = ""; renderSection("logistics"); },
  addLeg(el){ const g = el.dataset.grp, key = {sea:"vessels",air:"flights",truck:"trucks"}[g];
    S.lg[g][key].push(""); S.lg[g].shipMode = S.lg[g][key].length>1 ? "Transhipment" : "Direct"; renderSection("logistics");
    const inputs = $$(`[data-bind^="lg.${g}.${key}."]`); inputs[inputs.length-1]?.focus(); },
  rmLeg(el){ const g = el.dataset.grp, key = {sea:"vessels",air:"flights",truck:"trucks"}[g];
    S.lg[g][key].splice(+el.dataset.i,1); S.lg[g].shipMode = S.lg[g][key].length>1 ? "Transhipment" : "Direct";
    const arr = get(TS[g].path), cap = tsCap(g); if(arr.length>cap) set(TS[g].path, arr.slice(0,cap)); renderSection("logistics"); },
  addTs(el){ const g = el.dataset.grp; if(tsFull(g)) return; get(TS[g].path).push(""); renderSection("logistics"); },
  rmTs(el){ get(TS[el.dataset.grp].path).splice(+el.dataset.i,1); renderSection("logistics"); },
  addTraceable(){
    const c = S.lg.sea.container, cn = c.containerNo.trim(), sn = c.sealNo.trim();
    if(!cn || !sn){ popup({ok:false, title:"Container and seal needed", msg:`Enter ${!cn&&!sn ? "a container number and seal number" : !cn ? "a container number" : "a seal number"} before linking to the traceable object.`});
      $(`[data-bind="lg.sea.container.${cn?"sealNo":"containerNo"}"]`)?.focus(); return; }
    S.lg.sea.traceableObject = {containerNo:cn, sealNo:sn, linkedAt:new Date().toISOString()};
    popup({title:"Added to Traceable Object", msg:`Container <span class="obj">${esc(cn)}</span> with seal <span class="obj">${esc(sn)}</span> is now linked.`});
    renderSection("logistics");
  },
  addLine(){ S.lines.push({product:PRODUCT_LABEL, qty:"", rawId:"", batch:"", prodDate:"", bestBefore:"", net:"", netUnit:"kg"}); renderSection("lines");
    const q = $$('[data-bind^="lines."][data-bind$=".qty"]'); q[q.length-1]?.focus(); },
  rmLine(el){ S.lines.splice(+el.dataset.i,1); renderSection("lines"); },
  changeSource(){ location.href = `order.html?order=${encodeURIComponent(OREF)}`; },
  async save(){
    SHOW_ERR = true; renderAll();
    const bad = firstIncomplete();
    if(bad.length){ popup({ok:false, title:"Some required fields are missing", msg:"Finish these sections to save the shipment:", list:bad.map(s=>({id:s.id, title:s.title, note: s.id==="lines" && remaining()<0 ? "over quantity" : "incomplete"})), primary:"Got it"}); return; }
    const btns = $$('[data-action="save"]'); btns.forEach(b=>{ b.disabled = true; });
    try{
      const wasNew = !S.id;
      const res = await q(smt().rpc("save_shipment", {p: toPayload()}));
      EXISTING = await q(smt().rpc("get_shipment", {p_id: res.id}));
      S = fromShipment(EXISTING); SHOW_ERR = false;
      if(wasNew) history.replaceState(null, "", `shipment.html?order=${OREF}&id=${res.id}`);
      OTHERS = await q(smt().from("v_shipment_list").select("id,quantity").eq("master_id", ORDER.id));
      await refreshMixed(); renderAll(); setHead();
      const back = `order.html?order=${encodeURIComponent(OREF)}#shipments`;
      popup({title:`Shipment ${res.reference} saved`, msg:`Linked to master order <span class="obj">${esc(ORDER.master_no)}</span>. ${fmtN(thisQty())} ${esc(UNIT)} allocated, ${fmtN(remaining())} left on the order.${MIXED.length?`<br>Mixed with ${MIXED.map(m=>esc(m.ref)).join(", ")}.`:""}`,
        primary:"Back to master order", onPrimary:()=>{ location.href = back; },
        secondary:"Add another shipment", onSecondary:()=>{ location.href = `shipment.html?order=${encodeURIComponent(OREF)}`; }});
    }catch(err){
      const m = String(err.message||"");
      if(m.startsWith("DUPLICATE:")) popup({ok:false, title:"Shipment already exists", msg:`<span class="obj">${esc(m.slice(10))}</span> on this master already has customer order ${esc(S.details.custOrder)}, container ${esc(S.lg.sea.container.containerNo)} and seal ${esc(S.lg.sea.container.sealNo)}.`});
      else popup({ok:false, title:"Couldn’t save", msg:esc(errText(err))});
    } finally { btns.forEach(b=>{ b.disabled = false; }); }
  }
});

/* ---------- header + mount ---------- */
function setHead(){
  $("#pageTitle").textContent = S.id ? "Edit shipment" : "Create shipment";
  document.title = S.id ? `${S.ref} · Shipment` : "Create Shipment";
  $("#crumbOrder").textContent = ORDER.master_no; $("#crumbOrder").href = `order.html?order=${encodeURIComponent(OREF)}`;
  $("#crumbHere").textContent = S.id ? S.ref : "Create shipment";
  const b = $("#importBadge"); if(b) b.hidden = EXISTING?.source!=="import";
}
boot(async ()=>{
  const ref = +params.get("order");
  ORDER = ref ? await q(smt().rpc("get_master", {p_ref: ref})) : null;
  if(!ORDER){ location.replace("orders.html"); return; }
  OREF = ORDER.ref_id; PRODUCT_LABEL = productLabel(ORDER.product); UNIT = ORDER.quantity_unit || "units";
  OPT.orderProducts = [PRODUCT_LABEL];
  if(params.get("id")){
    EXISTING = await q(smt().rpc("get_shipment", {p_id: params.get("id")}));
    if(!EXISTING){ popup({ok:false, title:"Shipment not found", msg:"It may have been deleted.", primary:"Back to master order", onPrimary:()=>location.href=`order.html?order=${OREF}#shipments`}); }
  }
  S = EXISTING ? fromShipment(EXISTING) : buildDefault();
  rememberPrefill();
  OTHERS = await q(smt().from("v_shipment_list").select("id,quantity").eq("master_id", ORDER.id));
  MIXED = EXISTING ? (EXISTING.mixed_with||[]).map(m=>({id:m.id, ref:m.reference, orderRef:m.master_ref_id, orderNo:m.master_no, product:m.product})) : [];
  if(!EXISTING) await refreshMixed();
  $("#pageTitle").insertAdjacentHTML("afterend", ` <span class="src-badge" id="importBadge" style="background:var(--ok-bg);color:var(--ok-text)" hidden>imported from Excel</span>`);
  setHead(); mount();
});

</script>
</body>
