<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries — Project Manhattan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="brand-logo.png" />
  <link rel="stylesheet" href="country.css" />
  <style>
    .cn-nav-wrap{display:flex;align-items:center;padding:14px 28px;gap:20px;background:#f0f2f7;position:sticky;top:0;z-index:100;}
    .cn-nav-brand{text-decoration:none;flex-shrink:0;line-height:1.1;}
    .cn-nav-brand span:first-child{display:block;font-size:8px;font-weight:700;letter-spacing:2px;color:#9aa0b4;}
    .cn-nav-brand span:last-child{display:block;font-size:16px;font-weight:800;color:#1a1a2e;}
    .cn-nav-pill{display:inline-flex;align-items:center;gap:2px;background:#fff;border-radius:999px;padding:5px 7px;box-shadow:0 1px 6px rgba(0,0,0,0.07);}
    .cn-nav-item{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13px;color:#6b7280;text-decoration:none;font-family:"Poppins","DM Sans",sans-serif;cursor:pointer;}
    .cn-nav-item:hover,.cn-nav-item.active{background:#f0f2f7;color:#1a1a2e;}
    .cn-nav-item.active{font-weight:600;}
    .cn-nav-item img{width:15px;height:15px;object-fit:contain;opacity:0.5;}
    .cn-nav-item.active img{opacity:1;}
    .cn-nav-item-wrap{position:relative;}
    .cn-nav-item-wrap::after{content:"";position:absolute;top:100%;left:0;width:100%;height:12px;background:transparent;}
    .cn-nav-item-wrap:hover .cn-nav-dd{display:block;}
    .cn-nav-dd{display:none;position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid #e8eaf0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.10);min-width:160px;padding:6px;z-index:500;}
    .cn-nav-dd a{display:block;padding:8px 12px;font-size:13px;color:#4a4e69;text-decoration:none;border-radius:8px;font-weight:500;}
    .cn-nav-dd a:hover{background:#f0f2f7;color:#1a6fdb;}
    .cn-nav-dd a.active{color:#1a6fdb;font-weight:700;}
    .cn-avatar-btn{width:36px;height:36px;border-radius:50%;background:#1a6fdb;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 1px 4px rgba(0,0,0,0.12);flex-shrink:0;border:none;}
    .cn-avatar-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid #e8eaf0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.10);min-width:176px;overflow:hidden;z-index:999;}
    .cn-avatar-menu.open{display:block;}
    .cn-avatar-menu-name{padding:11px 15px 7px;font-size:12px;font-weight:700;color:#1a1a2e;border-bottom:1px solid #e8eaf0;}
    .cn-avatar-menu a{display:flex;align-items:center;gap:8px;padding:9px 15px;font-size:13px;color:#4a4e69;text-decoration:none;font-weight:500;}
    .cn-avatar-menu a:hover{background:#f0f2f7;color:#1a6fdb;}
    .cn-avatar-menu button{width:100%;padding:9px 15px;background:none;border:none;border-top:1px solid #e8eaf0;text-align:left;font-family:"Poppins","DM Sans",sans-serif;font-size:13px;color:#e63946;cursor:pointer;}
    .cn-avatar-menu button:hover{background:#fff0f1;}
  
    /* ── Premium country list overrides ── */
    .page-wrapper { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .page-title { font-size:22px; font-weight:800; color:#1a1a2e; }
    .page-subtitle { font-size:13px; color:#9aa0b4; margin-left:10px; }
    .country-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; margin-top:8px; }
    .country-card { background:#fff; border-radius:12px; padding:14px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; border:1.5px solid #f0f2f8; transition:all 0.2s; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
    .country-card:hover { border-color:#1a6fdb; box-shadow:0 4px 16px rgba(26,111,219,0.12); transform:translateY(-2px); }
    .country-card-flag img { width:52px; height:auto; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.12); }
    .country-card-name { font-size:12px; font-weight:700; color:#1a1a2e; text-align:center; line-height:1.3; }
    .country-card-codes { display:flex; align-items:center; gap:4px; flex-wrap:wrap; justify-content:center; }
    .code-chip.small { font-size:10px; padding:2px 6px; background:#f4f6fb; color:#6b7280; border-radius:4px; font-weight:600; }
    .continent-tag { font-size:10px; color:#9aa0b4; }
    .continent-btn { padding:6px 14px; border-radius:999px; border:1.5px solid #e8eaf0; background:#fff; font-size:12px; font-weight:600; color:#6b7280; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all 0.15s; }
    .continent-btn:hover { border-color:#1a6fdb; color:#1a6fdb; }
    .continent-btn.active { background:#1a6fdb; border-color:#1a6fdb; color:#fff; }
    .continent-count { font-size:10px; opacity:0.7; }
    #continentBar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
    .search-wrapper { display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid #e8eaf0; border-radius:10px; padding:9px 14px; min-width:200px; }
    .search-wrapper input { border:none; outline:none; font-family:inherit; font-size:13px; color:#1a1a2e; background:transparent; width:100%; }
    .search-wrapper svg { flex-shrink:0; color:#c0c4d0; }
    .filter-btn { display:flex; align-items:center; gap:6px; padding:9px 14px; background:#fff; border:1.5px solid #e8eaf0; border-radius:10px; font-family:inherit; font-size:13px; font-weight:600; color:#4a4e69; cursor:pointer; }
    .filter-btn:hover { border-color:#9aa0b4; }
    .filter-menu { position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid #e8eaf0; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.10); padding:12px; min-width:200px; z-index:100; }
    .filter-wrap { position:relative; }
    .filter-count { background:#e63946; color:#fff; border-radius:999px; padding:1px 6px; font-size:10px; font-weight:700; }
    .filter-option { display:flex; align-items:center; gap:8px; font-size:13px; color:#4a4e69; cursor:pointer; padding:4px 0; }
    .loading-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; color:#9aa0b4; gap:12px; }
    .spinner { width:32px; height:32px; border:3px solid #e8eaf0; border-top-color:#1a6fdb; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .empty-state { text-align:center; padding:48px; color:#9aa0b4; }
  </style>
</head>
<body>

<!-- NAV -->
<div class="cn-nav-wrap">
  <a href="home-logged-in.html" class="cn-nav-brand">
    <span>PROJECT</span><span>Manhattan.</span>
  </a>
  <div style="flex:1;display:flex;justify-content:center;">
    <div class="cn-nav-pill">
      <a href="home-logged-in.html" class="cn-nav-item"><img src="home.png"/> Home</a>
      <div class="cn-nav-item-wrap">
        <div class="cn-nav-item"><img src="my-studio.png"/> My Studio</div>
        <div class="cn-nav-dd">
          <a href="product-list.html">Product</a>
          <a href="organisation.html">Your Company</a>
        </div>
      </div>
      <div class="cn-nav-item-wrap">
        <div class="cn-nav-item active"><img src="atlas.png" style="opacity:1;"/> Atlas</div>
        <div class="cn-nav-dd">
          <a href="Species.html">Species</a>
          <a href="country.html" class="active">Country</a>
          <a href="port-list.html">Ports</a>
          <a href="cold-storage-list.html">Cold Storage</a>
          <a href="vessel-list.html">Vessels</a>
        </div>
      </div>
      <a href="#" class="cn-nav-item"><img src="features.png"/> Features</a>
      <a href="#" class="cn-nav-item"><img src="messages.png"/> Messages</a>
      <a href="#" class="cn-nav-item"><img src="report.png"/> Reports</a>
      <a href="report.html" class="cn-nav-item"><img src="support.png"/> Support</a>
    </div>
  </div>
  <div style="position:relative;flex-shrink:0;">
    <button class="cn-avatar-btn" id="cnAvatarBtn" onclick="toggleCnAvatar()">
      <span id="cnAvatarInitials">?</span>
    </button>
    <div class="cn-avatar-menu" id="cnAvatarMenu">
      <div class="cn-avatar-menu-name" id="cnAvatarGreeting">Hello!</div>
      <a href="profile.html"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg> Profile</a>
      <button onclick="handleLogout()">Logout</button>
    </div>
  </div>
</div>

  <!-- PAGE CONTENT (unchanged) -->
  <div class="page-wrapper">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Countries</h1>
        <span class="page-subtitle" id="countryCount">249 countries</span>
      </div>
      <div class="page-header-right">
        <div class="search-wrapper">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search countries..." oninput="filterCountries(this.value)" />
        </div>
        <div class="filter-wrap">
          <button class="filter-btn" id="filterBtn" onclick="toggleFilterMenu()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filter
            <span class="filter-count hidden" id="filterCount"></span>
          </button>
          <div class="filter-menu hidden" id="filterMenu">
            <div class="filter-menu-title">Groupings</div>
            <label class="filter-option">
              <input type="checkbox" id="filterEU" onchange="setEUFilter(this.checked)" />
              <span>European Union <small>(EU-27)</small></span>
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading countries...</p>
    </div>
    <div class="country-grid hidden" id="countryGrid"></div>
    <div class="empty-state hidden" id="emptyState">
      <p>No countries found matching your search.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="utils.js"></script>
  <script>
  (function(){
    const SURL='https://enbdaajcromxmhgcverp.supabase.co';
    const SKEY='sb_publishable_NxQj3wE3UqijQVwwUNCfxg_f2uFLRz5';
    window.addEventListener('load', async () => {
      const db=window._sharedSupabase||(window._sharedSupabase=supabase.createClient(SURL,SKEY));
      const {data:{session}}=await db.auth.getSession();
      if(!session)return;
      const {data:p}=await db.from('profiles').select('first_name,last_name,avatar_color,photo_url').eq('id',session.user.id).single();
      const firstName=p?.first_name||session.user.email.split('@')[0];
      const lastName=p?.last_name||'';
      const initials=(firstName.charAt(0)+(lastName?lastName.charAt(0):'')).toUpperCase();
      if(p?.photo_url){
        document.getElementById('cnAvatarBtn').innerHTML=`<img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>`;
      } else {
        document.getElementById('cnAvatarBtn').style.background=p?.avatar_color||'#1a6fdb';
        document.getElementById('cnAvatarInitials').textContent=initials;
      }
      document.getElementById('cnAvatarGreeting').textContent=`Hello, ${firstName}!`;
    });
    window.toggleCnAvatar=function(){document.getElementById('cnAvatarMenu').classList.toggle('open');};
    document.addEventListener('click',e=>{
      if(!e.target.closest('#cnAvatarBtn')&&!e.target.closest('#cnAvatarMenu'))
        document.getElementById('cnAvatarMenu')?.classList.remove('open');
    });
  })();

  // Stub old nav refs for country.js
  document.getElementById=(function(orig){
    return function(id){
      const stubs=['navAvatar','navEmail','navFirstName','navDropdown'];
      if(stubs.includes(id)) return {textContent:'',innerHTML:'',style:{},classList:{toggle:()=>{},remove:()=>{},add:()=>{}}};
      return orig.call(document,id);
    };
  })(document.getElementById);
  function toggleNavDropdown(){}
  function setNavAvatar(){}
  </script>
  <script src="country.js"></script>
</body>
</html>
