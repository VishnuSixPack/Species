<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries — Project Manhattan</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="brand-logo.png" />
  <link rel="stylesheet" href="country.css" />
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-brand">
      <span class="nav-project">PROJECT</span>
      <span class="nav-manhattan">Manhattan.</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li class="nav-dropdown">
        <a href="#">Module ▾</a>
        <ul class="nav-dropdown-menu">
          <li><a href="Species.html">Species</a></li>
          <li><a href="product-list.html">Products</a></li>
          <li><a href="organisation.html">Organisation</a></li>
          <li><a href="country.html" class="active">Country</a></li>
        </ul>
      </li>
      <li><a href="#">Reports</a></li>
      <li class="nav-dropdown">
        <a href="#">Support ▾</a>
        <ul class="nav-dropdown-menu">
          <li><a href="#">Contact</a></li>
          <li><a href="#">Report an Issue</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </li>
    </ul>
    <div class="nav-right">
      <div class="nav-profile" id="navProfile" onclick="toggleNavDropdown()">
        <div class="nav-avatar" id="navAvatar"></div>
        <span class="nav-email" id="navEmail"></span>
        <div class="nav-profile-dropdown hidden" id="navDropdown">
          <div class="nav-profile-name" id="navFirstName">Hello!</div>
          <a href="profile.html" class="nav-dropdown-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            Profile
          </a>
          <button onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-wrapper">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Countries</h1>
        <span class="page-subtitle" id="countryCount">249 countries</span>
      </div>
      <div class="page-header-right">
        <div class="search-wrapper">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search countries..." oninput="filterCountries(this.value)" />
        </div>
      </div>
    </div>

    <!-- LOADING -->
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading countries...</p>
    </div>

    <!-- COUNTRY GRID -->
    <div class="country-grid hidden" id="countryGrid"></div>

    <!-- EMPTY STATE -->
    <div class="empty-state hidden" id="emptyState">
      <p>No countries found matching your search.</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="utils.js"></script>
  <script src="country.js"></script>
</body>
</html>
