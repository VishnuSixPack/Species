  <link rel="icon" type="image/png" href="brand-logo.png" />
  <link rel="stylesheet" href="country.css" />
</head>

  <!-- NAV -->
  <div class="topbar">
    <a href="home-logged-in.html" class="topbar-brand">
      <div>
        <span class="topbar-brand-project">PROJECT</span>
        <span class="topbar-brand-name">Manhattan.</span>
      </div>
    </a>
    <div class="topbar-nav">
      <div class="nav-pill">
        <a href="home-logged-in.html" class="nav-pill-item">Home</a>
        <div class="nav-item-wrap">
          <div class="nav-pill-item">My Studio</div>
          <div class="nav-dropdown">
            <a href="product-list.html">Products</a>
            <a href="organisation.html">Your Company</a>
          </div>
        </div>
        <div class="nav-item-wrap">
          <div class="nav-pill-item active">Atlas</div>
          <div class="nav-dropdown">
            <a href="Species.html">Species</a>
            <a href="country.html">Country</a>
            <a href="#">Ports</a>
            <a href="#">Vessels</a>
          </div>
        </div>
        <a href="#" class="nav-pill-item">Reports</a>
        <div class="nav-item-wrap">
          <div class="nav-pill-item">Support</div>
          <div class="nav-dropdown">
            <a href="contact.html">Contact</a>
            <a href="report.html">Report an Issue</a>
            <a href="about.html">About</a>
          </div>
        </div>
      </div>
    </div>
    <div class="topbar-right" onclick="toggleNavDropdown()" style="cursor:pointer;">
      <div class="topbar-avatar" id="navAvatar"></div>
      <span class="topbar-email" id="navEmail"></span>
      <div class="topbar-settings" id="topbarSettings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <div class="topbar-profile-dropdown" id="navDropdown">
          <div class="topbar-profile-name" id="navFirstName">Hello!</div>
          <a href="profile.html">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            Profile
          </a>
          <button onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>
  <!-- PAGE HEADER -->
  <div class="page-wrapper">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Countries</h1>
        <span class="page-subtitle" id="countryCount">249 countries</span>
      </div>
      <div class="page-header-right">
        <div class="search-wrapper">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search countries..." oninput="filterCountries(this.value)" />
        </div>
        <div class="filter-wrap">
          <button class="filter-btn" id="filterBtn" onclick="toggleFilterMenu()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filter
            <span class="filter-count hidden" id="filterCount"></span>
          </button>
          <div class="filter-menu hidden" id="filterMenu">
            <div class="filter-menu-title">Groupings</div>
            <label class="filter-option">
              <input type="checkbox" id="filterEU" onchange="setEUFilter(this.checked)" />
              <span>European Union <small>(EU-27)</small></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- LOADING -->
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading countries...</p>
    </div>

    <!-- COUNTRY GRID -->
    <div class="country-grid hidden" id="countryGrid"></div>

    <!-- EMPTY STATE -->
    <div class="empty-state hidden" id="emptyState">
      <p>No countries found matching your search.</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="utils.js"></script>
  <script src="country.js"></script>   
</body>
</html>
