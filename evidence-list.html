<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="sc-blue-logo.png"/>
<title>Evidence — SmarTuna</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="theme.css"/>
<script src="theme.js"></script>
<style>
  @font-face{font-family:'Bitsumis';src:url('BITSUMIS.TTF') format('truetype');font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Poppins','DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .sc-wm{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .sc-wm-top{font-family:'Bitsumis',sans-serif!important;font-weight:900!important;font-size:16px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--wm-top);}
  .sc-wm-sub{font-family:'Bitsumis',sans-serif!important;font-weight:700!important;font-size:7px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--wm-sub);margin-top:2px;}
  .topbar-brand{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 30px;
          background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:400;}
  .nav{display:flex;gap:2px;}
  .nav-item{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);text-decoration:none;}
  .nav-item.active{background:var(--bg);color:var(--text);font-weight:600;}
  .avatar-wrap{position:relative;}
  .avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;
    font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
  .avatar-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);min-width:186px;overflow:hidden;z-index:999;}
  .avatar-menu.open{display:block;}
  .avatar-menu-name{padding:11px 15px 7px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);}
  .avatar-menu a,.avatar-menu button{display:block;padding:9px 15px;font-size:13px;color:var(--menu-text);
    text-decoration:none;font-weight:500;width:100%;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left;}
  .avatar-menu a:hover,.avatar-menu button:hover{background:var(--bg);color:var(--primary);}

  .wrap{max-width:1400px;margin:0 auto;padding:20px 30px 70px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .h1-sub{font-size:13px;color:var(--muted);margin-top:4px;}
  .btn{padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
       border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);color:#fff;}
  .btn-sm{padding:7px 13px;font-size:11.5px;}

  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .search{flex:1;min-width:200px;max-width:380px;height:40px;padding:0 14px;border:1.5px solid var(--border);
          border-radius:10px;font:inherit;font-size:13px;color:var(--text);background:var(--surface);outline:none;}
  .search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,111,219,.1);}
  .search::placeholder{color:var(--dim);}
  .seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:none;background:none;font:inherit;font-size:12px;font-weight:600;padding:7px 14px;
              border-radius:8px;cursor:pointer;color:var(--muted);}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}
  .count{font-size:12px;color:var(--muted);margin-left:auto;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;
        cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .card:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(26,111,219,.08);}
  .card-ref{font-size:15px;font-weight:700;margin-bottom:4px;}
  .card-meta{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .card-stats{display:flex;gap:16px;flex-wrap:wrap;}
  .stat{display:flex;align-items:center;gap:6px;font-size:12px;}
  .stat-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-ic svg{width:14px;height:14px;}
  .stat-ic.docs{background:var(--primary-soft);color:var(--primary);}
  .stat-ic.ocr{background:var(--good-bg);color:var(--good-fg);}
  .stat-ic.link{background:var(--info-bg);color:var(--info-fg);}
  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:10.5px;font-weight:600;}
  .st-open{background:var(--warn-bg);color:var(--warn-fg);}
  .st-linked{background:var(--good-bg);color:var(--good-fg);}
  .st-archived{background:var(--bg);color:var(--muted);}
  .types{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;}
  .chip{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:600;
        background:var(--bg);color:var(--muted);}

  .empty{padding:60px 30px;text-align:center;color:var(--muted);}
  .empty svg{width:52px;height:52px;color:var(--dim);margin-bottom:16px;}
  .empty-t{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text);}
  .empty-d{font-size:13px;line-height:1.6;max-width:440px;margin:0 auto;}

  /* Create modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:900;display:none;
            align-items:center;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;
         max-width:480px;width:90%;box-shadow:var(--shadow-2);}
  .modal h3{font-size:16px;font-weight:700;margin-bottom:16px;}
  .modal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;margin-top:14px;}
  .modal input{width:100%;height:40px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;
               font:inherit;font-size:13px;color:var(--text);background:var(--surface);outline:none;}
  .modal input:focus{border-color:var(--primary);}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
         padding:11px 22px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;opacity:0;
         transition:opacity .25s;pointer-events:none;}
  .toast.vis{opacity:1;}

  @media(max-width:760px){ .nav{display:none;} .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="topbar">
  <a href="home-logged-in.html" class="topbar-brand">
    <img src="sc-blue-logo.png" data-dark-src="sc-white-logo.png" alt="SmarTuna" style="width:28px;height:28px;object-fit:contain;"/>
    <span class="sc-wm"><span class="sc-wm-top">SmarTuna</span><span class="sc-wm-sub">concept</span></span>
  </a>
  <div class="nav">
    <a href="home-logged-in.html" class="nav-item">Home</a>
    <a href="shipment-list.html" class="nav-item active">My Studio</a>
    <a href="Species.html" class="nav-item">Atlas</a>
  </div>
  <div class="avatar-wrap">
    <div class="avatar-btn" id="avatarBtn" onclick="toggleAvatarMenu()"><span id="avatarInitials">··</span></div>
    <div class="avatar-menu" id="avatarMenu">
      <div class="avatar-menu-name" id="avatarGreeting">Hello!</div>
      <a href="profile.html">Profile</a><a href="organisation.html">Your Company</a>
      <button onclick="handleLogout()">Logout</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <div>
      <div class="h1">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Evidence
      </div>
      <div class="h1-sub">Document buckets — upload evidence before or after creating a shipment</div>
    </div>
    <button class="btn btn-primary" onclick="openCreate()">+ New Bucket</button>
  </div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="Search by PO, invoice or reference…" oninput="renderList()"/>
    <div class="seg" id="statusSeg"></div>
    <div class="count" id="countLine"></div>
  </div>

  <div class="grid" id="host"></div>
</div>

<!-- Create bucket modal -->
<div class="modal-bg" id="createModal" onclick="if(event.target===this)closeCreate()">
  <div class="modal">
    <h3>New Evidence Bucket</h3>
    <label>Purchase Order No *</label>
    <input id="newPO" placeholder="e.g. PO-VDB-2026-118"/>
    <label>Invoice No (optional)</label>
    <input id="newInv" placeholder="e.g. INV-2026-0482"/>
    <label>Notes (optional)</label>
    <input id="newNotes" placeholder="What's this consignment?"/>
    <div class="foot">
      <button class="btn" onclick="closeCreate()">Cancel</button>
      <button class="btn btn-primary" onclick="doCreate()">Create Bucket</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://enbdaajcromxmhgcverp.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuYmRhYWpjcm9teG1oZ2N2ZXJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjc4MTUsImV4cCI6MjA5MzcwMzgxNX0.wlVbN57eAwRmTROEEY3D6BIX3H5pI6MwZ5hM2BqpnEs';
const dbClient=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toggleAvatarMenu(){ $('avatarMenu').classList.toggle('open'); }
document.addEventListener('click',e=>{const w=document.querySelector('.avatar-wrap');
  if(w&&!w.contains(e.target)) $('avatarMenu')?.classList.remove('open');});
function greetingTime(){const h=new Date().getHours();return h<12?'Good Morning':(h<18?'Good Afternoon':'Good Evening');}
async function handleLogout(){ if(dbClient) await dbClient.auth.signOut(); location.href='index.html'; }
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('vis');setTimeout(()=>t.classList.remove('vis'),2800);}
function fmtDate(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function timeAgo(v){ if(!v) return '';
  const ms=Date.now()-new Date(v).getTime();
  const m=Math.floor(ms/60000),h=Math.floor(ms/3600000),d=Math.floor(ms/86400000);
  if(m<1) return 'just now'; if(m<60) return m+'m ago'; if(h<24) return h+'h ago';
  if(d<30) return d+'d ago'; return fmtDate(v);
}

let BUCKETS=[], FILTER='All', ORG_ID=null;

function openCreate(){ $('createModal').classList.add('open'); $('newPO').focus(); }
function closeCreate(){ $('createModal').classList.remove('open'); }

async function doCreate(){
  const po=$('newPO').value.trim();
  if(!po){ toast('Purchase Order number is required'); return; }
  if(!dbClient||!ORG_ID){ toast('Not connected'); return; }
  try{
    const ref=po;
    const {data,error}=await dbClient.from('evidence_buckets').insert({
      organisation_id:ORG_ID, bucket_ref:ref,
      purchase_order_no:po, invoice_no:$('newInv').value.trim()||null,
      notes:$('newNotes').value.trim()||null
    }).select('id').single();
    if(error) throw error;
    closeCreate();
    toast('Bucket created');
    location.href='evidence-detail.html?id='+data.id;
  }catch(e){
    toast('Failed: '+(e.message||e));
  }
}

function renderStatusSeg(){
  const counts={All:BUCKETS.length, Open:0, Linked:0, Archived:0};
  BUCKETS.forEach(b=>{ if(counts[b.status]!==undefined) counts[b.status]++; });
  $('statusSeg').innerHTML=['All','Open','Linked','Archived'].map(s=>
    `<button class="${FILTER===s?'on':''}" onclick="FILTER='${s}';renderList();">${s} (${counts[s]})</button>`).join('');
}

function renderList(){
  renderStatusSeg();
  const q=($('search').value||'').toLowerCase();
  let list=BUCKETS;
  if(FILTER!=='All') list=list.filter(b=>b.status===FILTER);
  if(q) list=list.filter(b=>[b.bucket_ref,b.purchase_order_no,b.invoice_no,b.notes]
    .some(s=>(s||'').toLowerCase().includes(q)));

  $('countLine').textContent=list.length+' bucket'+(list.length===1?'':'s');

  if(!list.length){
    $('host').innerHTML=`<div class="empty" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      <div class="empty-t">${q?'No buckets match':'No evidence buckets yet'}</div>
      <div class="empty-d">${q?'Try a different search.':'Create a bucket with a Purchase Order number, then upload your invoices, B/Ls and packing lists.'}</div>
    </div>`; return;
  }

  $('host').innerHTML=list.map(b=>{
    const cls={'Open':'st-open','Linked':'st-linked','Archived':'st-archived'}[b.status]||'st-open';
    const types=(b.doc_types||[]).filter(Boolean);
    return `<div class="card" onclick="location.href='evidence-detail.html?id=${b.id}'">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div class="card-ref">${esc(b.bucket_ref)}</div>
        <span class="badge ${cls}">${esc(b.status)}</span>
      </div>
      <div class="card-meta">${[b.purchase_order_no&&('PO: '+b.purchase_order_no),
        b.invoice_no&&('INV: '+b.invoice_no),timeAgo(b.created_at)].filter(Boolean).join(' · ')}</div>
      <div class="card-stats">
        <div class="stat"><div class="stat-ic docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div><div style="font-weight:700;">${b.document_count||0}</div><div style="font-size:10px;color:var(--muted);">documents</div></div></div>
        <div class="stat"><div class="stat-ic ocr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
          <div><div style="font-weight:700;">${b.ocr_done_count||0}</div><div style="font-size:10px;color:var(--muted);">scanned</div></div></div>
        ${b.shipment_id?`<div class="stat"><div class="stat-ic link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div>
          <div style="font-size:10px;color:var(--muted);">Linked to shipment</div></div>`:''}
      </div>
      ${types.length?`<div class="types">${types.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
    </div>`;
  }).join('');
}

async function load(){
  if(!dbClient){ BUCKETS=[]; renderList(); return; }
  try{
    const {data:{session}}=await dbClient.auth.getSession();
    if(!session) return;
    const {data:profile}=await dbClient.from('profiles')
      .select('first_name,last_name,avatar_color,company_id').eq('id',session.user.id).single();
    if(profile){
      ORG_ID=profile.company_id;
      const f=profile.first_name||session.user.email.split('@')[0], l=profile.last_name||'';
      $('avatarBtn').style.background=profile.avatar_color||'var(--primary)';
      $('avatarInitials').textContent=(f.charAt(0)+(l?l.charAt(0):'')).toUpperCase();
      $('avatarGreeting').textContent=greetingTime()+', '+f+'!';
    }

    let data,error;
    try{
      const r=await dbClient.from('evidence_bucket_summary').select('*');
      data=r.data; error=r.error;
    }catch(e){
      // View might not exist — fall back to base table
      const r=await dbClient.from('evidence_buckets').select('*').order('created_at',{ascending:false});
      data=(r.data||[]).map(b=>({...b,document_count:0,ocr_done_count:0,doc_types:[]}));
      error=r.error;
    }
    if(error) throw error;
    BUCKETS=data||[];
    renderList();
  }catch(e){
    console.warn('Evidence load:',e.message);
    BUCKETS=[]; renderList();
  }
}



load();
</script>
</body>
</html>
