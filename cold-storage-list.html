<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cold Storage · SmarTuna concept</title>
<link rel="icon" type="image/png" href="sc-blue-logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    /* ── SMARTUNA WORDMARK ── */
    @font-face {
      font-family: 'Bitsumis';
      src: url('BITSUMIS.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    .sc-wm { display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;gap:0;text-decoration:none; }
    .sc-wm-top { font-family:'Bitsumis',sans-serif !important;font-weight:900 !important;font-size:15px;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,#1a6fdb,#1a6fdb) !important;-webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;background-clip:text !important; }
    .sc-wm-sub { font-family:'Bitsumis',sans-serif !important;font-weight:700 !important;font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:#1a1a2e;-webkit-text-fill-color:#1a1a2e !important;margin-top:2px; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a6fdb; --primary-ink:#1558b0; --primary-soft:#e8f1fc;
  --bg:#f0f2f7; --white:#ffffff; --surface:#ffffff;
  --text:#1a1a2e; --muted:#6b7280; --soft:#8a90a2;
  --border:#e8eaf0; --line:#eef0f5; --line-strong:#dfe3ec;
  --ok:#1f9d6b; --ok-soft:#e6f6ef; --off:#9aa0b4; --off-soft:#eef0f4;
  --danger:#e63946; --danger-soft:#fff0f1;
  --radius:16px; --radius-sm:11px; --field-h:44px;
  --shadow-sm:0 1px 3px rgba(20,24,45,.05);
  --shadow:0 1px 2px rgba(20,24,45,.04),0 10px 30px rgba(20,24,45,.06);
  --shadow-lg:0 6px 14px rgba(20,24,45,.07),0 24px 48px rgba(20,24,45,.10);
  --font:'Poppins','DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ===== TOP NAV (matched to home-logged-in.html) ===== */
.topbar{display:flex;align-items:center;padding:14px 28px;gap:20px;flex-shrink:0}
.topbar-brand{text-decoration:none;flex-shrink:0;line-height:1.1}
.topbar-brand-project{display:block;font-size:8px;font-weight:700;letter-spacing:2px;color:#9aa0b4}
.topbar-brand-name{display:block;font-size:16px;font-weight:800;color:var(--text)}
.topbar-nav{flex:1;display:flex;justify-content:center}
.nav-pill{display:inline-flex;align-items:center;gap:2px;background:var(--white);border-radius:999px;padding:5px 7px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.nav-item{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:400;color:var(--muted);text-decoration:none;transition:background .15s,color .15s;white-space:nowrap}
.nav-item img{width:15px;height:15px;object-fit:contain;opacity:.5;flex-shrink:0}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--bg);color:var(--text);font-weight:600}
.nav-item:hover img,.nav-item.active img{opacity:1}
.nav-item-wrap{position:relative}
.nav-item-wrap::after{content:'';position:absolute;top:100%;left:0;width:100%;height:12px;background:transparent}
.nav-item-wrap:hover .nav-dropdown{display:block}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.search-pill{display:flex;align-items:center;gap:8px;background:var(--white);border-radius:999px;padding:8px 16px;font-size:12px;color:#c0c4d0;box-shadow:0 1px 4px rgba(0,0,0,.06);min-width:150px;cursor:text}
.notif-btn{width:36px;height:36px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.07);position:relative;flex-shrink:0}
.notif-btn img{width:17px;height:17px;object-fit:contain;opacity:.65}
.notif-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:#e63946;border-radius:50%;border:2px solid var(--bg)}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.12);flex-shrink:0;overflow:hidden}
.avatar-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.10);min-width:176px;overflow:hidden;z-index:999}
.avatar-menu.open{display:block}
.avatar-menu-name{padding:11px 15px 7px;font-size:12px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border)}
.avatar-menu a{display:flex;align-items:center;gap:8px;padding:9px 15px;font-size:13px;color:#4a4e69;text-decoration:none;font-weight:500}
.avatar-menu a:hover{background:var(--bg);color:var(--primary)}
.avatar-menu button{width:100%;padding:9px 15px;background:none;border:none;border-top:1px solid var(--border);text-align:left;font-family:var(--font);font-size:13px;color:#e63946;cursor:pointer}
.avatar-menu button:hover{background:#fff0f1}
.nav-dropdown{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.10);min-width:170px;overflow:visible;z-index:500;padding:6px}
.nav-dropdown-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:13px;color:#4a4e69;text-decoration:none;border-radius:8px;font-weight:500;transition:background .15s;white-space:nowrap;cursor:pointer}
.nav-dropdown-item:hover{background:var(--bg);color:var(--primary)}
.nav-dropdown-item.active{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.nav-dropdown-sub{display:none;position:absolute;left:calc(100% + 4px);top:0;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.10);min-width:160px;padding:6px;z-index:501}
.nav-dropdown-item:hover .nav-dropdown-sub{display:block}

.wrap{max-width:1160px;margin:0 auto;padding:8px 28px 90px}
.crumb{font-size:12px;color:var(--soft);font-weight:500;margin-bottom:6px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:2px 0 0}
.head p{color:var(--muted);margin:7px 0 0;font-size:13px;max-width:560px}
.tools{display:flex;gap:11px;align-items:center}
.search{position:relative}
.search input{height:44px;border:1.5px solid var(--border);border-radius:12px;padding:0 14px 0 40px;width:280px;font:inherit;background:#fff;transition:.14s}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3.5px rgba(26,111,219,.13)}
.search svg{position:absolute;left:13px;top:13px;color:var(--soft)}
.btn{height:44px;padding:0 20px;border-radius:12px;font-weight:600;border:1.5px solid transparent;cursor:pointer;font:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(26,111,219,.28)}
.btn-primary:hover{background:var(--primary-ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:24px}
.cs-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;cursor:pointer;transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,border-color .16s;position:relative;overflow:hidden}
.cs-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--primary),#5b9be8);opacity:0;transition:.16s}
.cs-card:hover{transform:translateY(-3px);border-color:#dbe6f6;box-shadow:var(--shadow-lg)}
.cs-card:hover::before{opacity:1}
.cs-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cs-name{font-size:16.5px;font-weight:600;margin:0;line-height:1.3;letter-spacing:-.2px}
.cs-type{color:var(--muted);font-size:12.5px;margin-top:3px}
.pill{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--off-soft);color:var(--off)}
.cs-meta{margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.cs-meta b{color:var(--text);font-weight:500}
.cs-foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--soft)}
.orgcount{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-ink);font-weight:600;padding:4px 10px;border-radius:999px}

.empty{grid-column:1/-1;margin-top:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line-strong);border-radius:var(--radius);padding:50px 20px}
.empty .big{font-size:18px;color:var(--text);font-weight:600;margin-bottom:6px}
.skel{height:172px;border-radius:var(--radius);background:linear-gradient(90deg,#eef1f6,#f7f9fc,#eef1f6);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

</style>
</head>
<body>
  <!-- TOP BAR (shared) -->
  <div class="topbar">
    <a href="index.html" class="topbar-brand" style="display:flex;align-items:center;gap:9px;">
      <img src="sc-blue-logo.png" alt="SmarTuna" style="width:26px;height:26px;object-fit:contain;flex-shrink:0;"/>
      <span class="sc-wm">
        <span class="sc-wm-top">SmarTuna</span>
        <span class="sc-wm-sub">concept</span>
      </span>
    </a>
    <div class="topbar-nav">
      <div class="nav-pill">
        <a href="home-logged-in.html" class="nav-item">
          <img src="home.png" alt="" /> Home
        </a>
        <div class="nav-item-wrap">
          <a href="organisation.html" class="nav-item">
            <img src="my-studio.png" alt="" /> My Studio
          </a>
          <div class="nav-dropdown">
            <a href="product-list.html" class="nav-dropdown-item">Product</a>
            <a href="organisation.html" class="nav-dropdown-item">Your Company</a>
          </div>
        </div>
        <div class="nav-item-wrap">
          <a href="Species.html" class="nav-item active">
            <img src="atlas.png" alt="" /> Atlas
          </a>
          <div class="nav-dropdown">
            <a href="Species.html" class="nav-dropdown-item">Species</a>
            <a href="cold-storage-list.html" class="nav-dropdown-item active">Cold Storage</a>
            <a href="port-list.html" class="nav-dropdown-item">Ports</a>
            <a href="vessel-list.html" class="nav-dropdown-item">Vessels</a>

            <div class="nav-dropdown-item" style="position:relative;">
              Others
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
              <div class="nav-dropdown-sub">
                <a href="#" class="nav-dropdown-item">MSC Fisheries</a>
                <a href="#" class="nav-dropdown-item">ASC Farms</a>
              </div>
            </div>
          </div>
        </div>
        <a href="#" class="nav-item"><img src="features.png" alt="" /> Features</a>
        <a href="#" class="nav-item"><img src="messages.png" alt="" /> Messages</a>
        <a href="#" class="nav-item"><img src="report.png" alt="" /> Reports</a>
        <a href="report.html" class="nav-item"><img src="support.png" alt="" /> Support</a>
      </div>
    </div>
    <div class="topbar-right">
      <div class="search-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search here...
      </div>
      <div class="notif-btn">
        <img src="notification.png" alt="" />
        <div class="notif-dot"></div>
      </div>
      <div style="position:relative;flex-shrink:0;">
        <div class="avatar-btn" id="avatarBtn" onclick="toggleAvatarMenu()"><span id="avatarInitials">··</span></div>
        <div class="avatar-menu" id="avatarMenu">
          <div class="avatar-menu-name" id="avatarGreeting">Hello!</div>
          <a href="profile.html">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            Profile
          </a>
          <button onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>


<div class="wrap">
  <div class="crumb">Atlas</div>
  <div class="head">
    <div>
      <h1>Cold Storage</h1>
      <p id="sub">Shared directory of cold storage facilities.</p>
    </div>
    <div class="tools">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Search facilities…" />
      </div>
      <a class="btn btn-primary" id="addBtn" href="cold-storage.html" style="display:none">+ Add cold storage</a>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</div>
<script>
/* SET YOUR PROJECT VALUES (same as other pages) */
const SUPABASE_URL  = 'https://enbdaajcromxmhgcverp.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuYmRhYWpjcm9teG1oZ2N2ZXJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjc4MTUsImV4cCI6MjA5MzcwMzgxNX0.wlVbN57eAwRmTROEEY3D6BIX3H5pI6MwZ5hM2BqpnEs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const $=id=>document.getElementById(id);
let isAdmin=false, all=[];

(async function init(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ location.href='index.html'; return; }
  const { data:prof } = await sb.from('profiles').select('role, first_name, last_name, avatar_color, photo_url').eq('id',user.id).single();
  isAdmin = prof && ['admin','operator'].includes(prof.role);
  applyAvatar(prof, user.email);
  if(isAdmin){ $('addBtn').style.display='inline-flex'; $('sub').textContent='Shared directory of cold storage facilities. You can see every facility and the organisations attached to each.'; }
  else $('sub').textContent='Cold storage facilities your organisation has access to.';
  await load();
  $('q').addEventListener('input',render);
})();

async function load(){
  // RLS does the visibility work: admin sees all, an org sees only granted facilities
  const { data:facs, error } = await sb.from('cold_storage_facilities')
    .select('*').order('name');
  if(error){ $('grid').innerHTML=`<div class="empty"><div class="big">Couldn't load facilities</div>${error.message}</div>`; return; }
  all = facs||[];

  // admin-only: count attached orgs per facility (one query, counted client-side)
  if(isAdmin && all.length){
    const ids=all.map(f=>f.id);
    const { data:grants } = await sb.from('cold_storage_access').select('facility_id, company_id').in('facility_id',ids);
    const counts={}; (grants||[]).forEach(g=>counts[g.facility_id]=(counts[g.facility_id]||0)+1);
    all.forEach(f=>f._orgs=counts[f.id]||0);
  }
  render();
}

function render(){
  const q=($('q').value||'').toLowerCase().trim();
  const rows=all.filter(f=>!q || (f.name||'').toLowerCase().includes(q) || (f.city||'').toLowerCase().includes(q) || (f.country||'').toLowerCase().includes(q));
  if(!rows.length){
    $('grid').innerHTML = all.length
      ? `<div class="empty"><div class="big">No matches</div>Try a different search.</div>`
      : `<div class="empty"><div class="big">No cold storage yet</div>${isAdmin?'Use “Add cold storage” to create the first facility.':'No facilities have been shared with your organisation yet.'}</div>`;
    return;
  }
  $('grid').innerHTML = rows.map(card).join('');
  document.querySelectorAll('.cs-card').forEach(el=>{
    el.onclick=()=> location.href = (isAdmin?'cold-storage.html?id=':'cold-storage-detail.html?id=')+el.dataset.id;
  });
}

function card(f){
  const temp = (f.min_temp_c!=null||f.max_temp_c!=null)
    ? `${f.min_temp_c??'–'}°C to ${f.max_temp_c??'–'}°C` : '—';
  const loc = [f.city,f.country].filter(Boolean).join(', ') || '—';
  const on = f.status==='Active';
  return `<div class="cs-card" data-id="${f.id}">
    <div class="cs-top">
      <div><p class="cs-name">${esc(f.name)}</p><div class="cs-type">${esc(f.storage_type||'Cold storage')}</div></div>
      <span class="pill ${on?'on':'off'}">${on?'Active':'Inactive'}</span>
    </div>
    <div class="cs-meta">
      <span>📍 <b>${esc(loc)}</b></span>
      <span>🌡 <b>${temp}</b></span>
      ${f.storage_capacity?`<span>📦 <b>${esc(f.storage_capacity)}</b></span>`:''}
    </div>
    <div class="cs-foot">
      <span>${f.gln?('GLN '+esc(f.gln)):''}</span>
      ${isAdmin?`<span class="orgcount">👥 ${f._orgs||0} org${(f._orgs===1)?'':'s'}</span>`:''}
    </div>
  </div>`;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- shared nav behaviour ---- */
function toggleAvatarMenu(){ document.getElementById('avatarMenu').classList.toggle('open'); }
document.addEventListener('click', e=>{ if(!e.target.closest('.avatar-btn')) document.getElementById('avatarMenu')?.classList.remove('open'); });
async function handleLogout(){ await sb.auth.signOut(); location.href='index.html'; }
function applyAvatar(p, email){
  const first=(p&&p.first_name)||(email?email.split('@')[0]:'')||'User';
  const last=(p&&p.last_name)||'';
  const initials=((first.charAt(0)||'')+(last.charAt(0)||'')).toUpperCase()||'··';
  const btn=document.getElementById('avatarBtn');
  if(p&&p.photo_url){ btn.innerHTML=`<img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover" />`; }
  else { btn.style.background=(p&&p.avatar_color)||'#1a6fdb'; document.getElementById('avatarInitials').textContent=initials; }
  const g=document.getElementById('avatarGreeting'); if(g) g.textContent=`Hello, ${first}!`;
}

</script>
</body>
