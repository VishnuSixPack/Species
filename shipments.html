/* =====================================================================
   shipments.html — overview of every child shipment + read-only summary
   ===================================================================== */
const txt = v => v==null ? "" : String(v).trim();
const UI = { q:"", tile:"all", mode:"", dep:"", arr:"", when:"", sort:"etd", dir:-1, sel:new Set() };
let SHOWN = [];   /* ids in the list as filtered */
const DATA = { ships:[], mixed:{} };

const SHIP_COLS = "id,master_id,reference,shipment_no,source,status,customer_order_no,container_no,seal_no,bl_no,awb_no,invoice_no,"
  + "shipment_mode,load_basis,load_type,ship_mode,shipping_line,airline,courier_tracking_no,shipper_org_id,consignee_org_id,"
  + "departure_port_id,departure_planned,departure_scheduled,departure_actual,arrival_port_id,arrival_planned,arrival_scheduled,arrival_actual,"
  + "destination_delivery_date,master_orders(ref_id,master_no,external_reference,product_id,quantity_unit),shipment_lines(quantity),shipment_transhipments(seq,port_id,location)";

async function loadData(){
  const [ships, mixed] = await Promise.all([
    fetchAll(()=>smt().from("shipments").select(SHIP_COLS).order("departure_planned",{ascending:false}).order("id")),
    fetchAll(()=>smt().from("v_shipment_mixed_with").select("shipment_id,mixed_shipment_id,mixed_reference").order("shipment_id").order("mixed_reference"))
  ]);
  DATA.mixed = {};
  mixed.forEach(m=>{ (DATA.mixed[m.shipment_id] = DATA.mixed[m.shipment_id] || []).push({id:m.mixed_shipment_id, ref:m.mixed_reference}); });
  DATA.ships = ships.map(enrich);
}

/* ---------- derived facts ---------- */
const DONE = ["Arrived","Delivered"];
const NOT_BOOKED = ["No shipment instructions","Booking requested"];
function enrich(s){
  const m = s.master_orders || {};
  const prod = REFS.productById.get(m.product_id);
  const etd = s.departure_actual || s.departure_scheduled || s.departure_planned || "";
  const eta = s.arrival_actual || s.arrival_scheduled || s.arrival_planned || "";
  const today = todayISO();
  const arrived = !!s.arrival_actual || DONE.includes(s.status);
  const departed = arrived || !!s.departure_actual || s.status==="In transit";
  const missing = [];
  if(s.shipment_mode==="Sea" && !txt(s.bl_no)) missing.push("B/L");
  if(s.shipment_mode==="Air" && !txt(s.awb_no)) missing.push("AWB");
  if(!txt(s.invoice_no)) missing.push("Invoice");
  if(s.shipment_mode==="Sea" && (!txt(s.container_no) || !txt(s.seal_no))) missing.push("Container / seal");
  const etaDue = s.arrival_scheduled || s.arrival_planned || "";
  return {...s,
    master_no:m.master_no||"", ext_ref:m.external_reference||"", master_key:mKey(m), master_ref:m.ref_id, unit:m.quantity_unit||"",
    product: prod ? prod.name : "", gtin: prod ? prod.gtin : "",
    dep: REFS.portById.get(s.departure_port_id) || "", arr: REFS.portById.get(s.arrival_port_id) || "",
    tranship: (s.shipment_transhipments||[]).sort((a,b)=>a.seq-b.seq).map(t=>t.port_id ? (REFS.portById.get(t.port_id)||"") : (t.location||"")).filter(Boolean),
    qty: (s.shipment_lines||[]).reduce((a,l)=>a+num(l.quantity),0), lines:(s.shipment_lines||[]).length,
    shipper: REFS.orgById.get(s.shipper_org_id)?.label || "", consignee: REFS.orgById.get(s.consignee_org_id)?.label || "",
    etd, eta, etdActual:!!s.departure_actual, etaActual:!!s.arrival_actual,
    stage: DONE.includes(s.status) && s.status==="Delivered" ? 3 : arrived ? 2 : departed ? 1 : 0,
    overdue: !arrived && !!etaDue && etaDue < today,
    lateDays: !arrived && etaDue && etaDue < today ? Math.round((new Date(today) - new Date(etaDue))/864e5) : 0,
    missing, mixed: DATA.mixed[s.id] || []
  };
}
const code = l => { const m = String(l||"").match(/\(([A-Z0-9]{5})\)\s*$/); return m ? m[1] : ""; };
const place = l => String(l||"—").split(",")[0];

/* ---------- filters ---------- */
const TILES = [
  {k:"all",      label:"All shipments",     test:()=>true},
  {k:"notbooked",label:"Not booked",        test:s=>NOT_BOOKED.includes(s.status)},
  {k:"booked",   label:"Booked",            test:s=>s.status==="Booked"},
  {k:"transit",  label:"In transit",        test:s=>s.status==="In transit"},
  {k:"arrived",  label:"Arrived / delivered", test:s=>DONE.includes(s.status)},
  {k:"overdue",  label:"Overdue ETA",       test:s=>s.overdue, tone:"red"},
  {k:"docs",     label:"Missing documents", test:s=>s.missing.length>0, tone:"amber"}
];
const WHEN = {
  "":       {label:"Any departure date", test:()=>true},
  next30:   {label:"Departing next 30 days", test:s=>s.etd>=todayISO() && s.etd<=addDays(todayISO(),30)},
  last30:   {label:"Departed last 30 days", test:s=>s.etd<todayISO() && s.etd>=addDays(todayISO(),-30)},
  month:    {label:"Departing this month", test:s=>s.etd.slice(0,7)===todayISO().slice(0,7)}
};
function baseFiltered(){
  const qq = UI.q.toLowerCase().trim();
  return DATA.ships.filter(s=>
    (!UI.mode || s.shipment_mode===UI.mode) &&
    (!UI.dep || s.departure_port_id===UI.dep) &&
    (!UI.arr || s.arrival_port_id===UI.arr) &&
    WHEN[UI.when].test(s) &&
    (!qq || [s.reference, s.master_no, s.ext_ref, s.customer_order_no, s.container_no, s.seal_no, s.bl_no, s.awb_no, s.invoice_no, s.product, s.gtin, s.shipper, s.consignee, s.dep, s.arr]
              .some(v=>txt(v).toLowerCase().includes(qq))));
}
const SORTS = {
  ref:    (a,b)=>a.master_key.localeCompare(b.master_key, undefined, {numeric:true, sensitivity:"base"}) || a.shipment_no-b.shipment_no,
  etd:    (a,b)=>(a.etd||"").localeCompare(b.etd||""),
  eta:    (a,b)=>(a.eta||"").localeCompare(b.eta||""),
  status: (a,b)=>(a.stage-b.stage) || (a.status||"").localeCompare(b.status||""),
  qty:    (a,b)=>a.qty-b.qty
};

/* ---------- list ---------- */
function routeMini(s){
  const pct = [8, 50, 100, 100][s.stage];
  const dots = s.tranship.map((t,i)=>`<i class="rt-t" style="left:${(i+1)*100/(s.tranship.length+1)}%" title="Transhipment · ${esc(t)}"></i>`).join("");
  return `<div class="rt">
    <div class="rt-ends"><span title="${esc(s.dep)}">${esc(code(s.dep)||place(s.dep))}</span><span title="${esc(s.arr)}">${esc(code(s.arr)||place(s.arr))}</span></div>
    <div class="rt-line ${s.overdue?"late":""}"><b style="width:${pct}%"></b>${dots}<i class="rt-a ${s.stage>=1?"on":""}"></i><i class="rt-z ${s.stage>=2?"on":""}"></i></div>
    <div class="rt-ends rt-dates"><span>${s.etd?fmtDate(s.etd):"—"}${s.etdActual?"":` <em>${s.departure_scheduled?"sched.":"plan"}</em>`}</span><span>${s.eta?fmtDate(s.eta):"—"}${s.etaActual?"":s.eta?` <em>${s.arrival_scheduled?"sched.":"plan"}</em>`:""}</span></div>
  </div>`;
}
function render(){
  const base = baseFiltered();
  $("#tiles").innerHTML = TILES.map(t=>{ const n = base.filter(t.test).length;
    return `<button type="button" class="tile ${t.tone||""} ${UI.tile===t.k?"on":""}" data-tile="${t.k}" aria-pressed="${UI.tile===t.k}"><span>${t.label}</span><b>${n}</b></button>`; }).join("");
  const tile = TILES.find(t=>t.k===UI.tile);
  const rows = base.filter(tile.test).sort((a,b)=>SORTS[UI.sort](a,b)*UI.dir || SORTS.ref(a,b));
  SHOWN = rows.map(s=>s.id);
  const ids = new Set(DATA.ships.map(s=>s.id)); [...UI.sel].forEach(id=>{ if(!ids.has(id)) UI.sel.delete(id); });
  const allOn = rows.length && rows.every(s=>UI.sel.has(s.id)), someOn = rows.some(s=>UI.sel.has(s.id));
  $("#count").textContent = `${rows.length} of ${DATA.ships.length} shipment${DATA.ships.length===1?"":"s"}`;
  const th = (k, label, cls="") => `<th class="${cls}"><button type="button" class="sortb ${UI.sort===k?"on":""}" data-sort="${k}">${label}<span aria-hidden="true">${UI.sort===k ? (UI.dir>0?"↑":"↓") : "↕"}</span></button></th>`;
  const body = rows.map(s=>`<tr data-view="${esc(s.id)}" tabindex="0" class="${UI.sel.has(s.id)?"picked":""}">
      <td class="selc"><input type="checkbox" class="cbx" data-pick="${esc(s.id)}" ${UI.sel.has(s.id)?"checked":""} aria-label="Select ${esc(s.reference)}"></td>
      <td><span class="ref">${esc(s.reference)}</span>${s.source==="import"?`<span class="tag-src">Excel</span>`:""}<br><span class="muted-s">${esc(s.product||"—")}</span></td>
      <td>${esc(s.customer_order_no||"—")}${s.mixed.length?` <span class="tag-share" title="Same customer order, container and seal">mixed with ${esc(s.mixed.map(m=>m.ref).join(", "))}</span>`:""}<br><span class="muted-s">${esc(s.container_no||"—")} · ${esc(s.seal_no||"—")}</span></td>
      <td class="rt-cell">${routeMini(s)}</td>
      <td><span class="mode">${MODE_ICON[s.shipment_mode]||""}${esc(s.shipment_mode)}</span><br><span class="muted-s">${esc([s.load_basis, s.load_type].filter(Boolean).join(" · ")||"—")}</span></td>
      <td class="num">${fmtN(s.qty)} ${esc(s.unit)}<br><span class="muted-s">${s.lines} line${s.lines===1?"":"s"}</span></td>
      <td><span class="st ${statusClass(s.status)}">${esc(s.status||"—")}</span>${s.overdue?`<br><span class="late-t">ETA ${s.lateDays} day${s.lateDays===1?"":"s"} overdue</span>`:""}</td>
      <td>${s.missing.length?`<span class="docs-miss" title="Missing: ${esc(s.missing.join(", "))}">${s.missing.length} missing</span>`:`<span class="docs-ok">Complete</span>`}</td>
    </tr>`).join("");
  const empty = !DATA.ships.length
    ? `No shipments yet. Add one from a master order or import them on the <a href="orders.html">Master orders</a> page.`
    : `No shipments match these filters. <button type="button" class="linkbtn" data-action="resetFilters">Clear filters</button>`;
  $("#stbl").innerHTML = `<thead><tr><th class="selc"><input type="checkbox" class="cbx" data-pickall="1" ${allOn?"checked":""} aria-label="Select all shown shipments"></th>${th("ref","Shipment")}<th>Customer order · container</th>${th("etd","Route · ETD → ETA","rt-h")}<th>Mode</th>${th("qty","Quantity","num")}${th("status","Status")}<th>Documents</th></tr></thead>
    <tbody>${body || `<tr class="empty"><td colspan="8">${empty}</td></tr>`}</tbody>`;
  const pa = $('[data-pickall]'); if(pa) pa.indeterminate = !allOn && someOn;
  renderSelBar();
}
function renderSelBar(){
  const n = UI.sel.size, bar = $("#selbar");
  bar.hidden = !n;
  if(n) bar.innerHTML = `<span><b>${n}</b> selected</span>
    <button type="button" class="linkbtn" data-action="clearSel">Clear</button>
    <button type="button" class="btn danger" data-action="deleteSel"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete ${n>1?`${n} shipments`:"shipment"}</button>`;
}
/* delete one or more shipments (lines, legs and transhipments go with them) */
function confirmDelete(ids, after){
  const list = ids.map(id=>DATA.ships.find(s=>s.id===id)).filter(Boolean);
  if(!list.length) return;
  const refs = list.map(s=>s.reference), shown = refs.slice(0,8).map(r=>`<span class="obj">${esc(r)}</span>`).join(", ") + (refs.length>8 ? ` and ${refs.length-8} more` : "");
  const mixed = list.filter(s=>s.mixed.length && !s.mixed.every(m=>ids.includes(m.id)));
  popup({ok:false, title: list.length>1 ? `Delete ${list.length} shipments?` : `Delete ${refs[0]}?`,
    msg:`${shown} will be removed with ${list.length>1?"their":"its"} lines. The quantity goes back to the master order. Shipment numbers aren’t reused.${mixed.length?`<br><br>${mixed.length>1?"Some are":"It is"} mixed with other shipments; those stay and simply lose the link.`:""}<br><br><b>This can’t be undone.</b>`,
    primary: list.length>1 ? `Delete ${list.length}` : "Delete", secondary:"Cancel",
    async onPrimary(){
      try{
        for(let i=0;i<ids.length;i+=100) await q(smt().from("shipments").delete().in("id", ids.slice(i,i+100)));
        ids.forEach(id=>UI.sel.delete(id));
        if(after) after();
        await loadData(); fillFilters(); render();
        toast(list.length>1 ? `${list.length} shipments deleted` : `${refs[0]} deleted`);
      }catch(err){ popup({ok:false, title:"Couldn’t delete", msg:esc(errText(err))}); await loadData(); render(); }
    }});
}
const MODE_ICON = {
  Sea:`<svg viewBox="0 0 24 24"><path d="M3 17c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0"/><path d="M5 14l-1-5h16l-1 5"/><path d="M9 9V5h6v4"/></svg>`,
  Air:`<svg viewBox="0 0 24 24"><path d="M10.5 13.5 3 11l1.5-1.5 8 1 4-4.5c1-1 2.5-1.5 3.5-.5s.5 2.5-.5 3.5l-4.5 4 1 8L14.5 22 12 14.5"/></svg>`,
  Truck:`<svg viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 10h5l3 3v3h-8"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>`
};

/* filter dropdowns: ports that appear in the data */
function fillFilters(){
  const opts = (key, idKey) => { const m = new Map(); DATA.ships.forEach(s=>{ if(s[idKey]) m.set(s[idKey], s[key]); });
    return [...m.entries()].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,l])=>`<option value="${esc(id)}">${esc(l)}</option>`).join(""); };
  $("#fDep").innerHTML = `<option value="">All departure ports</option>${opts("dep","departure_port_id")}`;
  $("#fArr").innerHTML = `<option value="">All arrival ports</option>${opts("arr","arrival_port_id")}`;
  $("#fWhen").innerHTML = Object.entries(WHEN).map(([k,w])=>`<option value="${k}">${w.label}</option>`).join("");
  $("#fDep").value = UI.dep; $("#fArr").value = UI.arr; $("#fWhen").value = UI.when; $("#fMode").value = UI.mode;
  if($("#fDep").value!==UI.dep) UI.dep = ""; if($("#fArr").value!==UI.arr) UI.arr = "";
}

/* ---------- summary drawer ---------- */
const kv = (label, value) => `<div class="kv"><span>${label}</span><b>${value==null||value===""?`<i class="none">—</i>`:value}</b></div>`;
const d = v => v ? fmtDate(v) : "";
function timeline(s, x){
  const legs = (x.legs||[]).slice().sort((a,b)=>a.seq-b.seq);
  const nm = l => l ? esc(l.name)+(l.voyage_no?` · voyage ${esc(l.voyage_no)}`:"") : "";
  const first = legs[0], mother = legs.length>1 ? legs[legs.length-1] : null;
  const firstLbl = first ? `${{vessel: legs.length>1?"Feeder vessel":"Vessel", flight:"Flight", truck:"Truck"}[first.kind]||""} ${nm(first)}` : "";
  const steps = [
    {title:"Departure", place:s.dep, planned:x.departure_planned, sched:x.departure_scheduled, actual:x.departure_actual, done:s.stage>=1, sub:firstLbl},
    ...(x.transhipments||[]).map(t=>({title:"Transhipment", place:t.label||t.location||"", done:s.stage>=2, sub:""})),
    {title:"Arrival", place:s.arr, planned:x.arrival_planned, sched:x.arrival_scheduled, actual:x.arrival_actual, done:s.stage>=2, late:s.overdue, sub:mother?`Mother vessel ${nm(mother)}`:""},
    {title:"Delivered", place:"Final destination", actual:x.destination_delivery_date, done:s.stage>=3 || !!x.destination_delivery_date, sub:""}
  ];
  const cur = steps.findIndex(st=>!st.done);
  return `<ol class="tl">${steps.map((st,i)=>`<li class="${st.done?"done":""} ${i===cur?"cur":""} ${st.late?"late":""}">
    <span class="tl-dot" aria-hidden="true"></span>
    <div class="tl-body"><div class="tl-h"><b>${st.title}</b><span>${esc(st.place||"—")}</span></div>
      ${st.planned!==undefined||st.sched!==undefined ? `<div class="tl-dates">
        <span><em>Planned</em>${d(st.planned)||"—"}</span><span><em>Scheduled</em>${d(st.sched)||"—"}</span><span class="${st.actual?"act":""}"><em>Actual</em>${d(st.actual)||"—"}</span></div>`
        : st.actual!==undefined ? `<div class="tl-dates"><span class="${st.actual?"act":""}"><em>Date</em>${d(st.actual)||"—"}</span></div>` : ""}
      ${st.late?`<div class="late-t">ETA passed ${s.lateDays} day${s.lateDays===1?"":"s"} ago without an actual arrival</div>`:""}
      ${st.sub?`<div class="muted-s">${st.sub}</div>`:""}</div></li>`).join("")}</ol>`;
}
function docRow(label, ok, detail){ return `<li class="${ok?"ok":"miss"}"><span class="dk" aria-hidden="true">${ok?"✓":"!"}</span><b>${label}</b><span>${ok?esc(detail):"Missing"}</span></li>`; }
async function openView(id, push=true){
  const s = DATA.ships.find(x=>x.id===id);
  if(!s){ toast("That shipment wasn’t found. It may have been deleted."); return; }
  if(push) history.replaceState(null, "", `?id=${encodeURIComponent(id)}`);
  let dr = $("#drawer");
  if(!dr){ dr = document.createElement("div"); dr.id = "drawer"; dr.className = "dr-ov"; document.body.appendChild(dr); }
  dr.innerHTML = `<aside class="dr" role="dialog" aria-modal="true" aria-label="Shipment ${esc(s.reference)}"><div class="dr-load"><span class="spin"></span>Loading ${esc(s.reference)}…</div></aside>`;
  dr.classList.add("show"); document.body.classList.add("dr-open");
  let x;
  try{ x = await q(smt().rpc("get_shipment", {p_id:id})); }
  catch(e){ dr.querySelector(".dr").innerHTML = `<div class="dr-load"><p class="boot-err">${esc(errText(e))}</p><button class="btn" data-close-dr="1">Close</button></div>`; return; }
  if(!x){ closeView(); toast("That shipment wasn’t found."); return; }
  const unit = esc(s.unit);
  const isSea = s.shipment_mode==="Sea", isAir = s.shipment_mode==="Air";
  const lines = (x.lines||[]).map(l=>`<tr><td>${l.line_no}</td><td class="num">${fmtN(+l.quantity)} ${unit}</td><td>${esc(l.raw_material_id||"—")}</td><td>${esc(l.batch_no||"—")}</td><td>${d(l.production_date)||"—"}</td><td>${d(l.best_before)||"—"}</td><td class="num">${l.net_weight!=null?`${fmtN(+l.net_weight)} ${esc(l.net_weight_unit||"")}`:"—"}</td></tr>`).join("");
  const mixed = (x.mixed_with||[]);
  dr.querySelector(".dr").innerHTML = `
    <div class="dr-head">
      <div><div class="dr-ttl"><h2>${esc(s.reference)}</h2><span class="st ${statusClass(s.status)}">${esc(s.status)}</span>${s.source==="import"?`<span class="tag-src">Excel</span>`:""}</div>
        <p>${esc(s.product||"—")}${s.gtin?` · ${esc(s.gtin)}`:""} · Master <a href="order.html?order=${s.master_ref}">${esc(s.master_key)}</a>${s.ext_ref?` · PO ${esc(s.master_no)}`:""}</p></div>
      <button type="button" class="mx" data-close-dr="1" aria-label="Close">${XICON}</button>
    </div>
    <div class="dr-body">
      <div class="dr-strip">
        ${kv("Customer order", esc(x.customer_order_no))}${kv("Quantity", `${fmtN(s.qty)} ${unit} · ${s.lines} line${s.lines===1?"":"s"}`)}
        ${kv("Mode", `${esc(s.shipment_mode)}${x.ship_mode?` · ${esc(x.ship_mode)}`:""}`)}${kv("Incoterm", esc(x.incoterm))}
      </div>
      <section><h3>Route</h3>${timeline(s, x)}</section>
      <div class="dr-2">
        <section><h3>Parties</h3>
          <div class="party"><span>Shipper · ${esc(x.shipper_role||"Seller")}</span><b>${esc(s.shipper||x.shipper_name||"—")}</b><em>${x.shipper_gln?`GLN ${esc(x.shipper_gln)}`:""}${x.shipper_reference?` · Ref ${esc(x.shipper_reference)}`:""}</em></div>
          <div class="party"><span>Consignee · ${esc(x.consignee_role||"Buyer")}</span><b>${esc(s.consignee||x.consignee_name||"—")}</b><em>${x.consignee_gln?`GLN ${esc(x.consignee_gln)}`:""}${x.consignee_reference?` · Ref ${esc(x.consignee_reference)}`:""}</em></div>
        </section>
        <section><h3>Documents</h3><ul class="docs">
          ${isSea?docRow("Bill of lading", !!txt(x.bl_no), `${x.bl_no||""}${x.bl_date?` · ${d(x.bl_date)}`:""}`):""}
          ${isAir?docRow("Air waybill", !!txt(x.awb_no), `${x.awb_no||""}${x.awb_date?` · ${d(x.awb_date)}`:""}`):""}
          ${docRow("Commercial invoice", !!txt(x.invoice_no), `${x.invoice_no||""}${x.invoice_date?` · ${d(x.invoice_date)}`:""}`)}
          ${isSea?docRow("Container & seal", !!(txt(x.container_no)&&txt(x.seal_no)), `${x.container_no||""} · ${x.seal_no||""}`):""}
          ${x.courier||x.courier_tracking_no?docRow("Courier (original docs)", !!txt(x.courier_tracking_no), `${x.courier||""} ${x.courier_tracking_no||""}`.trim()):""}
        </ul></section>
      </div>
      <section><h3>Logistics</h3><div class="kv-grid">
        ${kv("Load", esc([x.load_basis, x.load_type].filter(Boolean).join(" · ")))}
        ${isSea?kv("Shipping line", esc(x.shipping_line)):isAir?kv("Airline", esc(x.airline)):""}
        ${isSea?kv("Container", esc(x.container_no)):""}${isSea?kv("Seal", esc(x.seal_no)):""}
        ${kv("Shipping type", esc(x.shipping_type))}${kv("Order date", d(x.order_date))}
      </div></section>
      <section><h3>Lines</h3>${lines?`<div class="tbl-wrap"><table class="tbl dr-lines"><thead><tr><th>#</th><th class="num">Quantity</th><th>Raw material ID</th><th>Batch</th><th>Produced</th><th>Best before</th><th class="num">Net weight</th></tr></thead><tbody>${lines}</tbody></table></div>`:`<p class="muted-s">No lines.</p>`}</section>
      <section><h3>Commercial</h3><div class="kv-grid">
        ${kv("Invoice no.", esc(x.invoice_no))}${kv("Invoice date", d(x.invoice_date))}${kv("Due date", d(x.due_date))}${kv("Payment term", esc(x.payment_term))}
        ${kv("Courier", esc(x.courier))}${kv("Tracking no.", esc(x.courier_tracking_no))}
      </div></section>
      ${mixed.length?`<section><h3>Mixed with</h3><p class="muted-s" style="margin:0 0 8px">Same customer order, container and seal.</p><div class="mixed-chips">${mixed.map(m=>`<button type="button" class="mchip" data-view="${esc(m.id)}"><b>${esc(m.reference)}</b><span>${esc(m.product||"")}</span></button>`).join("")}</div></section>`:""}
      ${x.notes?`<section><h3>Notes</h3><p class="notes">${esc(x.notes)}</p></section>`:""}
    </div>
    <div class="dr-foot">
      <button type="button" class="btn danger-ghost" data-action="deleteOne" data-id="${esc(s.id)}"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete</button><span class="sp"></span>
      <a class="btn" href="order.html?order=${s.master_ref}">Open master ${esc(s.master_key)}</a>
      <a class="btn primary" href="shipment.html?order=${s.master_ref}&id=${encodeURIComponent(s.id)}">Edit shipment</a>
    </div>`;
  dr.querySelector(".mx").focus();
}
function closeView(){
  const dr = $("#drawer"); if(!dr) return;
  dr.classList.remove("show"); document.body.classList.remove("dr-open");
  history.replaceState(null, "", location.pathname);
  const back = $(`#stbl [data-view="${CSS.escape(LAST_VIEW||"")}"]`); if(back) back.focus();
}
let LAST_VIEW = null;

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const pk = e.target.closest("[data-pick]");
  if(pk){ e.stopPropagation(); const id = pk.dataset.pick; pk.checked ? UI.sel.add(id) : UI.sel.delete(id); pk.closest("tr").classList.toggle("picked", pk.checked); render(); $(`[data-pick="${CSS.escape(id)}"]`)?.focus(); return; }
  if(e.target.closest("[data-pickall]")){ const on = e.target.checked; SHOWN.forEach(id=>on ? UI.sel.add(id) : UI.sel.delete(id)); render(); $('[data-pickall]')?.focus(); return; }
  if(e.target.closest("td.selc")) return;   /* a click beside the checkbox doesn't open the summary */
  if(e.target.closest("[data-close-dr]") || e.target.id==="drawer"){ closeView(); return; }
  const v = e.target.closest("[data-view]");
  if(v){ if(v.closest("#stbl")) LAST_VIEW = v.dataset.view; openView(v.dataset.view); return; }
  const t = e.target.closest("[data-tile]"); if(t){ UI.tile = t.dataset.tile; render(); return; }
  const so = e.target.closest("[data-sort]");
  if(so){ const k = so.dataset.sort; UI.dir = UI.sort===k ? -UI.dir : (k==="ref"?1:-1); UI.sort = k; render(); $(`[data-sort="${k}"]`)?.focus(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("#drawer.show")){ closeView(); return; }
  if(e.target.matches?.("input")) return;
  const r = e.target.closest?.("#stbl tr[data-view]");
  if(r && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); r.click(); }
});
Object.assign(ACTIONS, {
  clearSel(){ UI.sel.clear(); render(); },
  deleteSel(){ confirmDelete([...UI.sel]); },
  deleteOne(el){ confirmDelete([el.dataset.id], closeView); },
  resetFilters(){ Object.assign(UI, {q:"", tile:"all", mode:"", dep:"", arr:"", when:""}); $("#search").value = ""; fillFilters(); render(); }
});
$("#search").addEventListener("input", e=>{ UI.q = e.target.value; render(); });
[["#fMode","mode"],["#fDep","dep"],["#fArr","arr"],["#fWhen","when"]].forEach(([sel,k])=>$(sel).addEventListener("change", e=>{ UI[k] = e.target.value; render(); }));
let lastLoad = 0;
window.addEventListener("focus", async ()=>{ if(!SB || $("#drawer.show") || Date.now()-lastLoad < 5000) return; lastLoad = Date.now(); try{ await loadData(); fillFilters(); render(); }catch(e){} });

boot(async ()=>{
  await loadData(); lastLoad = Date.now(); fillFilters(); render();
  const id = new URLSearchParams(location.search).get("id"); if(id){ LAST_VIEW = id; openView(id, false); }
});

</script>
</body>
