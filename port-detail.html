<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Port · Project Manhattan</title>
<link rel="icon" type="image/png" href="brand-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a6fdb;--primary-dark:#1558b0;--primary-soft:#e8f1fc;--primary-mid:#d0e4f8;
  --bg:#f0f2f7;--text:#1a1a2e;--muted:#6b7280;--soft:#9aa0b4;
  --border:#e8eaf0;--line:#eef0f5;--line-strong:#dfe3ec;
  --ok:#1f9d6b;--ok-soft:#e6f6ef;--danger:#e63946;
  --radius:14px;--radius-sm:10px;--font:'Poppins','DM Sans',system-ui,sans-serif;
  --shadow:0 1px 3px rgba(20,24,45,.05),0 8px 24px rgba(20,24,45,.06);
  --shadow-lg:0 6px 14px rgba(20,24,45,.08),0 24px 48px rgba(20,24,45,.11);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#d1d5e0;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#a0a8bc}
html{scrollbar-width:thin;scrollbar-color:#d1d5e0 transparent}
/* NAV */
.topbar{display:flex;align-items:center;padding:14px 28px;gap:20px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
.topbar-brand{text-decoration:none;flex-shrink:0;line-height:1.1}
.topbar-brand-project{display:block;font-size:8px;font-weight:700;letter-spacing:2px;color:var(--soft)}
.topbar-brand-name{display:block;font-size:16px;font-weight:800;color:var(--text)}
.topbar-nav{flex:1;display:flex;justify-content:center}
.nav-pill{display:inline-flex;align-items:center;gap:2px;background:#fff;border-radius:999px;padding:5px 7px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.nav-item{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:400;color:var(--muted);text-decoration:none;transition:.15s}
.nav-item:hover,.nav-item.active{background:var(--bg);color:var(--text);font-weight:600}
.nav-item-wrap{position:relative}
.nav-item-wrap:hover .nav-dropdown{display:block}
.nav-dropdown{display:none;position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.10);min-width:170px;padding:6px;z-index:500}
.nav-dropdown-item{display:flex;align-items:center;padding:8px 12px;font-size:13px;color:#4a4e69;text-decoration:none;border-radius:8px;font-weight:500;transition:.15s}
.nav-dropdown-item:hover{background:var(--bg);color:var(--primary)}
.nav-dropdown-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;overflow:hidden;border:none}
.avatar-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.10);min-width:176px;overflow:hidden;z-index:999}
.avatar-menu.open{display:block}
.avatar-menu-name{padding:11px 15px 7px;font-size:12px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border)}
.avatar-menu a{display:flex;align-items:center;padding:9px 15px;font-size:13px;color:#4a4e69;text-decoration:none}
.avatar-menu a:hover{background:var(--bg)}
.avatar-menu button{width:100%;padding:9px 15px;background:none;border:none;border-top:1px solid var(--border);text-align:left;font-family:var(--font);font-size:13px;color:var(--danger);cursor:pointer}
/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:0 28px 60px}
/* HERO */
.hero{height:240px;background:linear-gradient(135deg,#1a3a6b 0%,#1a6fdb 60%,#3b8be8 100%);position:relative;overflow:hidden;margin:0 -28px}
.hero-img{width:100%;height:100%;object-fit:cover;display:block}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(10,20,50,.6))}
/* IDENTITY */
.identity-row{display:flex;align-items:flex-end;gap:20px;padding:0;margin:-50px 0 28px;position:relative;z-index:2}
.port-avatar{width:90px;height:90px;border-radius:18px;background:#fff;border:3px solid #fff;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.port-avatar img{width:100%;height:100%;object-fit:cover}
.port-avatar svg{color:var(--soft)}
.identity-info{flex:1;padding-bottom:4px}
.port-name{font-size:26px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.port-meta-row{display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.port-country-lbl{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.locode-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:var(--primary-soft);color:var(--primary-dark);border-radius:7px;font-size:12px;font-weight:700;font-family:monospace;letter-spacing:.05em}
.port-type-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:7px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted)}
.identity-actions{padding-bottom:6px;display:flex;gap:10px;flex-shrink:0}
.btn{height:40px;padding:0 18px;border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(26,111,219,.22)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--line-strong)}
/* TWO-COL */
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
/* CARDS */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
/* DL GRID */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dl3{grid-template-columns:1fr 1fr 1fr}
.dl4{grid-template-columns:1fr 1fr 1fr 1fr}
.dt{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-bottom:4px}
.dd{font-size:13.5px;font-weight:500;color:var(--text)}
/* SUB-CARD */
.sub-card{background:#fafbfe;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:12px}
.sub-card:last-child{margin-bottom:0}
.sub-card-title{font-size:12px;font-weight:700;color:var(--primary-dark);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.sub-card-title::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--primary)}
/* TERMINAL LIST */
.terminal-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-bottom:8px;transition:.14s}
.terminal-item:hover{border-color:var(--primary-mid)}
.terminal-icon{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--primary)}
.terminal-info{flex:1}
.terminal-name{font-size:13.5px;font-weight:600;color:var(--text)}
.terminal-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
/* MAP */
.map-box{height:260px;border-radius:11px;overflow:hidden;border:1.5px solid var(--line);background:#0f1a2e;position:relative}
.map-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.3)}
.map-placeholder p{font-size:12px;font-weight:500}
/* EMPTY */
.empty-state{padding:24px;text-align:center;color:var(--soft);font-size:13px}
/* SKEL */
.skel-line{height:16px;background:var(--line);border-radius:6px;margin-bottom:10px;animation:shimmer 1.5s infinite}
.skel-line.short{width:60%}.skel-line.med{width:80%}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
/* TOAST */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:var(--text);color:#fff;padding:13px 22px;border-radius:11px;font-weight:600;font-size:13.5px;opacity:0;visibility:hidden;transition:opacity .25s,transform .28s cubic-bezier(.2,.8,.2,1),visibility .25s;z-index:1000}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;box-shadow:var(--shadow-lg)}
.toast.err{background:var(--danger)}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}.dl4{grid-template-columns:1fr 1fr}.identity-row{flex-wrap:wrap}}
@media(max-width:600px){.wrap{padding:0 16px 60px}.dl,.dl3{grid-template-columns:1fr}.hero{margin:0 -16px}}
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="topbar-brand">
    <span class="topbar-brand-project">PROJECT</span>
    <span class="topbar-brand-name">Manhattan.</span>
  </a>
  <div class="topbar-nav">
    <div class="nav-pill">
      <a href="home-logged-in.html" class="nav-item">Home</a>
      <div class="nav-item-wrap">
        <a href="#" class="nav-item active">Atlas</a>
        <div class="nav-dropdown">
          <a href="Species.html" class="nav-dropdown-item">Species</a>
          <a href="cold-storage-list.html" class="nav-dropdown-item">Cold Storage</a>
          <a href="port-list.html" class="nav-dropdown-item active">Ports</a>

  <div class="topbar-right">

      <div class="avatar-menu" id="avatarMenu">
        <div class="avatar-menu-name" id="avatarGreeting">Hello!</div>
        <a href="profile.html">Profile</a>

      </div>

</div>

<!-- HERO -->
<div class="hero" id="heroBox">
  <div class="hero-overlay"></div>
</div>

<div class="wrap">
  <!-- IDENTITY -->
  <div class="identity-row" id="identityRow">
    <div class="port-avatar" id="portAvatar">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
    </div>
    <div class="identity-info">
      <div class="port-name" id="portName">Loading…</div>
      <div class="port-meta-row">
        <div class="port-country-lbl" id="portCountry">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/></svg>
          —
        </div>
        <div class="locode-badge" id="portLocode" style="display:none"></div>
        <div class="port-type-badge" id="portTypeBadge" style="display:none"></div>
      </div>
    </div>
    <div class="identity-actions" id="editActions" style="display:none">
      <a href="#" class="btn btn-primary" id="editBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit Port
      </a>
    </div>
  </div>

  <div class="main-grid">
    <!-- LEFT -->
    <div>
      <!-- PORT DETAILS -->
      <div class="card">
        <div class="card-head"><div class="card-title">Port Details</div></div>
        <div id="detailsBody">
          <div class="skel-line med"></div><div class="skel-line short"></div><div class="skel-line med"></div>
        </div>
      </div>

      <!-- TERMINALS -->
      <div class="card">
        <div class="card-head">
          <div class="card-title">Terminals & Wharves</div>
          <span id="terminalCount" style="font-size:12px;font-weight:600;color:var(--soft)"></span>
        </div>
        <div id="terminalsBody"><div class="empty-state">Loading…</div></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div>
      <!-- MAP -->
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:18px">
        <div class="card-head" style="padding:16px 18px 12px">
          <div class="card-title">Location</div>
          <span id="coordsLbl" style="font-size:12px;color:var(--soft);font-family:monospace"></span>
        </div>
        <div class="map-box" id="mapBox">
          <div class="map-placeholder" id="mapPlaceholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <p>No coordinates recorded</p>
          </div>
        </div>
      </div>

      <!-- QUICK FACTS -->
      <div class="card" style="margin-bottom:18px">
        <div class="card-head"><div class="card-title">Quick Facts</div></div>
        <div id="quickFacts">
          <div class="skel-line short"></div><div class="skel-line med"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://enbdaajcromxmhgcverp.supabase.co';
const SUPABASE_KEY='sb_publishable_NxQj3wE3UqijQVwwUNCfxg_f2uFLRz5';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=v=>`<div class="dd">${esc(v||'—')}</div>`;
const vid=new URLSearchParams(location.search).get('id');

function renderDetails(p){
  $('detailsBody').innerHTML=`
    <div class="dl dl3" style="margin-bottom:18px">
      <div><div class="dt">Main Port Name</div>${val(p.main_port_name)}</div>
      <div><div class="dt">Alternate Name</div>${val(p.alternate_port_name)}</div>
      <div><div class="dt">UN/LOCODE</div><div class="dd" style="font-family:monospace;font-weight:700;color:var(--primary-dark)">${esc(p.un_locode||'—')}</div></div>
    </div>
    <div class="dl dl4" style="margin-bottom:18px">
      <div><div class="dt">Country</div>${val(p.country)}</div>
      <div><div class="dt">Region</div>${val(p.region_name)}</div>
      <div><div class="dt">Water Body</div>${val(p.world_water_body)}</div>
      <div><div class="dt">Nautical Chart</div>${val(p.standard_nautical_chart)}</div>
    </div>
    <div class="dl dl4" style="margin-bottom:18px">
      <div><div class="dt">Port Type</div>${val(p.port_type)}</div>
      <div><div class="dt">Harbor Type</div>${val(p.harbor_type)}</div>
      <div><div class="dt">Harbor Size</div>${val(p.harbor_size)}</div>
      <div><div class="dt">Vessel Traffic Service</div>${val(p.vessel_traffic_service)}</div>
    </div>
    <div class="dl">
      <div><div class="dt">Port Authority</div>${val(p.port_authority)}</div>
      <div><div class="dt">Ownership</div>${val(p.ownership)}</div>
    </div>
    ${p.berth?`<div style="margin-top:14px"><div class="dt">Berth</div>${val(p.berth)}</div>`:''}`;
}

function renderTerminals(terms){
  const el=$('terminalsBody');
  $('terminalCount').textContent=terms.length?`${terms.length} terminal${terms.length>1?'s':''}`:'' ;
  if(!terms.length){ el.innerHTML='<div class="empty-state">No terminals recorded for this port.</div>'; return; }
  el.innerHTML=terms.map(t=>`<div class="terminal-item">
    <div class="terminal-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    </div>
    <div class="terminal-info">
      <div class="terminal-name">${esc(t.terminal_name)}</div>
      <div class="terminal-meta">
        ${t.terminal_type?`<span>${esc(t.terminal_type)}</span>`:''}
        ${t.terminal_wharf_type?`<span>${esc(t.terminal_wharf_type)}</span>`:''}
        ${t.berth?`<span>Berth: ${esc(t.berth)}</span>`:''}
        ${t.latitude&&t.longitude?`<span style="font-family:monospace">${parseFloat(t.latitude).toFixed(4)}, ${parseFloat(t.longitude).toFixed(4)}</span>`:''}
      </div>
    </div>
  </div>`).join('');
}

function renderQuickFacts(p){
  $('quickFacts').innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">
    ${[
      ['Port Type', p.port_type],
      ['Ownership', p.ownership],
      ['Harbor Size', p.harbor_size],
      ['VTS', p.vessel_traffic_service],
      ['UN/LOCODE', p.un_locode],
    ].filter(([,v])=>v).map(([l,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
      <span style="font-size:12px;color:var(--soft);font-weight:600">${esc(l)}</span>
      <span style="font-size:13px;font-weight:600;color:var(--text);text-align:right;max-width:60%">${esc(v)}</span>
    </div>`).join('')}
  </div>`;
}

function renderMap(p){
  if(!p.latitude||!p.longitude){ return; }
  const lat=parseFloat(p.latitude), lon=parseFloat(p.longitude);
  $('coordsLbl').textContent=`${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  $('mapPlaceholder').style.display='none';
  $('mapBox').innerHTML=`<iframe width="100%" height="100%" frameborder="0" style="border:0" loading="lazy"
    src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-.15}%2C${lat-.12}%2C${lon+.15}%2C${lat+.12}&layer=mapnik&marker=${lat}%2C${lon}" allowfullscreen></iframe>`;
}

function renderHeader(p){
  $('portName').textContent=p.main_port_name;
  document.title=`${p.main_port_name} · Project Manhattan`;
  $('portCountry').innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/></svg> ${esc(p.country||'—')}${p.region_name?' · '+esc(p.region_name):''}`;
  if(p.un_locode){ const lb=$('portLocode'); lb.textContent=p.un_locode; lb.style.display='inline-flex'; }
  if(p.port_type){ const tb=$('portTypeBadge'); tb.textContent=p.port_type; tb.style.display='inline-flex'; }
  if(p.photo_url){
    const hero=$('heroBox');
    hero.innerHTML=`<img class="hero-img" src="${esc(p.photo_url)}" alt="${esc(p.main_port_name)}"/><div class="hero-overlay"></div>`;
  }
}

(async function init(){
  if(!vid){location.href='port-list.html';return;}
  const {data:{user}}=await sb.auth.getUser();
  if(!user){location.href='login.html';return;}
  const {data:profile}=await sb.from('profiles').select('role,first_name,last_name,avatar_color,photo_url').eq('id',user.id).single();
  const isAdmin=profile&&['admin','operator'].includes(profile.role);
  const first=profile?.first_name||user.email.split('@')[0];
  if(profile?.photo_url) $('avatarBtn').innerHTML=`<img src="${profile.photo_url}" style="width:100%;height:100%;object-fit:cover">`;
  else{ $('avatarBtn').style.background=profile?.avatar_color||'#1a6fdb'; $('avatarInitials').textContent=((first[0]||'')+(profile?.last_name?.[0]||'')).toUpperCase()||'··'; }
  $('avatarGreeting').textContent=`Hello, ${first}!`;
  if(isAdmin){ $('editActions').style.display='flex'; $('editBtn').href=`port.html?id=${vid}`; }
  // Load port
  const {data:p,error}=await sb.from('ports').select('*').eq('id',vid).single();
  if(error||!p){toast('Port not found','err');return;}
  renderHeader(p);
  renderDetails(p);
  renderMap(p);
  renderQuickFacts(p);
  // Load terminals
  const {data:terms}=await sb.from('port_terminals').select('*').eq('port_id',vid).order('terminal_name');
  renderTerminals(terms||[]);
})();

function toggleAvatarMenu(){ $('avatarMenu').classList.toggle('open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('.avatar-btn')) $('avatarMenu')?.classList.remove('open'); });
async function handleLogout(){ await sb.auth.signOut(); location.href='index.html'; }
function toast(msg,type=''){
  const t=$('toast'); t.textContent=msg;
  t.className='toast show'+(type==='err'?' err':'');
  setTimeout(()=>t.className='toast',3200);
}
</script>
